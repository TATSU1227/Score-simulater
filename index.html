{from:6,to:13,fam:"water",tag:"Doux et fluide",
 title:"Doux et fluide — 和音がひとつもない8小節",
 ital:"Doux et fluide / ここから2倍の速さ（m.7–12）",
 body:["<span class=\"chord\">E4–E5–E6</span> を軸に、旋律が3オクターヴのユニゾンで流れます。この場面には<b>和音がひとつもありません</b>。単旋律を3つの高さで重ねているだけ。<span class=\"chord\">E C♯ D♯ G♯ A♯ B</span> と動く線は嬰ハ短調／ホ長調の色です。",
 "そしてここが<b>テンポの謎の第一の場所</b>。記譜は2分音符主体で、冒頭の速さのまま弾くと音楽が急に停滞します。ドビュッシー自身のピアノロールでは、この6小節は2倍の速さで流れていました。「やわらかく、流れるように」という指示は、そう弾いて初めて意味を持ちます。",
 "m.11 に <em>cresc.</em>、m.12 に <em>dim.</em> と p、m.13 で pp。ひと息ぶんの膨らみと収縮が、たった2小節で完結します。"],
 notes:[["色","冒頭のG中心の世界から、E／C♯の世界へ。転調というより、照明の色が変わる感じです。"],
 ["2倍問題","この読み方は初版（Durand, 1910）には書かれていません。ヘンレ版など新しい楽譜には注記があります。設定で切り替えて聴き比べられます。"]],
 tech:[["01","3オクターヴのユニゾンは、真ん中の音がいちばん目立ちやすい。意識して上と下を出し、真ん中を引くと、鐘のような広がりが出ます。"],
 ["02","「流れるように」は速さではなく途切れなさ。音と音のあいだで手首が止まらないよう、前腕を横に滑らせ続ける。"],
 ["03","cresc.–dim. は音量よりも打鍵速度で。速く沈めれば明るく、ゆっくり沈めれば丸くなります。"],
 ["04","m.13 の終わりで低音 <span class=\"chord\">E1–E2</span> と <span class=\"chord\">D1–D2</span> が置かれます。次の場面の土台なので、ここは指ではなく腕の重さで。"]]},

{from:14,to:15,fam:"mist",tag:"Sans nuances",
 title:"冒頭の形がハ音の上に戻る — 抑揚をつけずに",
 ital:"pp / (sans nuances)",
 body:["低音が <span class=\"chord\">C1–C2–G1</span> に変わり、その上に m.1 とまったく同じ五度の連なりが乗ります。図形は同じ、土台だけが違う。この曲は最後まで、この「同じものを違う場所に置く」だけで進みます。",
 "指示は <em>(sans nuances)</em>＝<b>抑揚をつけずに</b>。表情を作るなと명示的に書かれている、珍しい指定です。ここで平らにしておくからこそ、次の m.16「少しずつ霧の中から現れて」が効きます。"],
 notes:[["構造","m.1–5 と m.14–15 で、序奏がひとつの円として閉じます。G中心 → C中心へ移動しただけ。"],
 ["伏線","この C の上の五度の形は、m.84 のコーダでもう一度そのまま戻ってきます。"]],
 tech:[["01","sans nuances は「無表情に」ではなく「振幅ゼロで」。音色は保ったまま、強弱の起伏だけを消します。"],
 ["02","全部の音を同じ深さで置くのは、実は最も難しい打鍵。片手ずつ、目を閉じて粒を揃える練習を。"],
 ["03","ペダルは2小節通して1回でも成立します。C の保続が濁らない範囲で、できるだけ長く。"]]},

{from:16,to:18,fam:"rise",tag:"Sortant",
 title:"Peu à peu sortant de la brume — 水面が動きだす",
 ital:"pp / Peu à peu sortant de la brume",
 body:["ロ長調。<span class=\"chord\">B0</span> という鍵盤のほぼ最低音が置かれ、その上で <span class=\"chord\">B1–F♯2</span> が3連符で細かく揺れます。<b>この曲で初めて「動くもの」が現れる場面</b>です — 水面のさざなみ。",
 "上には <span class=\"chord\">D♯–F♯–B</span>、<span class=\"chord\">G♯–C♯</span> の和音。m.17・m.18 は m.16 とほぼ同じ形の反復で、そのたびに上声の <span class=\"chord\">G♯6 / D♯6</span> が加わって、輪郭が少しずつ濃くなります。",
 "「少しずつ霧の中から現れて」。まだ建物は見えず、水と光だけが動いている段階です。"],
 notes:[["リズム","3連符が入るのはこの場面から。均等な6/4の中に、割り切れない揺れが差し込まれます。"],
 ["調","ロ長調は、ハ音の世界から見ると半音下。近いようで遠い、蜃気楼のような位置です。"]],
 tech:[["01","3連符は数えない。手首の左右の揺れに任せて、拍に合わせにいかないこと。合わせにいくと水ではなく機械になります。"],
 ["02","B0 は打鍵というより「置く」。強く弾くと唸りが出て濁ります。ペダルで支えて、指は最小限。"],
 ["03","同じ形が3回。1回目より2回目、2回目より3回目とわずかに明るく。ただし音量ではなく、上声の存在感で。"]]},

{from:19,to:21,fam:"rise",tag:"Augmentez",
 title:"変ホ長調へ — 少しずつ大きく、ただし急がずに",
 ital:"p / marqué → Augmentez progressivement (sans presser)",
 body:["m.19 で <span class=\"chord\">E♭1</span> の保続に乗り換え、<em>marqué</em>（はっきりと）。<span class=\"chord\">B♭–E♭–G</span> の和音と <span class=\"chord\">G F E♭ D C</span> の下行が組み合わさり、音楽が初めて「歌」らしい形を取ります。",
 "m.20 に <em>Augmentez progressivement (sans presser)</em>。<b>少しずつ大きくしていって、ただし急がずに</b>。crescendo は書かれているが accelerando は明確に禁じられている、という点が重要です。",
 "m.21 では両手が同じ音型をオクターヴで重ね、厚みだけが増していきます。次の小節で f に到達する準備。"],
 notes:[["設計","B（m.16）→ E♭（m.19）→ C（m.22）。三度ずつ動く低音が、聴き手を知らないうちに主調へ連れ戻します。"],
 ["禁止","「急がずに」はドビュッシーの頻出指示。盛り上がり＝速くする、という反射を封じています。"]],
 tech:[["01","crescendo を速さで代用しない。メトロノームを鳴らしたまま、音量だけを増やす練習が効きます。"],
 ["02","m.21 のオクターヴは、両手の下の音（左手）を土台に。上だけ出すと薄くなり、下だけ出すと鈍くなります。"],
 ["03","marqué は「強く」ではなく「輪郭をはっきり」。打鍵の底までの時間を短くすると、音量を上げずに輪郭が立ちます。"]]},

{from:22,to:27,fam:"rise",tag:"Montée",
 title:"五度の主題が f で戻る — ここから m.83 まで2倍の速さ",
 ital:"f / 2分音符＝4分音符（m.22–83）",
 body:["m.22 は m.1 とまったく同じ <span class=\"chord\">G–D–A</span> の形。ただし今度は <em>f</em>、そして音価が倍に書かれています。<b>ドビュッシーが書き忘れた2つめのテンポ変更</b>が、ここから m.83 まで続きます。額面どおりに弾くと、曲の3分の2が葬列になってしまう。",
 "m.23–24 で <span class=\"chord\">D–F–G–A–C</span> の和音が高音域まで駆け上がり、鐘が近づいてきます。m.25 からは同じ和音を保ったまま低音が <span class=\"chord\">D–C–A–G–F–D</span> と降りていく。",
 "上は明るく、下は沈む。この反対方向の動きが、次の ff の巨大な土台を敷きます。"],
 notes:[["同一性","m.1 と m.22 は同じ音・同じ形。「同じものを、違う速さと違う音量で」というこの曲の方法が、ここで最もはっきり出ます。"],
 ["音域","m.23–24 で C7 まで到達。水面のきらめきが、いちばん高いところまで届く瞬間です。"]],
 tech:[["01","f になっても平行五度は硬くしない。指先で叩くと石ではなく金属の音になります。腕全体の重さを、時間をかけて落とす。"],
 ["02","高音域の和音は、最上音を最後に着地させるくらいの気持ちで。上から先に鳴ると響きが痩せます。"],
 ["03","m.25 からの低音下行は、ここだけを取り出して何度も。この線が聞こえるかどうかで m.28 の説得力が決まります。"]]},

{from:28,to:41,fam:"organ",tag:"Sonore",
 title:"大聖堂が現れる — Sonore sans dureté, ff",
 ital:"ff → fff (m.38) / Sonore sans dureté",
 body:["<span class=\"chord\">C1</span> の保続の上に、根音位置の三和音がそのまま並びます。<span class=\"chord\">C–E–G</span>、<span class=\"chord\">D–F–A</span>、<span class=\"chord\">G–B–D</span>、<span class=\"chord\">A–C–F</span>… オルガンの全奏です。曲の中心にあたる14小節。",
 "指示は <em>Sonore sans dureté</em>＝<b>よく響かせて、しかし硬くならずに</b>。ドビュッシーの ff は「叩く」ではなく「鳴らす」。ここを打楽器的に弾くと、大聖堂ではなく工事現場になります。",
 "m.36 で <em>cresc.</em>、m.38 で <mark>fff</mark> — 全曲の頂点。<span class=\"chord\">B♭</span> を含む和音（G–B♭–D、F–A–C）が入り、純粋なハ長調が一瞬だけ翳ります。m.40 で f、m.41 でさらに減衰。"],
 notes:[["和声","機能和声というより、同じ形の三和音を平行移動させている感覚。旋法的（ミクソリディア／エオリア）に響きます。"],
 ["低音","C1 は8va bassa。両手の第3指でオクターヴを取る、というジーゼキングの助言が知られています。"]],
 tech:[["01","ff は手首を固めずに。肘から先を一本の棒にせず、脱力したまま体重を落とす。硬さは必ず手首から生まれます。"],
 ["02","和音の最上音（旋律）だけを他より深く。全部を同じ力で弾くと、和音の塊にしか聞こえません。"],
 ["03","ペダルは和音ごとに完全に踏み替える。低音 C を残したい誘惑がありますが、濁った ff は迫力ではなく騒音になります。"],
 ["04","m.38 の fff のあと、m.40–41 の減衰こそ聴かせどころ。頂点で止まらず、退場までを一続きの動作で。"]]},

{from:42,to:46,fam:"organ",tag:"Descente",
 title:"鐘だけが残る — そして A♭ が G♯ に書き換わる",
 ital:"p (m.42) → pp (m.44)",
 body:["<span class=\"chord\">G–C–D</span> の和音と、その上の高い <span class=\"chord\">C6–D6 / C7–D7</span> の鐘。オルガンは去り、鐘の響きだけが残ります。低音は <span class=\"chord\">B♭</span>（m.42–43）→ <span class=\"chord\">A♭</span>（m.44–45）と半音ずつ沈む。",
 "そして m.46。同じ音が <mark>A♭ → G♯</mark> と綴り替えられます。<b>音は一つも変わらないのに、役割だけが変わる</b>。ハ長調の世界の住人だった A♭ が、嬰ハ短調の属音 G♯ として生まれ変わり、次の場面の扉になります。",
 "ドビュッシーの転調のうち、いちばん静かで、いちばん劇的な一手です。"],
 notes:[["綴り","異名同音の書き換えは楽譜を見なければ気づけません。耳では同じ音、目には別の音。"],
 ["音域","高い C–D の鐘は、m.22–24 で近づいてきた鐘の残響。だんだん遠ざかっていきます。"]],
 tech:[["01","高音の鐘は打鍵後すぐ離す。ペダルに預けて、指は次の準備へ。押さえ続けると響きが伸びずに固まります。"],
 ["02","低音の半音下行（B♭→A♭）は、聞こえるか聞こえないかの境目で。ここが聞こえすぎると、m.46 の書き換えが台無しになります。"],
 ["03","m.46 では時間を止めない。書き換えは目の出来事であって、演奏上は何事もなかったように通過するのが正解です。"]]},

{from:47,to:54,fam:"water",tag:"Moins lent",
 title:"Un peu moins lent — 水の中の歌が始まる",
 ital:"Un peu moins lent (dans une expression allant grandissante)",
 body:["<span class=\"chord\">G♯</span> の保続の上、中音域に裸の旋律 <span class=\"chord\">E – C♯ – D♯ – G♯ – E – C♯</span>。m.6–13 の素材が、嬰ハ短調で戻ってきたものです。伴奏はなく、線が一本あるだけ。",
 "「少しだけ速く（これまでほど遅くなく）、だんだん大きくなっていく表情で」。m.52 から和音が付きはじめ、m.53–54 では <span class=\"chord\">D♯–G♯–A♯</span> が3オクターヴに広がって、水中の光量が上がっていきます。",
 "大聖堂は今、水面のすぐ下にいます。"],
 notes:[["回帰","m.6–13 の旋律が主役として戻る。序奏で通り過ぎた素材が、中間部の主題になるという設計です。"],
 ["調","嬰ハ短調は、ハ長調から見ると最も遠い側。m.46 の G♯ 一音だけでそこまで連れて行かれました。"]],
 tech:[["01","m.47–51 の単旋律は、最も難しい場所のひとつ。何も隠せません。1音ずつの長さと重さを、録音して確かめる価値があります。"],
 ["02","「moins lent」を速すぎに取らない。冒頭より一段だけ前に出る程度で、走ると水の重さが消えます。"],
 ["03","G♯ の保続はペダルで。左手は保続と旋律を兼ねるので、指の保持ではなく耳で残響を管理する。"],
 ["04","m.53 からの和音は、旋律に「厚みが加わる」のであって「和音が始まる」のではない。線を見失わないように。"]]},

{from:55,to:61,fam:"rise",tag:"Grandissant",
 title:"水中で高まる — 二度目の ff",
 ital:"p → f (m.59) → ff (m.61)",
 body:["<span class=\"chord\">F♯–A–C♯</span> の和音が <span class=\"chord\">G♯</span> の保続の上で揺れ、少しずつ厚みを増していきます。m.56・m.57 に <em>cresc.</em>、m.59 で <em>f</em>、m.60 でさらに <em>cresc.</em>、そして m.61 で <mark>ff</mark>。",
 "同じ ff でも m.28 とは音色がまるで違います。あちらはハ長調の三和音を低音域で固めた「石」の響き。こちらは嬰ハ短調で、高音域が <span class=\"chord\">C♯7</span> まで開いている。強いのに遠い、水を通して見ているような ff です。",
 "m.60 の <span class=\"chord\">B–C♯–D♯–F♯</span> から m.61 の <span class=\"chord\">C♯–E–F♯–A</span> へ。ここが第二の頂点にあたります。"],
 notes:[["対比","二つの ff（m.28 と m.61）が、この曲の二本の柱。片方は水の上、片方は水の中です。"],
 ["書法","右手が和音、左手も和音、そのあいだに保続音。3層構造が終始保たれています。"]],
 tech:[["01","この ff は m.28 より軽く。音量を同じにすると、水中である感じが消えます。上限を意図的に下げる。"],
 ["02","高音域が開いているぶん、最上声を出しすぎると鋭くなる。内声をしっかり鳴らして、外側を包む。"],
 ["03","cresc. の区間が長いので、早く到達しないこと。m.59 の f で7割、m.61 で10割という配分が安全です。"]]},

{from:62,to:71,fam:"water",tag:"Sinking",
 title:"沈んでいく — dim. のなかで水の揺れが始まる",
 ital:"dim. / f → p → pp",
 body:["m.62 から和音が下行しはじめます。<span class=\"chord\">G♯–B♯–D♯–F♯</span>、<span class=\"chord\">A♯–C♯–D♯–F𝄪</span>。<mark>F𝄪</mark>（重嬰ヘ）まで登場する、この曲でいちばん複雑に綴られた場所です。都が水に呑まれていく数小節。",
 "m.66 で <span class=\"chord\">G♯1</span> だけが残り、m.68 で <span class=\"chord\">F♯1–G♯1</span>、そして m.70 から <span class=\"chord\">C2–D2</span> の往復が始まります。<b>この揺れは m.83 まで一度も止まりません</b>。水そのものです。",
 "強弱は f → p → pp と段階的に落ち、m.71 でさらに dim.。あとは水面の下だけが残ります。"],
 notes:[["綴り","重嬰記号は、和声の役割を保つための表記。演奏上は G♮ ですが、書き方が意味を持っています。"],
 ["転換","嬰ハ短調の世界が C–D の揺れに吸収されて、ハ音の世界へ戻る。転調ではなく、溶解です。"]],
 tech:[["01","C–D の往復は、拍を感じさせない。左手の重心を C 側にわずかに置くと、揺れが自然に一方向へ流れます。"],
 ["02","dim. の途中でテンポを落とさない。遅くすると「終わり」に聞こえてしまい、まだ半分残っていることが伝わりません。"],
 ["03","m.70–71 の2小節は、次の場面の伴奏の前置き。ここでテンポと音量を確定させておくと、m.72 が静かに始められます。"]]},

{from:72,to:83,fam:"organ",tag:"Flottant",
 title:"Flottant et sourd — 水中から聞こえるコラール",
 ital:"pp / au Mouv.t — Comme un écho de la phrase entendue précédemment",
 body:["楽譜には「さきほど聞こえたフレーズのこだまのように」「漂って、くぐもって」と書かれています。m.28 で <em>ff</em> で鳴っていた大聖堂のコラールが、<b>同じ和音のまま pp で</b>、しかも <span class=\"chord\">C–D–C–G–C–G</span> の揺れの中に沈められて戻ってきます。",
 "同じ音楽を二度、水の上と水の下で鳴らす。この曲の設計はほとんどそれだけです。ドビュッシーは音量と登録（音域）だけで、聴き手を水面の上下に移動させました。",
 "m.80 で一瞬 <em>cresc.</em>（水面近くまで浮かぶ）、m.81 で <em>dim.</em> と p、m.82 で pp。以後は沈むだけです。"],
 notes:[["登録","コラールは中音域に置かれ、上下を伴奏に挟まれています。オルガンのストップを一段落とした状態。"],
 ["聴き方","右手の内声だけを追うと m.28 の和音進行がそのまま聞こえます。並べて弾き比べると設計が見えます。"]],
 tech:[["01","伴奏の C–D は、旋律より小さく、かつ<b>途切れなく</b>。音量を落とすと止まりやすいので、指を鍵盤から離さない運指を組む。"],
 ["02","コラールの和音は、拍の頭に置くのではなく、揺れの中から浮かび上がらせる。ほんのわずかに遅らせると水中らしくなります。"],
 ["03","ペダルは浅く、しかし常に。完全に上げると水がなくなり、深く踏むと和音が濁ります。半分の位置を探る。"],
 ["04","m.28 を弾いてすぐこの場面を弾く練習を。同じ和音だと自分の耳で確認できると、音の作り方が変わります。"]]},

{from:84,to:89,fam:"mist",tag:"Coda",
 title:"Dans la sonorité du début — 冒頭の響きのなかで",
 ital:"pp / Dans la sonorité du début",
 body:["冒頭の五度の連なりが、今度は <span class=\"chord\">C1</span> の上に戻ってきます。最高音は <span class=\"chord\">G6–C7–D7–G7</span>。序奏（m.14–15）で予告されていた「C の上の冒頭figure」が、ここで正式に置かれます。",
 "m.86–87 で <span class=\"chord\">C–E–G</span> の和音がゆっくり二度置かれ、最後に <span class=\"chord\">C1–G1–C2</span>。全曲を通じてほとんど鳴らなかった<b>三度を含む純粋なハ長調の和音</b>が、いちばん最後に静かに現れます。",
 "m.88–89 に音符はありません。ペダルに残った響きだけが鳴っている2小節で、これも作品の一部です。都はふたたび海の底へ戻りました。"],
 notes:[["円環","G の上で始まり、C の上で終わる。同じ図形が、五度だけ移動して閉じます。"],
 ["題名","前奏曲集の慣例どおり、題名は曲の終わりに小さく置かれます。まず音を聴かせ、あとから「これは沈める寺でした」と告げる順序。"]],
 tech:[["01","m.84 は「戻ってきた」のであって「始まった」のではない。冒頭より確実に弱く、確実に遅く。"],
 ["02","m.86–87 の和音は、下から上へごくわずかな時間差で。同時に打鍵すると、この音域では硬くなります。"],
 ["03","最後の低音を離すタイミングが、この曲の最後の表現。響きが自然に痩せきるまで、ペダルを上げない。"],
 ["04","弾き終えて手を鍵盤から上げるまでの数秒も演奏のうち。m.88–89 は「何もしない」のではなく「待つ」小節です。"]]}
];

/* 標語の訳 */
const GLOSS=[
 [/profondément calme/i,'深く静かに'],
 [/brume doucement sonore/i,'やわらかく響く霧のなかで'],
 [/doux et fluide/i,'やわらかく、流れるように'],
 [/sans nuances/i,'抑揚をつけずに'],
 [/sortant de la brume/i,'少しずつ霧の中から現れて'],
 [/marqué/i,'はっきりと'],
 [/augmentez progressivement/i,'少しずつ大きくしていって'],
 [/sans presser/i,'急がずに（速くしない）'],
 [/sonore sans dureté/i,'よく響かせて、硬くならずに'],
 [/un peu moins lent/i,'少しだけ速く（これまでほど遅くなく）'],
 [/grandissante/i,'だんだん大きくなっていく表情で'],
 [/au mouv/i,'もとの速さに戻して'],
 [/comme un écho/i,'こだまのように'],
 [/phrase entendue précédemment/i,'さきほど聞こえたフレーズの'],
 [/flottant et sourd/i,'漂うように、くぐもって'],
 [/sonorité du début/i,'冒頭の響きのなかで'],
 [/cresc\./i,'だんだん強く'],
 [/dim\./i,'だんだん弱く']
];
const FAMPAL={
  dark :{mist:'#a9c6d8',water:'#79a9ae',organ:'#d7b26d',rise:'#cf8f74'},
  light:{mist:'#5b7d93',water:'#2c6d70',organ:'#8f6b1c',rise:'#a8563a'}
};
const FAMLINE=new Proxy({},{get:(t,k)=>FAMPAL[CO.name][k]});
const DYNGL={ppp:'きわめて弱く',pp:'とても弱く',p:'弱く',mp:'やや弱く',mf:'やや強く',f:'強く',ff:'とても強く'};
function glossOf(t){
  if(!t) return '';
  const out=[];
  for(const [re,jp] of GLOSS) if(re.test(t)&&out.indexOf(jp)<0) out.push(jp);
  return out.join(' ／ ');
}
function cleanMk(t){
  let x=(t||'')
    .replace(/au Mouv\s*t/i,'au Mouv.t')
    .replace(/Mouv\s*t/i,'Mouv.t')
    .replace(/\s+/g,' ').trim();
  return x;
}
const SECOF={};
SEC.forEach((s,i)=>{for(let n=s.from;n<=s.to;n++) SECOF[n]=i;});

/* 標語・強弱のイベント表 */
const MK=[];
for(let i=0;i<MCOUNT;i++){
  const t=(MS[i].mk||'').trim(), dy=[...new Set((MS[i].dy||[]).map(d=>d[1]))];
  if(t||dy.length) MK.push({i:i,n:MS[i].n,t:t,dy:dy});
}
const DYNL=[];
(function(){let c='';
  for(let i=0;i<MCOUNT;i++){ const d=MS[i].dy||[]; if(d.length) c=d[d.length-1][1]; DYNL.push(c); }})();

/* 構造マップ */
var GREADY=false;
const gbar=$('gbar');
gbar.innerHTML=SEC.map((s,i)=>
  '<button class="gseg" data-i="'+i+'" data-fam="'+s.fam+'" style="flex-grow:'+(s.to-s.from+1)+
  '" aria-label="m.'+s.from+'–'+s.to+' '+s.tag+'"></button>').join('')+
  '<i class="gnow" id="gnow"></i>';
const gsegs=[...gbar.querySelectorAll('.gseg')], gnow=$('gnow');
gsegs.forEach(b=>b.addEventListener('click',()=>{
  const i=+b.dataset.i;
  setFollow(1); jumpToMeasure(SEC[i].from);
}));
function mapRange(){
  gsegs.forEach((b,i)=>b.classList.toggle('out', SEC[i].to<ST.rgA||SEC[i].from>ST.rgB));
}
const _rangeUI=rangeUI;
rangeUI=function(){ _rangeUI(); mapRange(); };
function setMapOn(i){ gsegs.forEach((b,k)=>b.classList.toggle('on',k===i)); }
function setMapSel(i){ gsegs.forEach((b,k)=>b.classList.toggle('sel', !GS.follow && k===i)); }

/* 位置の移動 */
function jumpToMeasure(n){
  const p=MS[n-1].start;
  if(n<ST.rgA||n>ST.rgB){
    ST.rgA=Math.min(ST.rgA,n); ST.rgB=Math.max(ST.rgB,n); rangeUI(); save(); buildMap();
  }
  if(playing) seekTo(p,1); else { anchorP=p; }
  draw();
}
function practiceSection(i){
  const s=SEC[i];
  ST.rgA=s.from; ST.rgB=s.to; rangeUI(); save(); buildMap();
  if(playing) seekTo(rangeA(),1); else anchorP=rangeA();
  draw();
}

/* 解説の描画 */
var GS={idx:-1,mi:-1,follow:1};
function renderGuide(i,anim){
  if(i==null||i<0||i>=SEC.length) i=0;
  const dir=(GS.idx<0||GS.idx===i)?0:(i>GS.idx?1:-1);   /* 進む＝1／戻る＝-1 */
  const s=SEC[i]; GS.idx=i;
  $('gfam').style.background=FAMLINE[s.fam];
  $('gtag').textContent=s.tag;
  $('gmm').textContent='m.'+s.from+'–'+s.to;
  $('gseglab').textContent=s.tag+' ／ m.'+s.from+'–'+s.to;
  const music='<div class="v-music">'+s.body.map(p=>'<p>'+p+'</p>').join('')+
    '<ul class="g-notes">'+s.notes.map(n=>'<li><b>'+n[0]+'</b>　'+n[1]+'</li>').join('')+'</ul></div>';
  const tech='<div class="v-tech"><ul class="g-notes">'+
    s.tech.map(n=>'<li><span class="g-step">'+n[0]+'</span>'+n[1]+'</li>').join('')+'</ul></div>';
  const b=$('gbody');
  b.innerHTML='<h3 class="g-ttl">'+s.title+'</h3><p class="g-ital">'+s.ital+'</p>'+music+tech;
  if(anim){
    const cls=dir>0?'g-in-next':(dir<0?'g-in-prev':'g-fade');
    b.classList.remove('g-fade','g-in-next','g-in-prev'); void b.offsetWidth; b.classList.add(cls);
  }
  setMapSel(i);
}
function updateLive(mi){
  let cur=null,nxt=null,txt=null;
  for(const e of MK){
    if(e.i<=mi){ cur=e; if(e.t) txt=e; }
    else { nxt=e; break; }
  }
  const t=cleanMk(txt?txt.t:'');
  $('gmk').innerHTML = t ? t+(txt.i<mi?'<em class="from">m.'+txt.n+'〜</em>':'') : '—';
  const d=DYNL[mi];
  $('ggl').textContent=[glossOf(txt?txt.t:''),DYNGL[d]||''].filter(Boolean).join('　/　');
  $('gdyn').innerHTML='<b>'+(d||'—')+'</b>';
  if(nxt){
    const dd=nxt.n-MS[mi].n, g=glossOf(nxt.t), lab=cleanMk(nxt.t)||nxt.dy.join(' ');
    $('gnextmk').innerHTML='次の指示 → <b>'+(lab||'—')+'</b>'+(g?'（'+g+'）':'')+
      ' m.'+nxt.n+'・あと'+dd+'小節';
  } else $('gnextmk').textContent='';
  const si=SECOF[MS[mi].n];
  if(si+1<SEC.length){
    const ns=SEC[si+1];
    $('gnextsec').innerHTML='次の場面 → <b>'+ns.tag+'</b> m.'+ns.from+'・あと'+(ns.from-MS[mi].n)+'小節';
  } else $('gnextsec').textContent='';
  const live=$('glive');
  if(cur&&cur.i===mi){ live.classList.remove('flash'); void live.offsetWidth; live.classList.add('flash'); }
}
function guideUpdate(pos){
  if(!GREADY) return;
  const mi=measureAt(pos);
  gnow.style.left=(((mi+(pos-MS[mi].start)/MS[mi].L)/MCOUNT)*100)+'%';
  if(mi!==GS.mi){
    GS.mi=mi;
    const si=SECOF[MS[mi].n];
    updateLive(mi);
    setMapOn(si);
    if(GS.follow&&si!==GS.idx) renderGuide(si,true);
  }
  const s=SEC[GS.idx];
  if(s){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    $('gprog').style.width=Math.max(0,Math.min(1,(pos-a)/(b-a)))*100+'%';
  }
}

/* 場面の色をロールの背景に薄く敷く */
function drawSectionBands(g,left){
  if(!GREADY) return;
  const right=left+W/PXP;
  g.font='9px ui-monospace,Menlo,monospace';
  for(const s of SEC){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    if(b<left||a>right) continue;
    const x0=(a-left)*PXP, x1=(b-left)*PXP;
    g.globalAlpha=s.fam==='mist'?CO.bandFar:CO.band; g.fillStyle=FAMLINE[s.fam];
    g.fillRect(x0,0,x1-x0,H);
    g.globalAlpha=0.85;
    g.strokeStyle=FAMLINE[s.fam]; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x0,0); g.lineTo(x0,H); g.stroke();
    g.fillStyle=FAMLINE[s.fam]; g.fillText(s.tag,x0+5,H-6);
    g.globalAlpha=1;
  }
}

/* 操作 */
function setFollow(v){
  GS.follow=v?1:0; ST.gfollow=GS.follow; save();
  $('gfollow').classList.toggle('on',!!GS.follow);
  $('ghint').textContent=GS.follow?'':'手動で表示中';
  if(GS.follow){ const si=SECOF[MS[Math.max(0,GS.mi)].n]; renderGuide(si,true); setMapSel(si); }
  else setMapSel(GS.idx);
}
$('gfollow').addEventListener('click',()=>setFollow(!GS.follow));
$('gprev').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.max(0,GS.idx-1),true); });
$('gnextbtn').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.min(SEC.length-1,GS.idx+1),true); });
$('gprac').addEventListener('click',()=>{ practiceSection(GS.idx); setFollow(1); });
const gview=$('gview');
[...gview.children].forEach(b=>{
  b.classList.toggle('on',b.dataset.v===ST.gview);
  b.addEventListener('click',()=>{
    ST.gview=b.dataset.v; save();
    [...gview.children].forEach(x=>x.classList.toggle('on',x===b));
    $('guide').className='guide view-'+ST.gview;
  });
});
$('guide').className='guide view-'+ST.gview;

/* 起動 */
GS.follow=ST.gfollow?1:0;
$('gfollow').classList.toggle('on',!!GS.follow);
$('ghint').textContent=GS.follow?'':'手動で表示中';
mapRange();
GREADY=true;
GS.mi=-1;
renderGuide(SECOF[MS[measureAt(anchorP)].n],false);
draw();

/* ---- 音の設定シートの開閉 ---- */
function openSheet(){ $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden','false');
  document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden'; }
function closeSheet(){ $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden','true');
  document.documentElement.style.overflow=''; document.body.style.overflow=''; resize(); draw(); }
$('openSet').addEventListener('click',openSheet);
$('closeSet').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('sheet').classList.contains('open')) closeSheet(); });
document.addEventListener('keydown',e=>{
  if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); ensureAudio(); playing?pause():start(); }
});

<\/script>

<script>
/* ---- 押した指に反応させる（iOSの :active は当てにならないので自前で） ---- */
(function(){
  var SEL='button,.sw', cur=null;
  function off(){ if(cur){ cur.classList.remove('tapdown'); cur=null; } }
  document.addEventListener('pointerdown',function(e){
    var t=(e.target&&e.target.closest)?e.target.closest(SEL):null;
    if(!t||t.disabled) return;
    off(); cur=t; t.classList.add('tapdown');
  },{passive:true});
  document.addEventListener('pointerup',off,{passive:true});
  document.addEventListener('pointercancel',off,{passive:true});
  document.addEventListener('pointermove',function(e){ if(cur&&e.buttons===0) off(); },{passive:true});
  window.addEventListener('blur',off);
})();
<\/script>

<script>
/* 親（曲の一覧）から「止めて」と言われたら、音を完全に落としてから消える */
window.addEventListener('message',function(e){
  if(!e||!e.data||e.data.cmd!=='halt') return;
  try{ if(typeof stopAll==='function') stopAll(); }catch(_){}
  try{ if(typeof ctx!=='undefined'&&ctx&&ctx.close) ctx.close(); }catch(_){}
});
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="src-bruyeres"><!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e7da">
<title>Bruyères 全曲 ｜ 採譜プレーヤー＋実況解説</title>
<style>
:root{
  --paper:#e9e7da; --panel:#f5f3e8; --line:#d6d1bd;
  --ink:#2f3229; --dim:#7c7d6c; --heather:#8f5a86; --moss:#4f7a5e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(120% 55% at 50% -10%, #f7f5ea 0%, transparent 62%), var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.7;padding:0 0 60px;-webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:20px 0 10px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--heather);margin:0 0 9px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:29px;line-height:1.25;margin:0 0 6px}
h1 em{font-style:italic}
.sub{color:var(--dim);font-size:13px;margin:0}
.lead{color:#4c5044;font-size:14px;margin:14px 0 0}
.lead b{color:var(--ink);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:14px 0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.transport{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn{background:#eae7d8;border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:15px;font-weight:600}
.btn.play{background:var(--heather);color:#fdf9f5;border-color:var(--heather);min-width:116px;text-align:center}
.btn.play.on{background:#e2ded0;color:var(--ink);border-color:var(--line)}
.readout{margin-left:auto;text-align:right;line-height:1.3}
.readout .big{font-size:21px;font-weight:700;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.readout .small{font-size:10.5px;color:var(--dim);letter-spacing:.08em}
#roll{width:100%;height:210px;display:block;border-radius:10px;background:#dedbc9;margin-top:12px;touch-action:none}
.rollnote{font-size:11px;color:var(--dim);margin:7px 0 0}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row label{flex:0 0 auto;font-size:13.5px;color:#4c5044}
.row .val{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13.5px;font-family:ui-monospace,Menlo,monospace}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8.5px;border-radius:50%;background:var(--heather)}
input[type=range]::-moz-range-track{height:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:var(--heather)}
select{background:#eae7d8;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit;font-size:13.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
.seg button{padding:7px 12px;font-size:13px;background:#eae7d8;color:var(--dim)}
.seg button.on{background:var(--ink);color:#f5f3e8;font-weight:600}
.sw{margin-left:auto;width:50px;height:29px;border-radius:15px;background:#d3cfbc;position:relative;flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fdfcf6;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--heather)}
.sw.on::after{transform:translateX(21px)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.rh{background:var(--heather)} .dot.lh{background:var(--moss)}
.dial{margin-left:auto;display:flex;align-items:center;gap:4px}
.dial button{background:#eae7d8;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;min-width:34px;text-align:center}
.dial span{display:inline-block;min-width:46px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--heather);margin:0 0 8px;font-weight:600}
.tblwrap{max-height:420px;overflow:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--dim);font-weight:500;font-size:10.5px;letter-spacing:.06em;padding:6px 5px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 5px;border-bottom:1px solid rgba(214,209,189,.6);vertical-align:top;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5}
.tbl tr.cur td{background:#e6e2cf}
.tbl td.m{color:var(--heather);font-weight:700;width:32px}
.tbl td.rh{color:#8a4f81}
.tbl td.lh{color:#3f6a4e}
.tbl td.mk{font-family:Georgia,serif;font-style:italic;color:var(--dim);font-size:10.5px}
.note{color:var(--dim);font-size:12px;line-height:1.75;margin:16px 0 0}
/* ===== リアルタイム解説 ===== */
:root{ --moor:#7a8f56; --gorse:#b08641; --mist:#6f8ea6; --deep:#4a5240; }

/* 構造マップ（画面上部に固定） */
.gmap{position:sticky;top:0;z-index:40;background:rgba(233,231,218,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.gmap-in{max-width:760px;margin:0 auto;padding:8px 16px 10px}
.gmap-lab{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;letter-spacing:.14em;
  color:var(--dim);margin-bottom:5px;font-family:ui-monospace,Menlo,monospace}
.gmap-lab b{color:var(--deep);font-weight:500;letter-spacing:.1em;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gbar{position:relative;display:flex;gap:2px;height:22px}
.gseg{flex:1 1 0;border:0;padding:0;border-radius:2px;background:rgba(122,143,86,.3);
  transition:background .2s,transform .2s,opacity .2s}
.gseg[data-fam="chord"]{background:rgba(176,134,65,.55)}
.gseg[data-fam="joy"]{background:rgba(162,86,140,.55)}
.gseg[data-fam="mist"]{background:rgba(111,142,166,.5)}
.gseg.on{background:var(--deep);transform:scaleY(1.3)}
.gseg.out{opacity:.25}
.gseg.sel{box-shadow:inset 0 0 0 2px var(--heather)}
.gnow{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--heather);
  box-shadow:0 0 7px rgba(143,90,134,.8);pointer-events:none;border-radius:1px}

/* 解説カード */
.guide{padding:0;overflow:hidden}
.g-prog{height:2px;background:rgba(122,143,86,.2)}
.g-prog i{display:block;height:100%;width:0;background:var(--heather)}
.g-top{display:flex;align-items:center;gap:9px;padding:12px 14px 10px}
.g-fam{width:22px;height:3px;border-radius:2px;background:var(--moor);flex:0 0 auto}

/* ===== タップの手ごたえと、場面送りのアニメーション ===== */

<details class="keys">
  <summary>この曲を貫く4つの仕掛け</summary>
  <div class="keys-in">
    <h4>① 五音音階 — 半音のない旋律</h4>
    <p>冒頭の独奏旋律に出てくる音は <span class="chord">E♭ F G B♭ C</span> の5つだけ。A♭ ですらまだ鳴りません。半音がひとつもないので、どこへ進まなければならないという力が働かず、旋律は行きたい方へ流れます。「解決したがらない」のではなく、そもそも解決の必要がない音階です。</p>
    <h4>② ドローンと平行和音 — 進行しない伴奏</h4>
    <p>左手は同じ低音を鳴らしっぱなしにするか、和音の形をそのまま平行移動させるか、そのどちらかがほとんど。付加6度や4度堆積の響きが多く、和音は「機能」ではなく「色」として置かれています。だから何小節鳴っても、景色は変わっても場所は変わりません。</p>
    <h4>③ 5/4 の一小節 — 拍子が呼吸に合わせて伸びる</h4>
    <p>m.16 だけ 5/4 になります。転調でも展開でもなく、フレーズがもう一息ぶん必要だったから伸ばした、という書き方。民謡の歌い手が息の続く長さで小節を伸ばすのと同じ理屈で、拍子のほうが旋律に合わせています。</p>
    <h4>④ ♭から♮へ、そして帰る — 光の移動</h4>
    <p>調号は4♭。ところが m.19 では G♭ や B𝄫 が加わってさらに暗い側へ沈み、m.29 では逆に E♮ A♮ D♮ が並んで白鍵の明るさになります。<mark>和音は動かないのに、光の当たり方だけが変わる</mark>。曇りと晴れ間が同じ荒地を通り過ぎていく、そういう作りです。</p>
    <div class="pull">描かないことによって描く。<br>輪郭を薄くするほど、風景は広くなる。</div>
    <p>1913年、《前奏曲集 第2巻》の第5曲。同じ A♭ 長調、同じ五音音階、同じ静けさという点で、第1巻の《亜麻色の髪の乙女》の遠い親戚にあたります。ただしあちらが人物の肖像なのに対し、こちらに人はいません。題名はブック2の慣例どおり曲の最後に「…Bruyères」と括弧つきで置かれ、聴き終えてはじめてそれが何だったか告げられます。</p>
  </div>
</details>

/* ---- 楽譜に印刷された速度指示から、テンポの形をつくる ----
   ♩=66 で始まり、m.23 Un peu animé で ♩=72、m.37 Cédez で 66 へ戻し、
   m.46 En retenant 以降は終結に向けてさらに沈む。 */
const SCALE = new Float64Array(MCOUNT), RIT = new Uint8Array(MCOUNT);
(function(){
  const A=72/66, B=60/66;
  const TARGET={1:1, 23:A, 37:A, 38:1, 46:B, 47:0.87, 48:0.84, 49:0.79, 50:0.72, 51:0.72};
  let cur=1;
  for(let i=0;i<MCOUNT;i++){
    const n=MS[i].n;
    if(TARGET[n]!==undefined) cur=TARGET[n];
    SCALE[i]=cur;
  }
  /* この小節のあいだに次の値へ滑らかに移る＝ Cédez / En retenant */
  [37,46,47,48,49].forEach(n=>{ RIT[n-1]=1; });
})();
function scaleAtPos(pos){
  if(!ST.tmp) return 1;
  let lo=0,hi=MCOUNT-1;
  while(lo<hi){const m=(lo+hi+1)>>1; if(MS[m].start<=pos) lo=m; else hi=m-1;}
  const a=SCALE[lo], b=(lo+1<MCOUNT?SCALE[lo+1]:SCALE[lo]);
  const f=(pos-MS[lo].start)/MS[lo].L;
  return RIT[lo] ? a+(b-a)*f : a;
}
let TMAP=null; const STEP=1/6;
function buildMap(){
  const base=60/ST.bpm/4, n=Math.round(TOTAL/STEP)+1;
  TMAP=new Float64Array(n); let t=0;
  for(let i=1;i<n;i++){ t+=STEP*base/scaleAtPos((i-0.5)*STEP); TMAP[i]=t; }
}
function posToSec(p){const i=p/STEP,a=Math.floor(i);if(a>=TMAP.length-1)return TMAP[TMAP.length-1];return TMAP[a]+(TMAP[a+1]-TMAP[a])*(i-a);}
function secToPos(s){let lo=0,hi=TMAP.length-1;if(s<=0)return 0;if(s>=TMAP[hi])return TOTAL;
  while(hi-lo>1){const m=(lo+hi)>>1;if(TMAP[m]<=s)lo=m;else hi=m;}
  const d=TMAP[hi]-TMAP[lo];return (lo+(d?(s-TMAP[lo])/d:0))*STEP;}
function measureAt(pos){let lo=0,hi=MCOUNT-1;while(lo<hi){const m=(lo+hi+1)>>1;if(MS[m].start<=pos)lo=m;else hi=m-1;}return lo;}

let ctx=null,bus=null;
function ensureAudio(){
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
    bus=ctx.createGain();bus.gain.value=0.85;bus.connect(ctx.destination);}
  if(ctx.state==='suspended')ctx.resume();
}
const TIMBRES={piano:'ピアノ風',reed:'葦笛のような音',marimba:'マリンバ風',bell:'鐘のような音',sine:'正弦波'};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function voice(t,midi,dur,gain,kind){
  const f=mtof(midi),g=ctx.createGain();g.connect(bus);
  const rel=kind==='sine'?0.12:0.3,end=t+Math.max(0.1,dur)+rel;
  if(kind==='sine'){const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.02);
    g.gain.setValueAtTime(gain,t+Math.max(0.07,dur));g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t);o.stop(end+0.02);return;}
  if(kind==='reed'){const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=0.7;
    lp.frequency.setValueAtTime(Math.max(400,f*2.4),t);
    lp.frequency.linearRampToValueAtTime(Math.max(300,f*1.8),t+Math.max(0.2,dur));
    o.connect(lp);lp.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain*0.9,t+0.06);
    g.gain.setValueAtTime(gain*0.9,t+Math.max(0.1,dur*0.8));

function handMul(m,h){

/* ---- scheduling (look-ahead: 先の0.5秒ぶんだけ予約する) ---- */
let playing=false,anchorT=0,anchorP=0,baseSec=0,noteIdx=0,metro=[],metroIdx=0,schedId=null,raf=null;
let horizon=0;   /* ここまでは既に音を予約済み、という時刻 */

function firstNoteAt(pos){
  let lo=0,hi=NOTES.length;

  return lo;

function buildMetro(){
  metro=[];

  const step=16/ST.div;

    for(let k=0;k*step<MS[mi].L-1e-6;k++) metro.push([MS[mi].start+k*step,k===0]);

function seekTo(pos,flush){
  ensureAudio();

  if(pos<a||pos>=b) pos=a;
  anchorP=pos; baseSec=posToSec(pos); anchorT=ctx.currentTime+0.12;
  noteIdx=firstNoteAt(pos);

  while(metroIdx<metro.length&&metro[metroIdx][0]<pos-1e-6) metroIdx++;

function schedTick(){
  if(!playing||!ctx) return;
  const now=ctx.currentTime, until=now+LOOK, b=rangeB();
  horizon=until;

  while(noteIdx<NOTES.length&&budget>0){
    const n=NOTES[noteIdx];
    if(n.abs>=b){ noteIdx=NOTES.length; break; }
    const t=n.g?secOf(n.abs)-0.09:secOf(n.abs);
    if(t>until) break;
    noteIdx++;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const gv=gainFor(n)*((n.h===0?ST.volR:ST.volL)/100)*(n.g?0.55:1);

    const t=secOf(metro[metroIdx][0]);

   先読み（0.5秒）で既に予約済みの音を、もう一度予約し直していた。
   その結果、変更した瞬間だけ同じ箇所が二重に鳴っていた。
   予約をやり直すのは「本当に位置が飛ぶとき」だけにする。            */
function flushAudio(){          /* 予約済みの音を破棄する（位置が飛ぶときだけ） */

function retime(){              /* テンポなど時間軸が変わる変更：継ぎ目なく差し替える */

  const pNow=curPos();                                   /* 旧マップでの現在地 */
  const pEdge=Math.min(rangeB(),                         /* 旧マップでの予約済みの先端 */
    secToPos(baseSec+Math.max(0,horizon-anchorT)));

  anchorT=now; baseSec=posToSec(pNow);                   /* 表示も音も現在地でつなぐ */
  noteIdx=Math.max(noteIdx,firstNoteAt(pEdge+1e-6));     /* 予約済みは飛ばす＝二重に鳴らさない */
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;

function remetro(){             /* メトロノームの刻みが変わる変更 */
  if(!playing||!ctx){ buildMetro(); metroIdx=0; return; }
  const pEdge=secToPos(baseSec+Math.max(0,horizon-anchorT));

  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;

const PXP=13;
function draw(){
  if(!W) resize();

  const g=cx2d;

  g.fillStyle='#dedbc9';g.fillRect(0,0,W,H);
  drawSectionBands(g,left);
  const yOf=m=>H-((m-LOMIDI)/(HIMIDI-LOMIDI))*H;

  g.fillStyle='rgba(60,66,48,.10)';
  for(let m=LOMIDI;m<=HIMIDI;m++) if(m%12===8){ const y=yOf(m); g.fillRect(0,y-1,W,2); }
  // measure lines
  g.strokeStyle='rgba(90,98,74,.35)';g.lineWidth=1;g.font='10px ui-monospace,Menlo,monospace';
  for(let i=0;i<MCOUNT;i++){

    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const x=(n.abs-left)*PXP, w=Math.max(3,(n.g?0.5:n.q)*PXP-1.5);
    const y=yOf(n.midi), h=Math.max(3,H/(HIMIDI-LOMIDI)-1);

];

/* ==========================================================
   リアルタイム解説
   ========================================================== */
var GREADY=false;
const FAMLINE={melody:'#7a8f56', chord:'#b08641', mist:'#6f8ea6', joy:'#a2568c'};
const SECOF=new Int16Array(MCOUNT+2);
SEC.forEach((s,i)=>{for(let m=s.from;m<=s.to;m++) SECOF[m]=i;});

/* 標語の日本語 */
const GLOSS=[
  [/calme/i,'静かに'],
  [/doucement expressif/i,'やわらかく表情ゆたかに'],
  [/doux et l[ée]ger/i,'やわらかく、軽く'],
  [/^doux$|\sdoux$|\sdoux\s/i,'やわらかく'],
  [/joyeux/i,'楽しげに'],
  [/un peu anim/i,'すこし生き生きと（♩=72）'],
  [/c[ée]dez/i,'テンポをゆるめて'],
  [/au mouv/i,'もとの速さで'],
  [/en retenant/i,'だんだん遅くして'],
  [/sans lourdeur/i,'重くならずに'],
  [/cresc/i,'だんだん強く'],
  [/dim\./i,'だんだん弱く'],
  [/m\.d\./i,'m.d.＝右手で'],
  [/m\.g\./i,'m.g.＝左手で']
];
const DYNGL={ppp:'きわめて弱く',pp:'とても弱く',p:'弱く','più p':'さらに弱く',mp:'やや弱く',mf:'やや強く',f:'強く',ff:'とても強く'};
function glossOf(t){
  if(!t) return '';
  const out=[];
  for(const [re,jp] of GLOSS) if(re.test(t)&&out.indexOf(jp)<0) out.push(jp);
  return out.join(' ／ ');
}
function cleanMk(t){
  let x=(t||'')
    .replace(/au Mouv\b/i,'au Mouvᵗ')
    .replace(/♩=\d+(\.\d+)?/g,'')
    .replace(/\s+/g,' ').trim();
  return x;
}

/* 標語・強弱のイベント表 */
const MK=[];
for(let i=0;i<MCOUNT;i++){
  const t=(MS[i].mk||'').trim(), dy=[...new Set((MS[i].dy||[]).map(d=>d[1]))];
  if(t||dy.length) MK.push({i:i,n:MS[i].n,t:t,dy:dy});
}
const DYNL=[];
(function(){let c='';
  for(let i=0;i<MCOUNT;i++){ const d=MS[i].dy||[]; if(d.length) c=d[d.length-1][1]; DYNL.push(c); }})();

/* 構造マップ */
const gbar=$('gbar');
gbar.innerHTML=SEC.map((s,i)=>
  '<button class="gseg" data-i="'+i+'" data-fam="'+s.fam+'" style="flex-grow:'+(s.to-s.from+1)+
  '" aria-label="m.'+s.from+'–'+s.to+' '+s.tag+'"></button>').join('')+
  '<i class="gnow" id="gnow"></i>';
const gsegs=[...gbar.querySelectorAll('.gseg')], gnow=$('gnow');
gsegs.forEach(b=>b.addEventListener('click',()=>{
  const i=+b.dataset.i;
  setFollow(1); jumpToMeasure(SEC[i].from);
}));
function mapRange(){
  gsegs.forEach((b,i)=>b.classList.toggle('out', SEC[i].to<ST.rgA||SEC[i].from>ST.rgB));
}
const _rangeUI=rangeUI;
rangeUI=function(){ _rangeUI(); mapRange(); };
function setMapOn(i){ gsegs.forEach((b,k)=>b.classList.toggle('on',k===i)); }
function setMapSel(i){ gsegs.forEach((b,k)=>b.classList.toggle('sel', !GS.follow && k===i)); }

/* 位置の移動 */
function jumpToMeasure(n){
  const p=MS[n-1].start;
  if(n<ST.rgA||n>ST.rgB){
    ST.rgA=Math.min(ST.rgA,n); ST.rgB=Math.max(ST.rgB,n); rangeUI(); save(); buildMap();
  }
  if(playing) seekTo(p,1); else { anchorP=p; }
  draw();
}
function practiceSection(i){
  const s=SEC[i];
  ST.rgA=s.from; ST.rgB=s.to; rangeUI(); save(); buildMap();
  if(playing) seekTo(rangeA(),1); else anchorP=rangeA();
  draw();
}

/* 解説の描画 */
var GS={idx:-1,mi:-1,follow:1,manual:0};
function renderGuide(i,anim){
  if(i==null||i<0||i>=SEC.length) i=0;
  const dir=(GS.idx<0||GS.idx===i)?0:(i>GS.idx?1:-1);   /* 進む＝1／戻る＝-1 */
  const s=SEC[i]; GS.idx=i;
  $('gfam').style.background=FAMLINE[s.fam];
  $('gtag').textContent=s.tag;
  $('gmm').textContent='m.'+s.from+'–'+s.to;
  $('gseglab').textContent=s.tag+' ／ m.'+s.from+'–'+s.to;
  const music='<div class="v-music">'+s.body.map(p=>'<p>'+p+'</p>').join('')+
    '<ul class="g-notes">'+s.notes.map(n=>'<li><b>'+n[0]+'</b>　'+n[1]+'</li>').join('')+'</ul></div>';
  const tech='<div class="v-tech"><ul class="g-notes">'+
    s.tech.map(n=>'<li><span class="g-step">'+n[0]+'</span>'+n[1]+'</li>').join('')+'</ul></div>';
  const b=$('gbody');
  b.innerHTML='<h3 class="g-ttl">'+s.title+'</h3><p class="g-ital">'+s.ital+'</p>'+music+tech;
  if(anim){
    const cls=dir>0?'g-in-next':(dir<0?'g-in-prev':'g-fade');
    b.classList.remove('g-fade','g-in-next','g-in-prev'); void b.offsetWidth; b.classList.add(cls);
  }
  setMapSel(i);
}
function updateLive(mi){
  let cur=null,nxt=null,txt=null;
  for(const e of MK){
    if(e.i<=mi){ cur=e; if(e.t) txt=e; }
    else { nxt=e; break; }
  }
  const t=cleanMk(txt?txt.t:'');
  $('gmk').innerHTML = t ? t+(txt.i<mi?'<em class="from">m.'+txt.n+'〜</em>':'') : '—';
  const d=DYNL[mi];
  $('ggl').textContent=[glossOf(txt?txt.t:''),DYNGL[d]||''].filter(Boolean).join('　/　');
  $('gdyn').innerHTML='<b>'+(d||'—')+'</b>';
  if(nxt){
    const dd=nxt.n-MS[mi].n, g=glossOf(nxt.t), lab=cleanMk(nxt.t)||nxt.dy.join(' ');
    $('gnextmk').innerHTML='次の指示 → <b>'+(lab||'—')+'</b>'+(g?'（'+g+'）':'')+
      ' m.'+nxt.n+'・あと'+dd+'小節';
  } else $('gnextmk').textContent='';
  const si=SECOF[MS[mi].n];
  if(si+1<SEC.length){
    const ns=SEC[si+1];
    $('gnextsec').innerHTML='次の場面 → <b>'+ns.tag+'</b> m.'+ns.from+'・あと'+(ns.from-MS[mi].n)+'小節';
  } else $('gnextsec').textContent='';
  const live=$('glive');
  if(cur&&cur.i===mi){ live.classList.remove('flash'); void live.offsetWidth; live.classList.add('flash'); }
}
function guideUpdate(pos){
  if(!GREADY) return;
  const mi=measureAt(pos);
  gnow.style.left=(((mi+(pos-MS[mi].start)/MS[mi].L)/MCOUNT)*100)+'%';
  if(mi!==GS.mi){
    GS.mi=mi;
    const si=SECOF[MS[mi].n];
    updateLive(mi);
    setMapOn(si);
    if(GS.follow&&si!==GS.idx) renderGuide(si,true);
  }
  const s=SEC[GS.idx];
  if(s){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    $('gprog').style.width=Math.max(0,Math.min(1,(pos-a)/(b-a)))*100+'%';
  }
}

/* 場面の色を、ピアノロールの背景に薄く敷く */
function drawSectionBands(g,left){
  if(!GREADY) return;
  const right=left+W/PXP;
  g.font='9px ui-monospace,Menlo,monospace';
  for(const s of SEC){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    if(b<left||a>right) continue;
    const x0=(a-left)*PXP, x1=(b-left)*PXP;
    g.globalAlpha=0.16; g.fillStyle=FAMLINE[s.fam];
    g.fillRect(x0,0,x1-x0,H);
    g.globalAlpha=0.85;
    g.strokeStyle=FAMLINE[s.fam]; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x0,0); g.lineTo(x0,H); g.stroke();
    g.fillStyle=FAMLINE[s.fam]; g.fillText(s.tag,x0+5,H-6);
    g.globalAlpha=1;
  }
}

/* 操作 */
function setFollow(v){
  GS.follow=v?1:0; ST.gfollow=GS.follow; save();
  $('gfollow').classList.toggle('on',!!GS.follow);
  $('ghint').textContent=GS.follow?'':'手動で表示中';
  if(GS.follow){ const si=SECOF[MS[Math.max(0,GS.mi)].n]; renderGuide(si,true); setMapSel(si); }
  else setMapSel(GS.idx);
}
$('gfollow').addEventListener('click',()=>setFollow(!GS.follow));
$('gprev').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.max(0,GS.idx-1),true); });
$('gnextbtn').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.min(SEC.length-1,GS.idx+1),true); });
$('gprac').addEventListener('click',()=>{ practiceSection(GS.idx); setFollow(1); });
const gview=$('gview');
[...gview.children].forEach(b=>{
  b.classList.toggle('on',b.dataset.v===ST.gview);
  b.addEventListener('click',()=>{
    ST.gview=b.dataset.v; save();
    [...gview.children].forEach(x=>x.classList.toggle('on',x===b));
    $('guide').className='guide view-'+ST.gview;
  });
});
$('guide').className='guide view-'+ST.gview;

/* 起動 */
GS.follow=ST.gfollow?1:0;
$('gfollow').classList.toggle('on',!!GS.follow);
$('ghint').textContent=GS.follow?'':'手動で表示中';
mapRange();
GREADY=true;
GS.mi=-1;
renderGuide(SECOF[MS[measureAt(anchorP)].n],false);
draw();

/* ---- 音の設定シートの開閉 ---- */
function openSheet(){ $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden','false');
  document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden'; }
function closeSheet(){ $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden','true');
  document.documentElement.style.overflow=''; document.body.style.overflow=''; resize(); draw(); }
$('openSet').addEventListener('click',openSheet);
$('closeSet').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('sheet').classList.contains('open')) closeSheet(); });

<\/script>

<script>
/* ---- 押した指に反応させる（iOSの :active は当てにならないので自前で） ---- */
(function(){
  var SEL='button,.sw', cur=null;
  function off(){ if(cur){ cur.classList.remove('tapdown'); cur=null; } }
  document.addEventListener('pointerdown',function(e){
    var t=(e.target&&e.target.closest)?e.target.closest(SEL):null;
    if(!t||t.disabled) return;
    off(); cur=t; t.classList.add('tapdown');
  },{passive:true});
  document.addEventListener('pointerup',off,{passive:true});
  document.addEventListener('pointercancel',off,{passive:true});
  document.addEventListener('pointermove',function(e){ if(cur&&e.buttons===0) off(); },{passive:true});
  window.addEventListener('blur',off);
})();
<\/script>

<script>
/* 親（曲の一覧）から「止めて」と言われたら、音を完全に落としてから消える */
window.addEventListener('message',function(e){
  if(!e||!e.data||e.data.cmd!=='halt') return;
  try{ if(typeof stopAll==='function') stopAll(); }catch(_){}
  try{ if(typeof ctx!=='undefined'&&ctx&&ctx.close) ctx.close(); }catch(_){}
});

<script>
(function(){
  var LIST=[{id:"prelude",fr:"Prélude",jp:"ベルガマスク組曲 第1曲",ac:"#d8a05e"},
            {id:"clair",fr:"Clair de lune",jp:"月の光",ac:"#d9c47f"},
            {id:"ballade",fr:"Ballade",jp:"スラヴ風バラード",ac:"#d9a441"},
            {id:"grenade",fr:"La soirée dans Grenade",jp:"グラナダの夕べ",ac:"#e3a648"},
            {id:"lente",fr:"La plus que lente",jp:"レントより遅く",ac:"#d8a441"},
            {id:"cathedrale",fr:"La cathédrale engloutie",jp:"沈める寺",ac:"#d7b26d"},
            {id:"bruyeres",fr:"Bruyères",jp:"ヒースの茂る荒地",ac:"#8f5a86"}];
  var stage=document.getElementById('stage'), menu=document.getElementById('menu'),
      bar=document.getElementById('bar'), nowT=document.getElementById('nowT'),
      nowS=document.getElementById('nowS'), closeBtn=document.getElementById('close'),
      prevB=document.getElementById('prev'), nextB=document.getElementById('next');
  var cur=-1;

  function idxOf(id){ for(var i=0;i<LIST.length;i++) if(LIST[i].id===id) return i; return -1; }

  var motionOK=!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function halt(){
    try{ stage.contentWindow.postMessage({cmd:'halt'},'*'); }catch(e){}
  }
  /* 読み込みが済んだら（遅くても0.9秒後には）新しい曲を滑り込ませる */
  function reveal(){
    var done=false;
    function go(){
      if(done) return; done=true;
      void stage.offsetWidth;
      stage.style.transition='transform .3s cubic-bezier(.16,.84,.44,1), opacity .24s ease';
      stage.style.transform='none'; stage.style.opacity='1';
    }
    stage.addEventListener('load',go,{once:true});
    setTimeout(go,900);
  }
  function swap(id,dir){
    function put(from){
      halt(); stage.srcdoc=source(id);
      stage.style.transition='none';
      stage.style.transform=from; stage.style.opacity='0';
      reveal();
    }
    if(!motionOK){ halt(); stage.srcdoc=source(id);
      stage.style.transition=''; stage.style.transform=''; stage.style.opacity=''; return; }
    if(dir===0){ put('scale(.985)'); return; }          /* 最初の1曲 */
    stage.style.transition='transform .17s cubic-bezier(.4,0,1,1), opacity .15s ease';
    stage.style.transform='translateX('+(-9*dir)+'%)';  /* 今の曲を送り出す */
    stage.style.opacity='0';
    setTimeout(function(){ put('translateX('+(9*dir)+'%)'); },175);  /* 反対側から入れる */
  }
  function openMenu(){
    menu.hidden=false; menu.classList.remove('closing','anim');
    void menu.offsetWidth; menu.classList.add('anim');
  }
  function closeMenu(){
    if(menu.hidden) return;
    if(!motionOK){ menu.hidden=true; return; }
    menu.classList.add('closing');
    setTimeout(function(){ menu.hidden=true; menu.classList.remove('closing','anim'); },190);
  }
  function source(id){
    var el=document.getElementById('src-'+id);
    /* 逃がしておいた終了タグを元に戻す */
    return el.textContent.replace(/<\\\/script/gi,'<\/script');
  }
  function load(i,push){
    if(i<0||i>=LIST.length) return;
    var p=LIST[i];
    if(i!==cur){ swap(p.id, cur<0?0:(i>cur?1:-1)); cur=i; }
    nowT.textContent=p.fr; nowS.textContent=p.jp;
    document.title=p.fr+' ｜ 採譜プレーヤー';
    bar.classList.remove('hidden');
    requestAnimationFrame(function(){ bar.classList.add('show'); });
    prevB.disabled=(i===0); nextB.disabled=(i===LIST.length-1);
    [].forEach.call(document.querySelectorAll('.card'),function(c){
      c.classList.toggle('on', c.dataset.id===p.id); });
    closeBtn.hidden=false;
    closeMenu();
    try{ localStorage.setItem('debussy_last',p.id); }catch(e){}
    if(push!==false && location.hash!=='#'+p.id){ try{ history.replaceState(null,'','#'+p.id); }catch(e){} }
  }

  [].forEach.call(document.querySelectorAll('.card'),function(c){
    c.addEventListener('click',function(){ load(idxOf(c.dataset.id)); });
  });
  document.getElementById('pick').addEventListener('click',openMenu);
  closeBtn.addEventListener('click',function(){ if(cur>=0) closeMenu(); });

  /* 押した指に反応させる */
  (function(){
    var SEL='button', held=null;
    function off(){ if(held){ held.classList.remove('tapdown'); held=null; } }
    document.addEventListener('pointerdown',function(e){
      var t=(e.target&&e.target.closest)?e.target.closest(SEL):null;
      if(!t||t.disabled) return;
      off(); held=t; t.classList.add('tapdown');
    },{passive:true});
    document.addEventListener('pointerup',off,{passive:true});
    document.addEventListener('pointercancel',off,{passive:true});
    document.addEventListener('pointermove',function(e){ if(held&&e.buttons===0) off(); },{passive:true});
    window.addEventListener('blur',off);
  })();
  prevB.addEventListener('click',function(){ load(cur-1); });
  nextB.addEventListener('click',function(){ load(cur+1); });
  window.addEventListener('hashchange',function(){
    var i=idxOf(location.hash.replace('#','')); if(i>=0&&i!==cur) load(i,false);
  });

  var start=idxOf(location.hash.replace('#',''));
  if(start>=0){ menu.hidden=true; load(start,false); } else openMenu();
})();
</script>
