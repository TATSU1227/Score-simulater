const SEC = [
{from:1,to:6,fam:"base",tag:"Intro",ex:"ostinato",
 title:"序奏 — 何もない場所にリズムだけが置かれる",
 ital:"Mouvement de Habanera / Commencer lentement dans un rythme nonchalamment gracieux",
 body:["低音域の C♯ がハバネラのリズムを刻むだけ。旋律も和音もまだありません。まず「空気」と「脈拍」を置いて、あとから人物を入れるという順序です。",
 "指示は「ゆっくり始め、気だるく優雅なリズムで」。ここが行進曲的に硬くなると曲全体が台無しになります。付点は数えるものではなく、揺れとして扱う箇所です。"],
 notes:[["和声","調号は4♯（F♯）ですが鳴っているのは属音 C♯ ただ一つ。主和音は保留され、宙吊りのまま始まります。"],
 ["描写","遠くのギターのつま弾き、あるいは夜そのものの呼吸。まだ誰も歌っていない状態です。"]],
 tech:[["01","左手だけで20回連続。まずメトロノームの16分に完全に合わせて型を体に入れ、そのうえで意図的に付点8分をほんの少しだけ長く取る。この「わずかな遅れ」が nonchalamment の正体です。"],
 ["02","ppp は弱く叩くのではなく、鍵盤の底まで押し切らないこと。指は鍵盤に触れたまま、打鍵速度だけを落とします。指を振り上げると必ず音が硬くなります。"],
 ["03","ペダルは1小節ごとに浅く踏み替え。低音の胴鳴りだけを残し、リズムの輪郭は濁らせない。半踏み〜1/3で。"],
 ["04","手首を固定しないこと。前腕を小さく回旋させて4つの打点に重さを配分すると、単調さが消えます。"]]},

{from:7,to:16,fam:"base",tag:"Theme A",ex:"mode",
 title:"主題A — ムーア風の歌が入ってくる",
 ital:"8va, ppp / pp expressif",
 body:["右手上声に 8va の C♯ 保続、その下に旋律。ここで <mark>D♮ → E♯ の増2度</mark> が現れます。この一音程が曲の民族的アイデンティティを一手に担っています。",
 "同音反復と短い装飾から旋律が立ち上がる書き方は、カンテ（アンダルシアの歌）の節回しの写しです。声が言葉を探しながら伸びていく感じ。",
 "さらに左手に pp expressif の対旋律が加わり、テクスチュアが三層（保続音・旋律・対旋律）になります。"],
 notes:[["和声","F♯ を主音とする旋法に、下行形でフリギア的な色が混ざります。機能和声の進行ではなく、C♯ を軸にした色の移り変わりとして聴くのが正解です。"],
 ["モチーフ","「同音反復 → 増2度 → 下行」の形が全曲の主要モチーフ。以後、和音化・厚化されて三度戻ってきます。"]],
 tech:[["01","三層をばらして練習。①8va の保続音だけ ②旋律だけ ③左手の対旋律だけ。次に①+②、①+③、最後に全部。いきなり合わせると必ず保続音が大きくなります。"],
 ["02","保続音は同じ指（4か5）で軽く。各小節の頭だけわずかに支え、あとは惰性で鳴らす。ここを「弾こう」とした瞬間に旋律が消えます。"],
 ["03","増2度 D→E♯ は指を跨がせて（例：2→3）、音程の広さを腕で感じる。半音階の中に紛れさせず、跳躍として聴かせたい箇所です。"],
 ["04","同音反復はレガートに聴かせるため指を替える（3-2-3-2）。同じ指の連打だと打楽器になってしまいます。"]]},

{from:17,to:20,fam:"base",tag:"retenu",
 title:"三連符でほどける — 最初の呼吸",
 ital:"retenu, ppp",
 body:["三連符が現れてテンポが緩み、歌が語尾を伸ばしたまま消えます。ドビュッシーの retenu は減速というより、時間の粒が粗くなる感覚。",
 "ここで場面が完全に切れます。次に来るのは別の演奏者です。"],
 notes:[["構造","この4小節は「幕」。以後、曲は場面転換のたびにこうした小さな空白を挟みます。"]],
 tech:[["01","三連符は「遅くする」ではなく「区切りを増やす」。3つ目に重みを置くと、テンポを操作しなくても自然に減速して聴こえます。"],
 ["02","最後の音を離す時刻を決めて楽譜に書き込む。無音の長さも演奏内容です。"],
 ["03","次の Tempo giusto が乾いた音で入るので、ここの余韻はむしろ湿らせる。ペダルを長めに残して対比を作ります。"]]},

{from:21,to:22,fam:"guitar",tag:"Guitar I",ex:"guitar",
 title:"ギターの登場 — 乾いた和音の連打",
 ital:"Tempo giusto, pp",
 body:["突然、高音域の短い和音が staccato で並びます。ギターのラスゲアード（かき鳴らし）の模写。左手はハバネラのリズムを保ちます。",
 "音楽の性格が一瞬で変わるのが重要で、これは移行ではなくカット。歌の場面からギターの場面へ、映画の切り返しのように切り替わります。"],
 notes:[["和声","平行和音（プレーニング）。和音が機能ではなく音色の塊として横滑りし、根音進行という発想が消えます。"],
 ["描写","撥弦の減衰、爪の当たる硬さ。ペダルの有無で「弦の乾き」が決まる箇所です。"]],
 tech:[["01","指先だけで弾く。腕の重みをゼロにして、鍵盤から1cm以内の距離で。ここで腕を使うとギターがピアノに戻ってしまいます。"],
 ["02","スタッカートは指を跳ね上げて作らない。鍵盤を離す速度だけで作る。跳ね上げると次の和音の準備が遅れます。"],
 ["03","一度ペダル完全なしで練習して、乾いた音の限界を知る。本番では1/4ペダルくらいに戻すと、乾きを保ったまま響きが得られます。"],
 ["04","和音の最上音だけをわずかに強く。ギターの1弦が目立つのと同じ原理で、和音の連続に旋律線が生まれます。"]]},

{from:23,to:28,fam:"base",tag:"Cante",ex:"cante",
 title:"カンテ — 歌が和音になって戻る",
 ital:"Tempo rubato, p expressif",
 body:["主題が今度は和音化されて現れます。三連符のアウフタクトから重い和音へ落ちる形は、フラメンコの歌い出しのため息そのもの。",
 "左手はハバネラを刻み続けており、歌い手とギタリストが同時に鳴っている状態になります。"],
 notes:[["和声","旋律の各音に和音が付随して平行移動。内声に半音のぶつかりが多く、その濁りが「声のかすれ」として機能します。"],
 ["構造","rubato（歌）と giusto（ギター）の交替が始まります。以後この対立が曲の背骨になります。"]],
 tech:[["01","和音の最高音だけを抜き出して声に出して歌う。旋律の輪郭が体に入ってから和音を戻すと、縦の塊が横の線になります。"],
 ["02","三連符のアウフタクトは「息を吸う」動作。走らせない。ここを急ぐと、ため息ではなくつまずきに聴こえます。"],
 ["03","最難関は左手のハバネラを一定に保つこと。メトロノームを左手にだけ合わせ、右手は自由に、という練習が効きます。"],
 ["04","内声の半音のぶつかりを消さない。バランスを整えて綺麗にすると、この曲特有のかすれた色が失われます。"]]},

{from:29,to:32,fam:"guitar",tag:"Guitar II",
 title:"再びギター — 交替の確立",
 ital:"Tempo giusto, pp",
 body:["同じギターの和音が戻ります。ここで「歌 → ギター → 歌 → ギター」というパターンが聴き手に確定し、以後この交替が構造として機能します。",
 "音量は依然 pp。まだ何も起こっていないという顔をして、次の爆発の準備をしています。"],
 notes:[["構造","これは変奏ではなく反復。反復＝時間が進んでいないことの表現で、夜の停滞感を作ります。"]],
 tech:[["01","前回のギター場面と音色を揃える。同じ人物が同じ楽器を弾いている、という設定を守ります。録音して聴き比べるのが確実。"],
 ["02","ここで感情を足さない。進行しないことが表現なので、盛り上げると構造が壊れます。"],
 ["03","次の Très rythmé に備えて、この時点で音量の「床」を十分低く保っておくこと。"]]},

{from:33,to:37,fam:"dance",tag:"Dance",ex:"dance",
 title:"Très rythmé — 曲で唯一の解放",
 ital:"Très rythmé, mf en augmentant beaucoup → ff",
 body:["全曲で唯一、明確にクレッシェンドしてリズムが主役になる場所。「非常にリズミカルに、大きく増しながら」。ここで初めて身体が出てきます。踊り手の足、手拍子、群衆。",
 "アクセントの付いた和音が上下し、低音は主音と属音を叩きます。ここに至るまでの pp の堆積があるから、mf でも爆発的に聴こえる設計です。",
 "<mark>全曲でただ一度の ff がこの区間の頂点</mark>。以後、二度と ff は書かれません。"],
 notes:[["和声","上声の平行和音が半音階的に押し上げられ、旋法性が一時的に崩れます。緊張は和声よりも音域と密度で作られています。"],
 ["描写","サパテアード（靴の踏み鳴らし）に近い。ギターと歌の場面から、踊りの場面への移行です。"]],
 tech:[["01","ff の位置を先に決め、そこから逆算して mf からの音量を4〜5段階に配分する。感覚で増やすと必ず途中で天井に当たります。"],
 ["02","上腕から打鍵してよい唯一の場所。ただし打鍵後は即脱力。押し続けると次の和音で腕が固まります。"],
 ["03","アクセントは音量ではなく打鍵速度で作る。同じ音量でも速い打鍵は鋭く聴こえます。"],
 ["04","遅いテンポで和音のポジション（手の形）を暗記してから加速する。ここは読譜しながらでは絶対に間に合いません。"]]},

{from:38,to:60,fam:"dance",tag:"Recede",
 title:"踊りが遠ざかる — 長い後退",
 ital:"mf → dim. → più dim. → pp",
 body:["踊りの音型が続きますが、少しずつ音量が落ち、音域が上がり、密度が薄くなります。dim. と più dim. が段階的に指示され、8va に移って pp へ。",
 "つまり「終わった」のではなく「遠ざかった」。同じ音楽が距離を得て小さくなる、という遠近法の実演です。この処理がこの曲の最も独創的な部分だと思います。"],
 notes:[["構造","20小節以上をかけた減衰。ドビュッシーは終止ではなく距離で場面を区切ります。"],
 ["和声","上行する平行和音の中に全音音階的な断片が顔を出し、調的重力が抜けていきます。"]],
 tech:[["01","dim. を「4段の棚」に分ける（mf → mp → p → pp）。各段の最初の音で音量をリセットし、段の中では平坦に。連続的に減らそうとすると必ず早く尽きます。"],
 ["02","音域が上がるほど楽器が自然に軽く鳴る。その物理を利用して、指の力を減らすより「高い音域に移る」ことで dim. を稼ぐ。"],
 ["03","8va に入ったら指を立てて先端で弾く。寝かせると高音域が濁ります。"],
 ["04","ペダルも段階的に浅くする。音量だけ落としてペダルが深いままだと、距離ではなく単なる小音量になります。"]]},

{from:61,to:66,fam:"base",tag:"Rubato",
 title:"歌の回帰 — 短い橋",
 ital:"Tempo rubato → retenu",
 body:["カンテの和音主題が短く戻り、dim. して p、そして retenu。次の大きな場面への橋渡しです。",
 "ここで調号が書き換わり、より♯の多い領域へ移ります。異名同音的な読み替えによって、同じ響きが別の光で照らされる準備がされます。"],
 notes:[["和声","記譜上ダブルシャープが増え、視覚的にも濃くなります。実質的な音高より、書法が先に緊張を告げている例です。"]],
 tech:[["01","読譜負荷が跳ね上がる区間。ダブルシャープは実音（例：F𝄪＝G♮）に読み替えて指使いを固定し、目より手に覚えさせる。"],
 ["02","この6小節だけ先に暗譜してしまうと、全体の通し練習が一気に楽になります。"],
 ["03","retenu で止まりきらないこと。次の Tempo I は「戻る」のではなく「沈み込む」ので、勢いを少し残しておきます。"]]},

{from:67,to:77,fam:"base",tag:"Tempo I",
 title:"Tempo I — もっと身を任せて",
 ital:"Tempo I (avec plus d'abandon), pp",
 body:["冒頭のハバネラが戻りますが、指示は「より身を委ねて」。同じ素材が、和音的に厚く、官能的に鳴らされます。再現部でありながら感情の温度だけが上がっている構成です。",
 "低音は依然ハバネラ。上声の和音は密集し、内声の半音がねっとり絡みます。"],
 notes:[["構造","古典的な再現部の「確認」ではなく、記憶が濃くなって戻ってくる形。同じ場所に二度目に立ったときのほうが強く感じる、という時間感覚です。"],
 ["和声","主題の増2度が和音の中に埋め込まれ、旋律の輪郭よりも色として作用します。"]],
 tech:[["01","abandon は速度ではなく重心の話。手首を落として鍵盤に沈む方向で弾く。ただし pp の枠は外さない。「重心は深く、音量は小さく」が課題です。"],
 ["02","厚い和音は最上音と最低音を先に決めて、内声は後から足す練習。全部同時に鳴らそうとすると輪郭が消えます。"],
 ["03","テンポの揺れは左手が主導する。右手が揺れて左手が追うと、ハバネラの脈が壊れます。"],
 ["04","ペダルは冒頭より深めでよい。ここは「濁り」がむしろ官能の表現です。"]]},

{from:78,to:91,fam:"base",tag:"Build",
 title:"pp subito から poco cresc. — 二度目の高まり",
 ital:"pp subito, poco cresc.",
 body:["三連符の和音が積み重なり、pp subito から少しずつ増していきます。ただし今回は ff には到達しません。踊りの記憶をなぞるだけで、再現はされない。",
 "mf、f を経て dim. し、静かな和音で沈みます。「盛り上がりかけて引く」動きが、曲の後半の基本挙動です。"],
 notes:[["構造","33小節の Très rythmé との対比で聴くと意味が出ます。一度目は実際に踊り、二度目は思い出しているだけ。"]],
 tech:[["01","poco cresc. の poco を厳守。ここで出しすぎると、この後の遠景場面が効きません。到達点を f の一歩手前に決めておく。"],
 ["02","pp subito は前の音を切ってから作る。ペダルを完全に上げて、無音を一瞬挟むと落差が出ます。"],
 ["03","三連符の和音は手のポジション移動が多い。移動先を目で先取りする練習（次の和音を見てから今の和音を弾く）を入れる。"]]},

{from:92,to:108,fam:"guitar",tag:"Guitar III",
 title:"三度目のギター — 音域が極端に開く",
 ital:"Tempo giusto, pp / 8va",
 body:["ギターの和音が三度目に登場。今度は 8va で高音域に置かれ、低音は単発の深い音になります。<mark>全曲で最も音域の隔たりが大きい区間</mark>です。",
 "中間音域が空くことで、音と音のあいだに空気の層ができます。近くのギターではなく、路地の反響を通ってきた音。"],
 notes:[["描写","高音＝弦の倍音、低音＝胴の共鳴、その中間の空白＝夜の空気。楽器を分解して空間に配置し直したような書法です。"],
 ["和声","和音自体はほぼ静止し、低音のみが動きます。ハーモニーではなく音響の変化で時間が進みます。"]],
 tech:[["01","左右で完全に別の奏法。低音は手を落として離す（打楽器）、上の和音は指先だけ（撥弦）。同じタッチで弾くと空間が消えます。"],
 ["02","ペダルは低音の打鍵直後に踏み、上の和音の前に浅く戻す。低音の余韻だけを残すのが目標。"],
 ["03","中間音域の空白を怖がって余韻を足さないこと。埋めた瞬間にこの箇所の発明が無効になります。"],
 ["04","高音の連打は手首の上下でなく指の交替で。手首を使うと pp が保てません。"]]},

{from:109,to:121,fam:"far",tag:"Lointain",ex:"metric",
 title:"Léger et lointain — 3/4、別の音楽が遠くで鳴る",
 ital:"Léger et lointain (la ♩.= ♪ de la mesure précédente), 3/4, pp",
 body:["拍子が 3/4 に変わります。しかも「前の小節の8分音符＝新しい付点4分音符」という<mark>メトリック・モジュレーション</mark>付き。前の音楽の脈が、そのまま別の速度の音楽に変換されます。",
 "内容も新しい。軽く、断片的で、♭系の音が混ざり、これまでの旋法から外れます。別の場所で別の誰かが演奏している音楽が、風に乗って届いた、という設定です。",
 "この曲でいちばん詩的な発明はここだと思います。転調でも展開でもなく、「別の音源の混入」。"],
 notes:[["構造","主題労作という発想の外側にある手法。ソナタ的な論理ではなく、空間内の音源配置で音楽を組み立てています。"],
 ["和声","半音的な下行と♭の異物感。前後の♯だらけの世界に対して、明確に「よそ者」として響きます。"]],
 tech:[["01","♩.＝♪ を体で覚える。前の小節の8分音符を声に出して数え続けたまま、新しい拍に乗り移る練習を単独で20回。"],
 ["02","léger を徹底。鍵盤を浅く、指を寝かせない。ここでタッチが重くなると距離感が消え、すぐ隣で鳴っているように聴こえます。"],
 ["03","♭系の音を「異物」として少しだけ違う音色で置く。周りに馴染ませないのがコツ。"],
 ["04","遠い＝ぼやける、ではありません。遠い＝小さいが輪郭は明瞭。pp でもリズムの角は保つ。"]]},

{from:122,to:129,fam:"far",tag:"Alternation",
 title:"2/4 と 3/4 の交替 — 二つの音楽が重なる",
 ital:"Tempo I ⇄ Léger et lointain",
 body:["ハバネラ（2/4、近景）と遠景の音楽（3/4）が短く交互に現れます。切り替えのたびにメトリック・モジュレーションが働き、脈が乗り換わる。",
 "どちらが主でどちらが従とも言えない状態になり、聴き手の注意が二つの音源のあいだで揺れます。夜に複数の音楽が同時に存在している、その感覚の再現です。"],
 notes:[["構造","この交替は解決されません。統合も勝敗もなく、ただ並置されたまま終わりに向かいます。"]],
 tech:[["01","二つの速度をメトロノームで別々に確認し、切り替えの瞬間だけを取り出して反復。ここは音楽ではなく計算の練習として割り切る。"],
 ["02","音色は完全に別人格で。テンポ関係は正確に、質感は無関係に、が理想です。"],
 ["03","場面の切り替わりで一瞬の間を取りたくなるが、取らない。切り替えが滑らかすぎるくらいでちょうど良い。"]]},

{from:130,to:136,fam:"base",tag:"Coda",ex:"coda",
 title:"Mouvement du début — 消えていく",
 ital:"Mouvement du début, pp → ppp, m.d. / m.g.",
 body:["冒頭の運動に戻ります。両手を交互に使う指示（m.d.＝右手、m.g.＝左手）で断片が分解され、モチーフが手から手へ渡されて崩れていく。",
 "最後にようやく <span class=\"chord\">F♯</span> の主和音が来ますが、ppp です。100小節以上引き延ばされた属音がやっと解決するのに、その瞬間には誰も注目していない。",
 "終止として鳴らすのではなく、音楽が去ったあとに残った響き、として置かれています。夜は終わらず、こちらが眠ってしまう。"],
 notes:[["和声","長大な C♯ 保続の解決。ただし機能的なカデンツの手続きは踏まず、ただ消えるように到達します。"],
 ["構造","序奏と同じ素材で閉じる円環構造。ただし冒頭が「始まる前」だったのに対し、ここは「終わったあと」です。"]],
 tech:[["01","m.d./m.g. の受け渡しで音色が変わらないよう、両手で同じ指番号・同じ角度を使う。継ぎ目が聴こえたら失敗です。"],
 ["02","最後の和音は、下から順に鍵盤に触れてから同時に沈める。上から落とすと ppp になりません。"],
 ["03","ペダルを離す時刻まで決めておく。無音になる瞬間までが曲です。"],
 ["04","終わったあと手を鍵盤から離すタイミングも設計する。演奏動作は音が消えるまで続いています。"]]}
];


/* ==========================================================
   リアルタイム解説
   ========================================================== */
var GREADY=false;
const FAMLINE={base:'#7fb6be',guitar:'#1e6e7e',dance:'#c22a3a',far:'#e9dfc7'};
const SECOF=new Int16Array(MCOUNT+2);
SEC.forEach((s,i)=>{for(let m=s.from;m<=s.to;m++) SECOF[m]=i;});

/* 標語の日本語 */
const GLOSS=[
  [/mouvement de habanera/i,'ハバネラの動きで'],
  [/commencer lentement/i,'ゆっくり始めて'],
  [/nonchalamment/i,'気だるく優雅なリズムで'],
  [/mouv.*d[ée]but/i,'冒頭の動きで'],
  [/tempo giusto/i,'正確な拍で（ギターの場面）'],
  [/tempo rubato/i,'自由に歌って（カンテの場面）'],
  [/tr[èe]s rythm/i,'非常にリズミカルに'],
  [/l[ée]ger et lointain/i,'軽く、遠くから'],
  [/avec plus d.abandon/i,'もっと身を委ねて'],
  [/tempo o|tempo 1/i,'最初のテンポで'],
  [/mesure pr[ée]c[ée]dente/i,'前の小節の拍を受け継いで（メトリック・モジュレーション）'],
  [/retenu/i,'ためて、遅く'],
  [/pi[ùu] dim/i,'さらに弱く'],
  [/poco cresc/i,'少しずつ強く'],
  [/dim\./i,'だんだん弱く'],
  [/cresc/i,'だんだん強く'],
  [/subito/i,'急に'],
  [/m\.d\./i,'m.d.＝右手'],
  [/m\.g\./i,'m.g.＝左手']
];
const DYNGL={ppp:'きわめて弱く',pp:'とても弱く',p:'弱く',mp:'やや弱く',mf:'やや強く',f:'強く',ff:'とても強く'};
function glossOf(t){
  if(!t) return '';
  const out=[];
  for(const [re,jp] of GLOSS) if(re.test(t)&&out.indexOf(jp)<0) out.push(jp);
  return out.join(' ／ ');
}
function cleanMk(t){
  let x=(t||'')
    .replace(/Mouv\s*t?\s*du d[ée]but/i,'Mouvement du début')
    .replace(/Tempo o/g,'Tempo 1º')
    .replace(/^\([^)]*\)\s*/,'')                    // 先頭の注記（＝メトリック・モジュレーション）は訳文へ
    .replace(/\s*Commencer lentement.*/i,'')         // 長い補足も訳文へ
    .replace(/\s+/g,' ').trim();
  const cut=x.replace(/\s*m\.[dg]\.(\s*m\.[dg]\.)*\s*$/i,'').trim();
  return cut||x;
}

/* 標語・強弱のイベント表 */
const MK=[];
for(let i=0;i<MCOUNT;i++){
  const t=(MS[i].mk||'').trim(), dy=[...new Set((MS[i].dy||[]).map(d=>d[1]))];
  if(t||dy.length) MK.push({i:i,n:MS[i].n,t:t,dy:dy});
}
const DYNL=[];                                    /* いま有効な、楽譜に印刷された強弱 */
(function(){let c='';
  for(let i=0;i<MCOUNT;i++){ const d=MS[i].dy||[]; if(d.length) c=d[d.length-1][1]; DYNL.push(c); }})();

/* 構造マップ */
const gbar=$('gbar');
gbar.innerHTML=SEC.map((s,i)=>
  '<button class="gseg" data-i="'+i+'" data-fam="'+s.fam+'" style="flex-grow:'+(s.to-s.from+1)+
  '" aria-label="m.'+s.from+'–'+s.to+' '+s.tag+'"></button>').join('')+
  '<i class="gnow" id="gnow"></i>';
const gsegs=[...gbar.querySelectorAll('.gseg')], gnow=$('gnow');
gsegs.forEach(b=>b.addEventListener('click',()=>{
  const i=+b.dataset.i;
  setFollow(1); jumpToMeasure(SEC[i].from);
}));
function mapRange(){
  gsegs.forEach((b,i)=>b.classList.toggle('out', SEC[i].to<ST.rgA||SEC[i].from>ST.rgB));
}
const _rangeUI=rangeUI;                       // 練習範囲を変えたらマップも塗り分け直す
rangeUI=function(){ _rangeUI(); mapRange(); };
function setMapOn(i){
  gsegs.forEach((b,k)=>b.classList.toggle('on',k===i));
}
function setMapSel(i){
  gsegs.forEach((b,k)=>b.classList.toggle('sel', !GS.follow && k===i));
}

/* 位置の移動 */
function jumpToMeasure(n){
  const p=MS[n-1].start;
  if(n<ST.rgA||n>ST.rgB){
    ST.rgA=Math.min(ST.rgA,n); ST.rgB=Math.max(ST.rgB,n); rangeUI(); save(); buildMap();
  }
  if(playing) seekTo(p,1); else { anchorP=p; }
  draw();
}
function practiceSection(i){
  const s=SEC[i];
  ST.rgA=s.from; ST.rgB=s.to; rangeUI(); save(); buildMap();
  if(playing) seekTo(rangeA(),1); else anchorP=rangeA();
  draw();
}

/* 解説の描画 */
var GS={idx:-1,mi:-1,follow:1,manual:0};
function renderGuide(i,anim){
  if(i==null||i<0||i>=SEC.length) i=0;
  const dir=(GS.idx<0||GS.idx===i)?0:(i>GS.idx?1:-1);   /* 進む＝1／戻る＝-1 */
  const s=SEC[i]; GS.idx=i;
  $('gfam').style.background=FAMLINE[s.fam];
  $('gtag').textContent=s.tag;
  $('gmm').textContent='m.'+s.from+'–'+s.to;
  $('gseglab').textContent=s.tag+' ／ m.'+s.from+'–'+s.to;
  const music='<div class="v-music">'+s.body.map(p=>'<p>'+p+'</p>').join('')+
    '<ul class="g-notes">'+s.notes.map(n=>'<li><b>'+n[0]+'</b>　'+n[1]+'</li>').join('')+'</ul></div>';
  const tech='<div class="v-tech"><ul class="g-notes">'+
    s.tech.map(n=>'<li><span class="g-step">'+n[0]+'</span>'+n[1]+'</li>').join('')+'</ul></div>';
  const b=$('gbody');
  b.innerHTML='<h3 class="g-ttl">'+s.title+'</h3><p class="g-ital">'+s.ital+'</p>'+music+tech;
  if(anim){
    const cls=dir>0?'g-in-next':(dir<0?'g-in-prev':'g-fade');
    b.classList.remove('g-fade','g-in-next','g-in-prev'); void b.offsetWidth; b.classList.add(cls);
  }
  setMapSel(i);
}
function updateLive(mi){
  let cur=null,nxt=null,txt=null;
  for(const e of MK){
    if(e.i<=mi){ cur=e; if(e.t) txt=e; }
    else { nxt=e; break; }
  }
  const t=cleanMk(txt?txt.t:'');
  $('gmk').innerHTML = t ? t+(txt.i<mi?'<em class="from">m.'+txt.n+'〜</em>':'') : '—';
  const d=DYNL[mi];
  $('ggl').textContent=[glossOf(txt?txt.t:''),DYNGL[d]||''].filter(Boolean).join('　/　');
  $('gdyn').innerHTML='<b>'+(d||'—')+'</b>';
  if(nxt){
    const d=nxt.n-MS[mi].n, g=glossOf(nxt.t), lab=cleanMk(nxt.t)||nxt.dy.join(' ');
    $('gnextmk').innerHTML='次の指示 → <b>'+(lab||'—')+'</b>'+(g?'（'+g+'）':'')+
      ' m.'+nxt.n+'・あと'+d+'小節';
  } else $('gnextmk').textContent='';
  const si=SECOF[MS[mi].n];
  if(si+1<SEC.length){
    const ns=SEC[si+1];
    $('gnextsec').innerHTML='次の場面 → <b>'+ns.tag+'</b> m.'+ns.from+'・あと'+(ns.from-MS[mi].n)+'小節';
  } else $('gnextsec').textContent='';
  const live=$('glive');
  if(cur&&cur.i===mi){ live.classList.remove('flash'); void live.offsetWidth; live.classList.add('flash'); }
}
function guideUpdate(pos){
  if(!GREADY) return;
  const mi=measureAt(pos);
  gnow.style.left=(((mi+(pos-MS[mi].start)/MS[mi].L)/MCOUNT)*100)+'%';
  if(mi!==GS.mi){
    GS.mi=mi;
    const si=SECOF[MS[mi].n];
    updateLive(mi);
    setMapOn(si);
    if(GS.follow&&si!==GS.idx) renderGuide(si,true);
  }
  const s=SEC[GS.idx];
  if(s){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    $('gprog').style.width=Math.max(0,Math.min(1,(pos-a)/(b-a)))*100+'%';
  }
}

/* 場面の色を、ピアノロールの背景に薄く敷く */
function drawSectionBands(g,left){
  if(!GREADY) return;
  const right=left+W/PXP;
  g.font='9px ui-monospace,Menlo,monospace';
  for(const s of SEC){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    if(b<left||a>right) continue;
    const x0=(a-left)*PXP, x1=(b-left)*PXP;
    g.globalAlpha=s.fam==='far'?0.07:0.11; g.fillStyle=FAMLINE[s.fam];
    g.fillRect(x0,0,x1-x0,H);
    g.globalAlpha=0.85;
    g.strokeStyle=FAMLINE[s.fam]; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x0,0); g.lineTo(x0,H); g.stroke();
    g.fillStyle=FAMLINE[s.fam]; g.fillText(s.tag,x0+5,H-6);
    g.globalAlpha=1;
  }
}

/* 操作 */
function setFollow(v){
  GS.follow=v?1:0; ST.gfollow=GS.follow; save();
  $('gfollow').classList.toggle('on',!!GS.follow);
  $('ghint').textContent=GS.follow?'':'手動で表示中';
  if(GS.follow){ const si=SECOF[MS[Math.max(0,GS.mi)].n]; renderGuide(si,true); setMapSel(si); }
  else setMapSel(GS.idx);
}
$('gfollow').addEventListener('click',()=>setFollow(!GS.follow));
$('gprev').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.max(0,GS.idx-1),true); });
$('gnextbtn').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.min(SEC.length-1,GS.idx+1),true); });
$('gprac').addEventListener('click',()=>{ practiceSection(GS.idx); setFollow(1); });
const gview=$('gview');
[...gview.children].forEach(b=>{
  b.classList.toggle('on',b.dataset.v===ST.gview);
  b.addEventListener('click',()=>{
    ST.gview=b.dataset.v; save();
    [...gview.children].forEach(x=>x.classList.toggle('on',x===b));
    $('guide').className='guide view-'+ST.gview;
  });
});
$('guide').className='guide view-'+ST.gview;

/* 起動 */
GS.follow=ST.gfollow?1:0;
$('gfollow').classList.toggle('on',!!GS.follow);
$('ghint').textContent=GS.follow?'':'手動で表示中';
mapRange();
GREADY=true;
GS.mi=-1;
renderGuide(SECOF[MS[measureAt(anchorP)].n],false);
draw();


/* ---- 音の設定シートの開閉 ---- */
function openSheet(){ $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden','false');
  document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden'; }
function closeSheet(){ $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden','true');
  document.documentElement.style.overflow=''; document.body.style.overflow=''; resize(); draw(); }
$('openSet').addEventListener('click',openSheet);
$('closeSet').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('sheet').classList.contains('open')) closeSheet(); });

<\/script>

<script>
/* ---- 押した指に反応させる（iOSの :active は当てにならないので自前で） ---- */
(function(){
  var SEL='button,.sw', cur=null;
  function off(){ if(cur){ cur.classList.remove('tapdown'); cur=null; } }
  document.addEventListener('pointerdown',function(e){
    var t=(e.target&&e.target.closest)?e.target.closest(SEL):null;
    if(!t||t.disabled) return;
    off(); cur=t; t.classList.add('tapdown');
  },{passive:true});
  document.addEventListener('pointerup',off,{passive:true});
  document.addEventListener('pointercancel',off,{passive:true});
  document.addEventListener('pointermove',function(e){ if(cur&&e.buttons===0) off(); },{passive:true});
  window.addEventListener('blur',off);
})();
<\/script>

<script>
/* 親（曲の一覧）から「止めて」と言われたら、音を完全に落としてから消える */
window.addEventListener('message',function(e){
  if(!e||!e.data||e.data.cmd!=='halt') return;
  try{ if(typeof stopAll==='function') stopAll(); }catch(_){}
  try{ if(typeof ctx!=='undefined'&&ctx&&ctx.close) ctx.close(); }catch(_){}
});
<\/script>

/* ===== リアルタイム解説 ===== */
:root{ --tile:#6b5578; --tilelt:#c3a6cd; --granate:#b2455c; --gsand:#f0e2cd; }

/* 構造マップ（画面上部に固定） */

  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

  box-shadow:0 0 7px rgba(216,164,65,.9);pointer-events:none;border-radius:1px}

/* 解説カード */
.guide{padding:0;overflow:hidden}
.g-prog{height:2px;background:rgba(216,164,65,.14)}
.g-prog i{display:block;height:100%;width:0;background:var(--amber)}
.g-top{display:flex;align-items:center;gap:9px;padding:12px 14px 10px}

<details class="keys">
  <summary>この曲を貫く4つの仕掛け</summary>
  <div class="keys-in">
    <h4>① 題名じたいが冗談 — 「そのゆるやかなワルツより、もっと遅い」</h4>
    <p>1900年代のサロンやカフェには <span class="chord">valse lente</span>（ゆるやかなワルツ）という量産ジャンルがありました。この曲の題は、そこに最上級をかぶせたものです。ドビュッシーはこの音楽を茶化しながら、同時に本気で書いています。冗談として弾くと薄く、真面目に弾くと重い。その中間に置き場所があります。</p>
    <h4>② 1拍目を待つ</h4>
    <p>3拍子なのに、冒頭は4分休符から始まります。以後も旋律は拍の頭を避け、遅れて入り、伸びて、遅れて着地する。<span class="chord">Rubato / Retenu / Cédez / En serrant / Animez</span> — 楽譜には速度をゆらす指示が40か所近く書き込まれています。この曲は「テンポを守れない曲」ではなく、「テンポを崩す手順が書いてある曲」です。</p>
    <h4>③ B𝄫（重変ロ）という綴り</h4>
    <p>主題の内声で、右手はしばしば <span class="chord">B♭ → B𝄫 → A♭</span> と半音でしなだれます。実音は A♮ ですが、A とは書かれない。G♭ 長調の世界から出ないための綴りであり、同時に「下がりたがっている音」だという指示でもあります。</p>
    <h4>④ ♭の世界と♯の世界</h4>
    <p>中間部（m.76〜）で楽譜は突然♯だらけになります。鍵盤の上では同じ場所を弾いているのに、記譜が変わることで音楽の身分が変わる。G♭ のサロンから F♯ の別世界へ、そしてまた戻ってくる。ピアノでしか成立しない転調の書き方です。</p>
    <div class="pull">流行歌の書き方で、流行歌にならないものを書く。<br>そのぶんだけ、遅い。</div>
    <p>1910年作。ドビュッシーは同じ年にこの曲を出版し、1912年にはツィンバロムを含む小編成の管弦楽版も自作しています。カフェのハンガリー人奏者の響きを、そのまま作品の中に持ち込んだかたちです。</p>
  </div>
</details>

function posToSec(p){const i=p/STEP,a=Math.floor(i);if(a>=TMAP.length-1)return TMAP[TMAP.length-1];return TMAP[a]+(TMAP[a+1]-TMAP[a])*(i-a);}
function secToPos(s){let lo=0,hi=TMAP.length-1;if(s<=0)return 0;if(s>=TMAP[hi])return TOTAL;
  while(hi-lo>1){const m=(lo+hi)>>1;if(TMAP[m]<=s)lo=m;else hi=m;}
  const d=TMAP[hi]-TMAP[lo];return (lo+(d?(s-TMAP[lo])/d:0))*STEP;}

/* ---- audio ---- */
let ctx=null,bus=null;
function ensureAudio(){
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
    bus=ctx.createGain();bus.gain.value=0.85;bus.connect(ctx.destination);}
  if(ctx.state==='suspended')ctx.resume();
}
const TIMBRES={piano:'ピアノ風',guitar:'ギター風（ナイロン弦）',marimba:'マリンバ風',bell:'鐘のような音',sine:'正弦波'};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function voice(t,midi,dur,gain,kind){
  const f=mtof(midi),g=ctx.createGain();g.connect(bus);
  const rel=kind==='sine'?0.12:0.3,end=t+Math.max(0.1,dur)+rel;
  if(kind==='sine'){const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.02);
    g.gain.setValueAtTime(gain,t+Math.max(0.07,dur));g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t);o.stop(end+0.02);return;}
  if(kind==='guitar'){const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=1.1;
    lp.frequency.setValueAtTime(Math.min(6000,f*9),t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(220,f*2),t+0.35);
    o.connect(lp);lp.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.006);
    g.gain.exponentialRampToValueAtTime(gain*0.28,t+0.28);g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t);o.stop(end+0.02);return;}
  if(kind==='marimba'||kind==='bell'){
    const parts=kind==='marimba'?[[1,1],[4,0.28],[9.2,0.1]]:[[1,1],[2.76,0.35],[5.4,0.16]];
    const dec=kind==='marimba'?0.45:2.0;
    parts.forEach(([r,a])=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f*r;
      const gg=ctx.createGain();gg.gain.value=a;o.connect(gg);gg.connect(g);o.start(t);o.stop(t+dec+0.1);});
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec);return;}
  const o1=ctx.createOscillator();o1.type='triangle';o1.frequency.value=f;
  const o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=f*2;
  const g2=ctx.createGain();g2.gain.value=0.22;o2.connect(g2);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';
  lp.frequency.setValueAtTime(Math.min(8000,f*8+900),t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(300,f*2.2),t+0.8);
  o1.connect(lp);g2.connect(lp);lp.connect(g);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.008);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain*0.35),t+Math.min(1.2,0.25+dur*0.5));
  g.gain.exponentialRampToValueAtTime(0.0001,end);
  o1.start(t);o1.stop(end+0.02);o2.start(t);o2.stop(end+0.02);
}
function click(t,strong,gain){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square';o.frequency.value=strong?2100:1350;o.connect(g);g.connect(bus);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);o.start(t);o.stop(t+0.06);
}
/* dynamics carried forward from the printed marks */
const DYN=[[],[]];
(function(){let cur=[0.30,0.30];
  for(let i=0;i<MCOUNT;i++){ (MS[i].dy||[]).forEach(d=>{cur[d[0]]=d[2];});
    DYN[0].push(cur[0]); DYN[1].push(cur[1]); }})();
/* 声部の重み：その瞬間いちばん上で鳴っている音＝旋律を前に出し、内声を引く。
   （伸ばしている音も「鳴っている」として数えるので、長い旋律の下で刻む和音は内声になる） */
const EMPH=new Float64Array(NOTES.length);
(function(){
  NOTES.forEach((n,i)=>{
    let top=-1, low=999;
    for(let j=i;j>=0;j--){
      const o=NOTES[j];
      if(n.abs-o.abs>40) break;
      if(o.abs+o.q<=n.abs+1e-6) continue;          // もう鳴り終わっている
      if(o.h===0){ if(o.midi>top) top=o.midi; } else { if(o.midi<low) low=o.midi; }
    }
    for(let j=i+1;j<NOTES.length;j++){
      const o=NOTES[j];
      if(o.abs>n.abs+1e-6) break;
      if(o.h===0){ if(o.midi>top) top=o.midi; } else { if(o.midi<low) low=o.midi; }
    }
    EMPH[i] = n.h===0 ? (n.midi>=top ? 1 : 0.58)   // 右手：旋律 / 刻みの内声
                      : (n.midi<=low ? 0.8 : 0.58); // 左手：バス / ワルツの和音
  });
})();
function gainFor(i,n){ return (ST.dyn ? DYN[n.h][n.m-1] : 0.42) * EMPH[i]; }

/* 左手の波線（m.120〜124）は下から順に転がす */
const ARP_STEP=0.05;

/* ---- scheduling (look-ahead: 先の0.5秒ぶんだけ予約する) ---- */
let playing=false,anchorT=0,anchorP=0,baseSec=0,noteIdx=0,metro=[],metroIdx=0,schedId=null,raf=null;
let horizon=0;   /* ここまでは既に音を予約済み、という時刻 */
const rangeA=()=>MS[ST.rgA-1].start, rangeB=()=>MS[ST.rgB-1].start+MS[ST.rgB-1].L;
const LOOK=0.5;
function secOf(p){return anchorT+posToSec(p)-baseSec;}
function firstNoteAt(pos){
  let lo=0,hi=NOTES.length;
  while(lo<hi){const m=(lo+hi)>>1; if(NOTES[m].abs<pos-1e-6) lo=m+1; else hi=m;}
  return lo;
}
function buildMetro(){
  metro=[];
  if(!ST.onM||ST.volM<=0) return;
  const step=16/ST.div;
  for(let mi=ST.rgA-1;mi<ST.rgB;mi++)
    for(let k=0;k*step<MS[mi].L-1e-6;k++) metro.push([MS[mi].start+k*step,k===0]);
}
function seekTo(pos,flush){
  ensureAudio();
  if(flush) flushAudio();
  const a=rangeA(),b=rangeB();
  if(pos<a||pos>=b) pos=a;
  anchorP=pos; baseSec=posToSec(pos); anchorT=ctx.currentTime+0.12;
  noteIdx=firstNoteAt(pos);
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pos-1e-6) metroIdx++;
}
function schedTick(){
  if(!playing||!ctx) return;
  const now=ctx.currentTime, until=now+LOOK, b=rangeB();
  horizon=until;
  let budget=48;                                  // 1回のtickで予約する上限
  while(noteIdx<NOTES.length&&budget>0){
    const idx=noteIdx, n=NOTES[noteIdx];
    if(n.abs>=b){ noteIdx=NOTES.length; break; }
    const t=n.g?secOf(n.abs)-0.095:secOf(n.abs);
    if(t>until) break;
    noteIdx++;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const gv=gainFor(idx,n)*((n.h===0?ST.volR:ST.volL)/100)*(n.g?0.55:1);
    if(gv<=0) continue;
    const dur=n.g?0.09:posToSec(Math.min(b,n.abs+n.q))-posToSec(n.abs);
    const roll = n.arp ? n.ao*ARP_STEP : 0;
    voice(Math.max(now,t+roll),n.midi,Math.max(0.08,dur-roll),gv,n.h===0?ST.tbR:ST.tbL);
    budget--;
  }
  while(metroIdx<metro.length){
    const t=secOf(metro[metroIdx][0]);
    if(t>until) break;
    click(Math.max(now,t),metro[metroIdx][1],ST.volM/100*0.5);
    metroIdx++;
  }
  if(now>=secOf(b)-0.02){
    if(ST.loop) seekTo(rangeA());
    else { stopAll(); anchorP=rangeA(); draw(); label(); }
  }
}
function curPos(){
  if(!playing||!ctx) return anchorP;
  return Math.min(rangeB(),Math.max(rangeA(),secToPos(baseSec+(ctx.currentTime-anchorT))));
}
function stopAll(){
  if(schedId){clearInterval(schedId);schedId=null;}
  playing=false;
  if(ctx){bus.disconnect();bus=ctx.createGain();bus.gain.value=0.85;bus.connect(ctx.destination);}
  if(raf){cancelAnimationFrame(raf);raf=null;}
}
function start(){
  ensureAudio(); buildMap();

  playing=true; seekTo(p); schedTick();

}
function pause(){const p=curPos();stopAll();anchorP=p;draw();label();}
function reset(){stopAll();anchorP=rangeA();draw();label();}
/* ---- 設定変更の扱い ----------------------------------------------
   以前は音量でもテンポでも reflow() → seekTo() を呼んでいたため、
   先読み（0.5秒）で既に予約済みの音を、もう一度予約し直していた。
   その結果、変更した瞬間だけ同じ箇所が二重に鳴っていた。
   予約をやり直すのは「本当に位置が飛ぶとき」だけにする。            */
function flushAudio(){          /* 予約済みの音を破棄する（位置が飛ぶときだけ） */
  if(ctx){bus.disconnect();bus=ctx.createGain();bus.gain.value=0.85;bus.connect(ctx.destination);}
}
function retime(){              /* テンポなど時間軸が変わる変更：継ぎ目なく差し替える */
  if(!playing||!ctx){ buildMap(); draw(); return; }
  const now=ctx.currentTime;
  const pNow=curPos();                                   /* 旧マップでの現在地 */
  const pEdge=Math.min(rangeB(),                         /* 旧マップでの予約済みの先端 */
    secToPos(baseSec+Math.max(0,horizon-anchorT)));
  buildMap();
  anchorT=now; baseSec=posToSec(pNow);                   /* 表示も音も現在地でつなぐ */
  noteIdx=Math.max(noteIdx,firstNoteAt(pEdge+1e-6));     /* 予約済みは飛ばす＝二重に鳴らさない */
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;
}
function remetro(){             /* メトロノームの刻みが変わる変更 */
  if(!playing||!ctx){ buildMetro(); metroIdx=0; return; }
  const pEdge=secToPos(baseSec+Math.max(0,horizon-anchorT));
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;
}
function redraw(){ save(); if(!playing) draw(); }   /* 音量・音色など、予約し直す必要のない変更 */
function reflow(){ retime(); }
let lastFrame=0;
function tick(){

const cv=document.getElementById('roll'),cx2d=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(1.5,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;cx2d.setTransform(DPR,0,0,DPR,0,0);
}
const PXP=13;                       // px per sixteenth
function draw(){
  if(!W) resize();
  const pos=curPos(), view=W/PXP, left=pos-view*0.35;
  const g=cx2d;
  g.clearRect(0,0,W,H);
  g.fillStyle='#181120';g.fillRect(0,0,W,H);
  drawSectionBands(g,left);
  const yOf=m=>H-((m-LOMIDI)/(HIMIDI-LOMIDI))*H;
  // C rows
  g.fillStyle='rgba(255,255,255,.045)';
  for(let m=LOMIDI;m<=HIMIDI;m++) if(m%12===1){ const y=yOf(m); g.fillRect(0,y-1,W,2); }
  // measure lines
  g.strokeStyle='rgba(168,138,186,.32)';g.lineWidth=1;g.font='10px ui-monospace,Menlo,monospace';
  for(let i=0;i<MCOUNT;i++){
    const x=(MS[i].start-left)*PXP;
    if(x<-40||x>W+40) continue;
    g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();
    if(MS[i].n%2===1){g.fillStyle='rgba(163,160,180,.75)';g.fillText(MS[i].n,x+3,11);}
  }
  // notes（画面に入りうる範囲だけを走査）
  const vEnd=left+view;
  for(let i=firstNoteAt(left-48);i<NOTES.length;i++){
    const n=NOTES[i];
    if(n.abs>vEnd) break;
    if(n.abs+n.q<left) continue;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const x=(n.abs-left)*PXP, w=Math.max(3,(n.g?0.5:n.q)*PXP-1.5);
    const y=yOf(n.midi), h=Math.max(3,H/(HIMIDI-LOMIDI)-1);
    const on = pos>=n.abs && pos<n.abs+n.q;
    g.fillStyle = n.h===0 ? (on?'#ffd591':'#e3a648') : (on?'#f2ccd9':'#c58fa4');
    g.globalAlpha = n.g?0.6:1;
    g.fillRect(x,y-h/2,w,h);
    g.globalAlpha=1;
  }

  const px=(pos-left)*PXP;
  g.strokeStyle='#ece2cf';g.lineWidth=1.5;
  g.beginPath();g.moveTo(px,0);g.lineTo(px,H);g.stroke();
  readout(pos);
}

 ["音","右手の内声にある <span class='chord'>B𝄫</span>（重変ロ）。実音は A♮ ですが A とは書かない。「下がりたがっている音」という指示でもあります。"]],
 tech:[["01","まず左手だけを弾く。バスを置き、その減衰が始まってから2拍目の和音を落とす。和音がバスに追いつくと重くなります。"],
 ["02","右手は同音反復（F–F など）を指を替えて（3–2）。同じ指で打ち直すと、旋律が打楽器になります。"],
 ["03","ペダルは1小節1回が基本。にごったら2拍目の裏で浅く踏み替える。低音の残響だけ残して、和音の輪郭は消さない。"],
 ["04","揺らすのは旋律、保つのは左手。両手が同時に揺れると、ワルツの枠そのものが消えてしまいます。"]]},

{from:10,to:17,fam:"refrain",tag:"Cantabile",
 title:"歌が広がり、すぐに引き返す",
 ital:"mf (m.10) → p (m.14) → Retenu (m.16)",
 body:["一度 mf までふくらみますが、4小節で p に戻ります。この曲の強弱は、上がりきる前に必ず引き返します。",
 "m.16 の <span class='chord'>Retenu</span>（ためて）は点線で次の小節まで引き伸ばされています。到着するための減速ではなく、到着を先延ばしにするための減速です。"],
 notes:[["形","4＋4の均等な組み立てではなく、少しずつ長さの違うフレーズが継ぎ足されていきます。小節を数えて弾くと不自然になります。"],
 ["強弱","全曲で ff はただ一度（m.50）だけ。ここでの mf は、この曲の尺度ではもう「大きい」側です。"]],
 tech:[["01","mf は音量ではなく密度で作る。打鍵を速くするより、旋律の音だけを少し長めに保って、内声を短く切る。"],
 ["02","Retenu は最後の1小節でまとめて遅くせず、2小節かけて等分に。テンポを落とす量より、落とし方の均等さが効きます。"],
 ["03","右手の旋律線だけを取り出して、声に出して歌ってみる。息継ぎの位置がそのまま指の離し方になります。"],
 ["04","左手のバスは毎回同じ音量にしない。フレーズの上りでわずかに増やし、下りで抜く。"]]},

{from:18,to:22,fam:"refrain",tag:"Mouvement",
 title:"Mouvt — 何ごともなかったように戻る",
 ital:"Mouvement, pp",
 body:["前の Retenu をなかったことにして、もとの速さ・もとの pp に戻ります。この曲は「揺れて、戻る」を何度も繰り返しますが、戻り方はいつも素っ気ない。",
 "同じ主題が3度目に出てくるのに、まだ何も起こっていません。起こらないことが、この曲の主題でもあります。"],
 notes:[["構造","主題Aは全曲で三度大きく戻ってきます（m.18／m.60／m.104）。そのたびに周囲の和声と音域が変わり、同じ旋律が違う顔をします。"],
 ["語法","pp が基本の音量で、そこから上下する。pp を「小さい」ではなく「基準」として扱うと、この曲の遠近が出ます。"]],
 tech:[["01","戻った瞬間の音量を、直前より確実に落とす。Retenu の余韻を引きずったまま入ると、Mouvt の効果が消えます。"],
 ["02","もとの速さは、頭のなかの拍ではなく左手のバスで取り戻す。1音目のバスの置き方でテンポが決まります。"],
 ["03","繰り返しに飽きた表情を出さない。同じものを同じように弾き直せることが、この曲では技術です。"],
 ["04","ペダルを前の場面より浅く。音量ではなく残響の量で「戻った」ことを示せます。"]]},

{from:23,to:29,fam:"refrain",tag:"Animez",
 title:"Animez un peu — はじめて前に進む",
 ital:"Animez un peu (m.23) → mf → En serrant (m.27)",
 body:["「少し速めて」。この曲で初めて、時間が前に進みはじめます。ただし un peu（少し）と釘が刺してあります。",
 "m.27 の <span class='chord'>En serrant</span> は「締めながら」。accelerando と違い、音楽を圧縮して緊張を上げる語です。速くするというより、間を詰めていく感覚。"],
 notes:[["語法","この曲の速度語は、ほとんどが「量」ではなく「動作」で書かれています。serrant（締める）、cédez（譲る）、retenu（引きとめる）。速度計ではなく身振りの指示です。"],
 ["和声","上へ向かうのに、和声は解決を避け続けます。前に進んでいるのに、どこにも着かない。"]],
 tech:[["01","Animez は左手から。旋律を急がせるのではなく、伴奏の間隔を詰めると自然に前へ出ます。"],
 ["02","En serrant は1小節ごとに段をつける。連続的に速めるより、小節単位で少しずつ詰めるほうが崩れません。"],
 ["03","詰めたぶんだけ音量が上がりがち。上げるのはテンポだけ、と決めて弾き分ける練習を一度しておく。"],
 ["04","メトロノームを ♩ ではなく1小節1回（付点2分）で鳴らして、小節単位の伸縮を確認する。"]]},

{from:30,to:32,fam:"refrain",tag:"Chromatique",
 title:"両手オクターヴの半音下行 — 場面を切る言葉",
 ital:"Retenu, molto dim.",
 body:["両手がオクターヴで同じ半音階を下りてきます。旋律でも伴奏でもない、ただの「下降」。この3小節は句読点として置かれています。",
 "まったく同じ素材が m.72 と m.132 にも現れます。曲の切れ目を示す決まり文句で、これが出たら次の場面に移る合図です。"],
 notes:[["構造","三度現れる区切り。1度目は主題B、2度目は♯の世界、3度目は終結へ。同じ言葉で違う扉を開けます。"],
 ["書法","オクターヴのユニゾンなので和声がありません。和音が消える＝色が一瞬なくなる瞬間として書かれています。"]],
 tech:[["01","両手のタイミングをそろえるより、音量をそろえる。左手が半拍分だけ厚くなりやすいので、左を抜き気味に。"],
 ["02","molto dim. は最後の音まで持たせる。3小節目で急に小さくすると、次の場面の入口が濁ります。"],
 ["03","ペダルは半音階では踏みかえ続ける。にごりを残すとただの雑音になります。"],
 ["04","指使いを固定する。半音階は毎回同じ指で弾けるようにしておくと、遅くしても崩れません。"]]},

{from:33,to:40,fam:"couplet",tag:"Rubato",
 title:"第2の主題 — 昇っていく音階",
 ital:"Rubato (フェルマータのあと) → En serrant, crescendo",
 body:["フェルマータでいったん時間が止まり、そこから <span class='chord'>B♭–C♭–D♭–E♭–F</span> と一段ずつ昇る新しい旋律が始まります。主題Aが下がりたがる音楽だったのに対して、こちらは上がりたがる音楽です。",
 "左手は長いバス1音の上で和音を支えるだけ。伴奏がほとんど動かないので、右手の上昇だけが時間の進行を担います。",
 "m.38 から En serrant crescendo。ここから一気に頂点へ向かいます。"],
 notes:[["対比","主題A＝下行・内声のうごめき／主題B＝上行・素直な音階。この曲の対比はこの1点に集約されています。"],
 ["和声","上昇するたびに和声が半音ずつずれ、着地点が先送りされます。頂点（m.46）まで解決しません。"]],
 tech:[["01","上昇音階の各音を同じ音量で弾かない。5音のうち3番目を頂点にして、最後は少し抜く。まっすぐな crescendo は逆に平板です。"],
 ["02","左手のバスは踏みっぱなしのペダルで支える。踏み替えるのは和音が変わるときだけ。"],
 ["03","フェルマータの長さを決めておく。「気分で伸ばす」と、次の Rubato が始まらなくなります。"],
 ["04","m.38 からは1小節ずつ速く・強くの段を作る。3小節で3段。連続的にやると m.41 の到着がぼやけます。"]]},

{from:41,to:45,fam:"couplet",tag:"Octaves",
 title:"同じ旋律が、オクターヴで大きくなる",
 ital:"Rubato → mf (m.45)",
 body:["主題Bが両手のオクターヴで拡大されます。音は増えていますが、書かれているのは同じ旋律。厚みだけが変わります。",
 "m.45 で B♭ が繰り返し打たれ、C へ届く。ここが助走の最後で、次の小節が全曲の頂点です。"],
 notes:[["書法","オクターヴ重複は「大きくする」ためではなく、音域を上下に広げて空間を作るために使われています。"],
 ["方向","この5小節は一度も下がりません。下がらないまま次の場面に投げ込まれます。"]],
 tech:[["01","オクターヴは上の音を旋律として弾き、下は影にする。1と5を同じ強さで打つと音が固まります。"],
 ["02","手首を上下させず、前腕ごと横に運ぶ。この音域移動は腕の仕事です。"],
 ["03","m.45 の反復は同じ音量で並べない。3回目に向けてわずかに時間を詰める。"],
 ["04","頂点の直前で一度だけ、ほんのわずかに待つ。その空白が m.46 を大きくします。"]]},

{from:46,to:55,fam:"passion",tag:"Appassionato",
 title:"Appassionato — 全曲でただ一度の ff",
 ital:"Appassionato, f (m.46) → ff (m.50)",
 body:["<span class='chord'>E♭</span> を軸にした頂点。旋律は両手のオクターヴで、伴奏も和音で埋められ、この曲でいちばん厚いテクスチュアになります。",
 "m.50 の <mark>ff</mark> は、148小節のうちここ1か所だけです。前後は p と pp が支配しているので、この一点だけが例外的に大きい。",
 "そしてこの頂点は長続きしません。10小節後にはもう p に戻っています。"],
 notes:[["調","G♭ 長調の曲のなかで、ここは E♭ の側に寄っています。同主・平行の関係を借りて、いちばん明るく開けた場所を作っています。"],
 ["構成","全体の3分の1あたりに最大音量を置き、残りの3分の2をその余韻として使う設計です。"]],
 tech:[["01","ff でも打鍵は鍵盤の中から。腕の重さを落とすのであって、上から叩かない。ドビュッシーの ff は音量よりも密度です。"],
 ["02","左手の和音を弾ききらない。ここで左が全部鳴ると、旋律のオクターヴが埋もれます。"],
 ["03","ペダルは深く、ただし2拍ごとに必ず替える。厚い和音を混ぜたまま進むと濁ります。"],
 ["04","頂点のあと（m.51以降）で音量を戻す計画を先に決めておく。下り方を決めずに登ると、10小節後に p が出せません。"]]},

{from:56,to:59,fam:"couplet",tag:"Retenu",
 title:"沈んでいく — もう一度 cresc. して、やめる",
 ital:"p (m.56) → cresc. (m.57) → Retenu, dim. molto (m.59)",
 body:["p まで下がったあと、もう一度 cresc. がかかります。しかし今度は登りきらず、m.59 の Retenu と dim. molto で崩れるように収まります。",
 "この「もう一度やろうとしてやめる」動きが、次の主題A回帰を静かなものにしています。"],
 notes:[["構造","失敗する crescendo。頂点をもう一度作らないことで、m.60 の再開が回想の色を帯びます。"],
 ["強弱","dim. molto は「大きく弱める」。単なる dim. ではなく、量の指定つきです。"]],
 tech:[["01","cresc. の到達点を p+1段ぶんに決めておく。ここで f まで行くと m.46 の頂点が二重になります。"],
 ["02","Retenu と dim. を同時にやらない。先に遅く、あとから小さく、のほうが自然に消えます。"],
 ["03","最後の音の離し方を決める。指を上げる速さが、そのまま次の場面の静けさになります。"],
 ["04","ここだけを p → cresc. → Retenu と通しで何度か弾いて、山の高さを一定にする。"]]},

{from:60,to:67,fam:"refrain",tag:"Mouvt (Rubato)",
 title:"主題Aが戻る — ただし色が変わっている",
 ital:"Mouvement (Rubato), pp → f (m.66)",
 body:["主題Aが2度目の帰還。旋律はほぼ同じですが、下の和声が入れ替わっていて、冒頭より暗く、湿った響きになります。",
 "m.66 でいったん f まで開き、次の小節ですぐ dim.。ここも登りきりません。",
 "同じ旋律を違う和声で照らし直すのは、この曲の中心的な手つきです。旋律は変わらず、まわりの光だけが変わる。"],
 notes:[["和声","同じ音を別の和音の一部として読み替えることで、旋律の意味を変えています。転調というより、照明の切り替え。"],
 ["音域","冒頭より高い位置に置かれ、左手の支えも薄い。同じものが、より不安定な場所に立っています。"]],
 tech:[["01","冒頭と同じ指使い・同じペダルで弾き、和声の違いだけを聴かせる。弾き方まで変えると、比較にならなくなります。"],
 ["02","f（m.66）は一瞬。前の小節から作らず、その小節の頭で開いてすぐ閉じる。"],
 ["03","内声の B𝄫 は冒頭よりわずかに強く。ここでは下がりたがる性質のほうが前に出ます。"],
 ["04","pp の再開は、ペダルを踏んでから最初の音を置く。音より先に空間を作っておく。"]]},

{from:68,to:75,fam:"ailleurs",tag:"Léger",
 title:"léger — 32分音符が高いところをすべる",
 ital:"léger (m.68) → En serrant (m.69) → Retenu (m.72)",
 body:["左手に <span class='chord'>léger</span>（軽く）と書かれ、E♭–G♭–B♭–C の4音が32分音符で駆け上がります。旋律ではなく、光の粒のような装飾です。",
 "m.69 からは高音域で3音の下行が繰り返され、En serrant で詰められていきます。",
 "m.72〜74 は m.30 と同じ半音階の下行。そして m.75 のフェルマータで、音楽はいったん完全に止まります。この空白のあとに、別の世界が始まります。"],
 notes:[["音域","B♭6 まで上がります。ここまで高い音はこの曲では例外的で、遠くの音として置かれています。"],
 ["役割","主題の展開ではなく、場面転換のための間奏。次の♯の世界へ渡るための橋です。"]],
 tech:[["01","32分音符は指だけで転がす。手首を使うと粒がそろわず、léger になりません。鍵盤の浅いところで。"],
 ["02","高音の3音下行は、1音目だけ支えて残りは落とす。3つとも均等に鳴らすと重くなります。"],
 ["03","m.75 のフェルマータは長めに。ここでの沈黙が、次の場面の異質さを作ります。"],
 ["04","ペダルを m.75 の途中で完全に上げる。響きを残したまま次へ入ると、転換が伝わりません。"]]},

{from:76,to:85,fam:"ailleurs",tag:"Ailleurs",
 title:"♯の世界 — 鍵盤は同じなのに、別の場所",
 ital:"En animant (m.76) → Cédez (m.82) → Cédez encore plus (m.84)",
 body:["楽譜が突然♯だらけになります。<span class='chord'>A♯・D♯・G♯</span>。G♭ の側にいた音楽が、F♯ の側に移り住みます。ピアノの上では同じ鍵を押しているのに、記譜が変わることで音楽の身分が変わる。",
 "旋律も別のもので、短い動機が上下するだけ。サロンのワルツではなく、もっと素気ない何かになっています。",
 "m.82・m.84 の <span class='chord'>Cédez</span>（譲る）で二段階に減速し、次の場面へ落ちていきます。"],
 notes:[["記譜","異名同音の転調。耳では滑らかに移りますが、目には断絶として見えます。ドビュッシーは両方を同時に成立させています。"],
 ["性格","ここだけ主題A・Bのどちらとも関係のない素材が使われます。曲のなかの異物です。"]],
 tech:[["01","♯の運指をいちど白紙から組み直す。♭で覚えた形をそのまま持ち込むと必ずつまずきます。"],
 ["02","Cédez は2回とも違う量で。1回目は軽く、2回目（encore plus）ではっきり落とす。"],
 ["03","この10小節だけを取り出して、拍を数えずに弾けるまで繰り返す。ここは拍ではなく身振りで進む場所です。"],
 ["04","音量は終始 p 前後。次の Tempo animé との落差が、この場面の価値です。"]]},

{from:86,to:93,fam:"passion",tag:"Animé I",
 title:"Tempo animé — 和音がさざ波になる",
 ital:"Tempo animé, f (m.86) → Moins animé, p (m.90)",
 body:["急に速く、強くなります。右手は和音を分散させた波、左手も和音を刻み、テクスチュアが一気に細かくなる。",
 "ただし4小節で Moins animé（速さをゆるめて）に落ちます。この曲の速い場面は、いつも短い。",
 "ワルツであることを一瞬忘れたような書き方ですが、3拍子の枠は保たれたままです。"],
 notes:[["書法","旋律と伴奏の区別が消え、和音の動きそのものが音楽になります。管弦楽版でツィンバロムが受け持つ層に近い書法です。"],
 ["構成","f → p が4小節ごとに切り替わる。長い流れではなく、短い断片の交替で進みます。"]],
 tech:[["01","分散和音は和音として先につかむ。1音ずつ読むのではなく、形を手で覚えてから展開する。"],
 ["02","右手の最上声だけを取り出して弾き、線が見えるようにしてから全部を戻す。"],
 ["03","f でもペダルは浅く。ここは厚みより速さで書かれています。"],
 ["04","Moins animé への切り替えは、速度と音量を同じ瞬間に変える。ずらすと段差が濁ります。"]]},

{from:94,to:103,fam:"passion",tag:"Animé II",
 title:"Animé — 最後の加速と、長い減速",
 ital:"Animé, f (m.94) → En Retenant (m.98) → Très retenu (m.102)",
 body:["F♯ の低音に支えられて、もう一度 Animé。この曲でもっとも運動量の多い場面です。",
 "しかし m.98 から <span class='chord'>En Retenant</span>、m.102 では <span class='chord'>Très retenu</span>。6小節かけて大きく減速し、主題Aの再現へ帰る道を作ります。",
 "速い場面から遅い場面へ、切り替えではなく坂として繋ぐ。この長い減速がこの曲の要所です。"],
 notes:[["構造","♯の世界の出口。ここを抜けると調号が♭に戻り、冒頭の音楽が帰ってきます。"],
 ["速度","減速の指示が2段階（En Retenant → Très retenu）。一気に遅くせず、二度に分けて落とします。"]],
 tech:[["01","減速は小節ごとに時間を測る。「だんだん遅く」を感覚でやると、m.104 の入口の速さが毎回変わります。"],
 ["02","Très retenu では音量も落とすが、バスだけは残す。低音が消えると、次の再現が空中から始まってしまいます。"],
 ["03","m.103 の最後の和音の長さを決めておく。ここが再現の助走路です。"],
 ["04","f の場面と減速の場面を続けて通す練習をする。切り離して弾くと坂の傾きが作れません。"]]},

{from:104,to:119,fam:"refrain",tag:"Reprise",
 title:"1er Mouvement — 主題Aの再現、そして最後の f",
 ital:"1er Mouvement (En animant peu à peu), pp → f (m.112) → En Retenant (m.116)",
 body:["冒頭の音楽が3度目に、そして最後に戻ってきます。指示は「最初の速さで、少しずつ速めながら」。静かに始めて、16小節かけて育てる設計です。",
 "m.112 で f。これがこの曲で最後の大きな音です。以降、音楽は二度と大きくなりません。",
 "m.116 の En Retenant からは、終わりへ向かう長い下り坂が始まります。"],
 notes:[["構造","再現でありながら、冒頭より長く、より高く昇ります。同じ材料で作られた最後の山です。"],
 ["指示","「pp から始めて、少しずつ速めながら」。減速ではなく加速で再現を作るのは、この曲では珍しい書き方です。"]],
 tech:[["01","En animant peu à peu の「peu à peu」を守る。8小節かけて上げるので、最初の4小節はほとんど変えない。"],
 ["02","m.112 の f は、m.50 の ff より確実に小さく。二つの山の高さの差を、はっきり残す。"],
 ["03","pp の再現は、冒頭とまったく同じ音色で。ここで新しい表情をつけると、円環が閉じません。"],
 ["04","m.116 以降は音量より速度で落とす。小さくしすぎると、次の Tempo animé が唐突になります。"]]},

{from:120,to:127,fam:"passion",tag:"Tutti",
 title:"Tempo animé — 最後にもう一度、厚く",
 ital:"Tempo animé, mf (m.120) → f (m.126) → Cédez (m.127)",
 body:["和音が両手でぎっしり積まれ、左手には波線（アルペジオ）が並びます。この曲でもっとも音数の多い場面です。",
 "音は厚いのに、指示は mf から f まで。ff には戻りません。大きくするのではなく、密度を上げて終わりを準備しています。",
 "m.127 の Cédez で、音楽は最後の下降に入ります。"],
 notes:[["書法","m.120〜124 の左手は下から転がす和音。ハープやツィンバロムを思わせる響きで、1912年の管弦楽版と直結する書法です。"],
 ["構成","最大音量ではなく最大密度をここに置くことで、頂点（m.50）の位置を動かさずに終盤を盛り上げています。"]],
 tech:[["01","アルペジオは最上音を拍に合わせる。下から始めて拍に間に合わせると、旋律が遅れて聴こえます。"],
 ["02","厚い和音では、内声を鍵盤の底まで押さない。上と下だけを支えると、和音が透けます。"],
 ["03","ペダルは1拍ごとに替えるつもりで。ここを混ぜると、最後の場面の静けさが準備できません。"],
 ["04","Cédez は次の léger の速さに向けて落とす。着地点を決めてから減速を始める。"]]},

{from:128,to:135,fam:"ailleurs",tag:"Léger II",
 title:"もう一度、光の粒 — そして最後の半音階",
 ital:"léger (m.128) → En serrant (m.129) → Retenu (m.132)",
 body:["m.68〜75 とほぼ同じ場面が戻ってきます。32分音符の上昇、高音の3音下行、そして半音階の下行。",
 "違うのは、この先にもう別世界がないことです。1度目はここから♯の世界へ渡りましたが、今度は行き先がない。",
 "m.132 の Retenu には点線が3小節にわたって引かれ、そのまま終結部へ落ちていきます。"],
 notes:[["構造","同じ素材の再利用ですが、機能が変わっています。1度目は扉、2度目は行き止まり。"],
 ["和声","m.134 で E𝄫 や F♭ といった綴りが現れ、G♭ の世界がわずかに崩れはじめます。"]],
 tech:[["01","1度目とまったく同じ速さ・音色で入る。同じに弾くからこそ、行き先の違いが聴こえます。"],
 ["02","En serrant は1度目より控えめに。ここで熱くすると、終結が始められません。"],
 ["03","3小節にわたる Retenu を、小節ごとに等分して落とす。最後の小節でまとめて遅くしない。"],
 ["04","この8小節と次の Plus lent を必ず続けて練習する。境目を作らないのが目的です。"]]},

{from:136,to:148,fam:"refrain",tag:"Coda",
 title:"De plus en plus lent — 終わりまで、ずっと遅く",
 ital:"Plus lent (m.136) → De plus en plus lent (m.139) → et jusqu'à la fin → morendo",
 body:["<span class='chord'>Plus lent</span>（さらに遅く）、続いて <span class='chord'>De plus en plus lent, et jusqu'à la fin</span>（だんだん遅く、終わりまでずっと）。曲の最後の10小節は、止まるまで遅くなり続けます。",
 "高い B♭ が繰り返し鳴り、G♭ の和音がその下でゆっくり入れ替わる。最後に低い G♭ が置かれて終わります。<span class='chord'>morendo</span>＝消え入るように。",
 "「もっと遅い」という題名は、ここで文字どおりになります。冗談として始まった題が、最後には演奏指示そのものになる。"],
 notes:[["和声","終結はようやく G♭ に落ち着きますが、直前まで E𝄫・D♮ といった綴りが混ざり、着地は最後の瞬間まで確定しません。"],
 ["音域","高い B♭（m.145 以降は8va）と最低音の G♭ だけが残ります。中身が抜けて、両端だけになった状態です。"]],
 tech:[["01","「だんだん遅く」の下限を先に決める。最後の小節の速さを決めてから、そこへ向けて逆算して落とす。"],
 ["02","高音の B♭ は打ち直すたびに少しずつ弱く。同じ音量で並べると、時計のように聴こえます。"],
 ["03","最後の低い G♭ は、鍵盤に指を置いてから沈める。上から落とすと ppp になりません。"],
 ["04","ペダルを離す時刻まで譜面に書き込んでおく。無音になる瞬間までが、この曲の一部です。"]]}

];


/* ==========================================================
   リアルタイム解説
   ========================================================== */
var GREADY=false;
const FAMLINE={refrain:'#d8a441',couplet:'#8ca4b2',passion:'#c9556c',ailleurs:'#c3a6cd'};
const SECOF=new Int16Array(MCOUNT+2);
SEC.forEach((s,i)=>{for(let m=s.from;m<=s.to;m++) SECOF[m]=i;});

/* 標語の日本語 */
const GLOSS=[
  [/molto rubato/i,'たっぷり自由に'],
  [/con morbidezza/i,'やわらかく'],
  [/de plus en plus lent/i,'だんだん遅くしていって'],
  [/^plus lent/i,'さらに遅く'],
  [/jusqu.à la fin/i,'終わりまでずっと'],
  [/^lent\b/i,'ゆっくりと'],
  [/1er mouv/i,'最初の速さに戻して'],
  [/mouv/i,'もとの速さで'],
  [/animez un peu/i,'少し速めて'],
  [/en animant peu à peu/i,'少しずつ速めながら'],
  [/en animant/i,'速めながら'],
  [/tempo animé/i,'速い速さで'],
  [/moins animé/i,'速さをゆるめて'],
  [/animé/i,'速く'],
  [/en serrant/i,'締めるように、速めながら'],
  [/très retenu/i,'大きくためて'],
  [/en retenant/i,'ためながら遅く'],
  [/retenu/i,'ためて、遅く'],
  [/cédez encore plus/i,'さらに譲って（もっと遅く）'],
  [/cédez/i,'譲って（遅く）'],
  [/rubato/i,'テンポは自由に'],
  [/appassi/i,'情熱的に'],
  [/léger/i,'軽く'],
  [/molto dim/i,'大きく弱めて'],
  [/dim\./i,'だんだん弱く'],
  [/cresc/i,'だんだん強く']
];
const DYNGL={ppp:'きわめて弱く',pp:'とても弱く',p:'弱く',mp:'やや弱く',mf:'やや強く',f:'強く',ff:'とても強く',
  'più p':'さらに弱く','morendo':'消え入るように'};
function glossOf(t){
  if(!t) return '';
  const out=[];
  for(const [re,jp] of GLOSS) if(re.test(t)&&out.indexOf(jp)<0) out.push(jp);
  return out.join(' ／ ');
}
function cleanMk(t){
  let x=(t||'')
    .replace(/1er Mouvt/g,'1er Mouvement')
    .replace(/Mouvt/g,'Mouvement')
    .replace(/Appassianato/i,'Appassionato')
    .replace(/[-–—]+/g,' ')
    .replace(/\s+/g,' ').trim();
  return x;
}

/* 標語・強弱のイベント表 */
const MK=[];
for(let i=0;i<MCOUNT;i++){
  const t=(MS[i].mk||'').trim(), dy=[...new Set((MS[i].dy||[]).map(d=>d[1]))];
  if(t||dy.length) MK.push({i:i,n:MS[i].n,t:t,dy:dy});
}
const DYNL=[];                                    /* いま有効な、楽譜に印刷された強弱 */
(function(){let c='';
  for(let i=0;i<MCOUNT;i++){ const d=MS[i].dy||[]; if(d.length) c=d[d.length-1][1]; DYNL.push(c); }})();

/* 構造マップ */
const gbar=$('gbar');
gbar.innerHTML=SEC.map((s,i)=>
  '<button class="gseg" data-i="'+i+'" data-fam="'+s.fam+'" style="flex-grow:'+(s.to-s.from+1)+
  '" aria-label="m.'+s.from+'–'+s.to+' '+s.tag+'"></button>').join('')+
  '<i class="gnow" id="gnow"></i>';
const gsegs=[...gbar.querySelectorAll('.gseg')], gnow=$('gnow');
gsegs.forEach(b=>b.addEventListener('click',()=>{
  const i=+b.dataset.i;
  setFollow(1); jumpToMeasure(SEC[i].from);
}));
function mapRange(){
  gsegs.forEach((b,i)=>b.classList.toggle('out', SEC[i].to<ST.rgA||SEC[i].from>ST.rgB));
}
const _rangeUI=rangeUI;                       // 練習範囲を変えたらマップも塗り分け直す
rangeUI=function(){ _rangeUI(); mapRange(); };
function setMapOn(i){
  gsegs.forEach((b,k)=>b.classList.toggle('on',k===i));
}
function setMapSel(i){
  gsegs.forEach((b,k)=>b.classList.toggle('sel', !GS.follow && k===i));
}

/* 位置の移動 */
function jumpToMeasure(n){
  const p=MS[n-1].start;
  if(n<ST.rgA||n>ST.rgB){
    ST.rgA=Math.min(ST.rgA,n); ST.rgB=Math.max(ST.rgB,n); rangeUI(); save(); buildMap();
  }
  if(playing) seekTo(p,1); else { anchorP=p; }
  draw();
}
function practiceSection(i){
  const s=SEC[i];
  ST.rgA=s.from; ST.rgB=s.to; rangeUI(); save(); buildMap();
  if(playing) seekTo(rangeA(),1); else anchorP=rangeA();
  draw();
}

/* 解説の描画 */
var GS={idx:-1,mi:-1,follow:1,manual:0};
function renderGuide(i,anim){
  if(i==null||i<0||i>=SEC.length) i=0;
  const dir=(GS.idx<0||GS.idx===i)?0:(i>GS.idx?1:-1);   /* 進む＝1／戻る＝-1 */
  const s=SEC[i]; GS.idx=i;
  $('gfam').style.background=FAMLINE[s.fam];
  $('gtag').textContent=s.tag;
  $('gmm').textContent='m.'+s.from+'–'+s.to;
  $('gseglab').textContent=s.tag+' ／ m.'+s.from+'–'+s.to;
  const music='<div class="v-music">'+s.body.map(p=>'<p>'+p+'</p>').join('')+
    '<ul class="g-notes">'+s.notes.map(n=>'<li><b>'+n[0]+'</b>　'+n[1]+'</li>').join('')+'</ul></div>';
  const tech='<div class="v-tech"><ul class="g-notes">'+
    s.tech.map(n=>'<li><span class="g-step">'+n[0]+'</span>'+n[1]+'</li>').join('')+'</ul></div>';
  const b=$('gbody');
  b.innerHTML='<h3 class="g-ttl">'+s.title+'</h3><p class="g-ital">'+s.ital+'</p>'+music+tech;
  if(anim){
    const cls=dir>0?'g-in-next':(dir<0?'g-in-prev':'g-fade');
    b.classList.remove('g-fade','g-in-next','g-in-prev'); void b.offsetWidth; b.classList.add(cls);
  }
  setMapSel(i);
}
function updateLive(mi){
  let cur=null,nxt=null,txt=null;
  for(const e of MK){
    if(e.i<=mi){ cur=e; if(e.t) txt=e; }
    else { nxt=e; break; }
  }
  const t=cleanMk(txt?txt.t:'');
  $('gmk').innerHTML = t ? t+(txt.i<mi?'<em class="from">m.'+txt.n+'〜</em>':'') : '—';
  const d=DYNL[mi];
  $('ggl').textContent=[glossOf(txt?txt.t:''),DYNGL[d]||''].filter(Boolean).join('　/　');
  $('gdyn').innerHTML='<b>'+(d||'—')+'</b>';
  if(nxt){
    const d=nxt.n-MS[mi].n, g=glossOf(nxt.t), lab=cleanMk(nxt.t)||nxt.dy.join(' ');
    $('gnextmk').innerHTML='次の指示 → <b>'+(lab||'—')+'</b>'+(g?'（'+g+'）':'')+
      ' m.'+nxt.n+'・あと'+d+'小節';
  } else $('gnextmk').textContent='';
  const si=SECOF[MS[mi].n];
  if(si+1<SEC.length){
    const ns=SEC[si+1];
    $('gnextsec').innerHTML='次の場面 → <b>'+ns.tag+'</b> m.'+ns.from+'・あと'+(ns.from-MS[mi].n)+'小節';
  } else $('gnextsec').textContent='';
  const live=$('glive');
  if(cur&&cur.i===mi){ live.classList.remove('flash'); void live.offsetWidth; live.classList.add('flash'); }
}
function guideUpdate(pos){
  if(!GREADY) return;
  const mi=measureAt(pos);
  gnow.style.left=(((mi+(pos-MS[mi].start)/MS[mi].L)/MCOUNT)*100)+'%';
  if(mi!==GS.mi){
    GS.mi=mi;
    const si=SECOF[MS[mi].n];
    updateLive(mi);
    setMapOn(si);
    if(GS.follow&&si!==GS.idx) renderGuide(si,true);
  }
  const s=SEC[GS.idx];
  if(s){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    $('gprog').style.width=Math.max(0,Math.min(1,(pos-a)/(b-a)))*100+'%';
  }
}

/* 場面の色を、ピアノロールの背景に薄く敷く */
function drawSectionBands(g,left){
  if(!GREADY) return;
  const right=left+W/PXP;
  g.font='9px ui-monospace,Menlo,monospace';
  for(const s of SEC){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    if(b<left||a>right) continue;
    const x0=(a-left)*PXP, x1=(b-left)*PXP;
    g.globalAlpha=s.fam==='ailleurs'?0.08:0.12; g.fillStyle=FAMLINE[s.fam];
    g.fillRect(x0,0,x1-x0,H);
    g.globalAlpha=0.85;
    g.strokeStyle=FAMLINE[s.fam]; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x0,0); g.lineTo(x0,H); g.stroke();
    g.fillStyle=FAMLINE[s.fam]; g.fillText(s.tag,x0+5,H-6);
    g.globalAlpha=1;
  }
}

/* 操作 */
function setFollow(v){
  GS.follow=v?1:0; ST.gfollow=GS.follow; save();
  $('gfollow').classList.toggle('on',!!GS.follow);
  $('ghint').textContent=GS.follow?'':'手動で表示中';
  if(GS.follow){ const si=SECOF[MS[Math.max(0,GS.mi)].n]; renderGuide(si,true); setMapSel(si); }
  else setMapSel(GS.idx);
}
$('gfollow').addEventListener('click',()=>setFollow(!GS.follow));
$('gprev').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.max(0,GS.idx-1),true); });
$('gnextbtn').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.min(SEC.length-1,GS.idx+1),true); });
$('gprac').addEventListener('click',()=>{ practiceSection(GS.idx); setFollow(1); });
const gview=$('gview');
[...gview.children].forEach(b=>{
  b.classList.toggle('on',b.dataset.v===ST.gview);
  b.addEventListener('click',()=>{
    ST.gview=b.dataset.v; save();
    [...gview.children].forEach(x=>x.classList.toggle('on',x===b));
    $('guide').className='guide view-'+ST.gview;
  });
});
$('guide').className='guide view-'+ST.gview;

/* 起動 */
GS.follow=ST.gfollow?1:0;
$('gfollow').classList.toggle('on',!!GS.follow);
$('ghint').textContent=GS.follow?'':'手動で表示中';
mapRange();
GREADY=true;
GS.mi=-1;
renderGuide(SECOF[MS[measureAt(anchorP)].n],false);
draw();


/* ---- 音の設定シートの開閉 ---- */
function openSheet(){ $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden','false');
  document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden'; }
function closeSheet(){ $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden','true');
  document.documentElement.style.overflow=''; document.body.style.overflow=''; resize(); draw(); }
$('openSet').addEventListener('click',openSheet);
$('closeSet').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('sheet').classList.contains('open')) closeSheet(); });

<\/script>

<script>
/* ---- 押した指に反応させる（iOSの :active は当てにならないので自前で） ---- */
(function(){
  var SEL='button,.sw', cur=null;
  function off(){ if(cur){ cur.classList.remove('tapdown'); cur=null; } }
  document.addEventListener('pointerdown',function(e){
    var t=(e.target&&e.target.closest)?e.target.closest(SEL):null;
    if(!t||t.disabled) return;
    off(); cur=t; t.classList.add('tapdown');
  },{passive:true});
  document.addEventListener('pointerup',off,{passive:true});
  document.addEventListener('pointercancel',off,{passive:true});
  document.addEventListener('pointermove',function(e){ if(cur&&e.buttons===0) off(); },{passive:true});
  window.addEventListener('blur',off);
})();
<\/script>

<script>
/* 親（曲の一覧）から「止めて」と言われたら、音を完全に落としてから消える */
window.addEventListener('message',function(e){
  if(!e||!e.data||e.data.cmd!=='halt') return;
  try{ if(typeof stopAll==='function') stopAll(); }catch(_){}
  try{ if(typeof ctx!=='undefined'&&ctx&&ctx.close) ctx.close(); }catch(_){}
});
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="src-cathedrale"><!DOCTYPE html>

<style>

  --barbg:rgba(13,21,25,.95); --sunk:rgba(4,10,12,.5); --sunk2:rgba(4,10,12,.3);

  <p class="lead">MusicXMLから起こした<b>全89小節・1719音</b>をそのまま鳴らします。再生に合わせて、いま鳴っている場面の解説・標語・強弱がロールのすぐ下で切り替わります。ドビュッシー自身のピアノロールが明かした<b>m.7–12／m.22–83 の「2倍の速さ」</b>も、設定でオン／オフできます（既定はオン）。</p>

<details class="keys">
  <summary>この曲を貫く4つの仕掛け</summary>
  <div class="keys-in">
    <h4>① 平行五度 — 中世のオルガヌムの響き</h4>
    <p>冒頭の <span class="chord">D–G / E–A / B–E</span> は、三度をまったく含まない五度の連なり。長調とも短調とも決まらない、教会音楽が多声を始めたころ（オルガヌム）の響きです。ドビュッシーは和声の禁則だった平行五度を、そのまま「石造りの音」として使いました。</p>
    <h4>② 6/4 と 3/2 — 書かれなかったテンポ変更</h4>
    <p>この曲の最大の謎。<b>m.7–12</b> と <b>m.22–83</b> は2分音符主体で書かれていて、額面どおり弾くと突然音楽が停滞します。ドビュッシー自身が1913年に残したピアノロールでは、この2か所が<b>2倍の速さ（2分音符＝それまでの4分音符）</b>で流れていました。初版（Durand, 1910）にその指示がなく、何世代ものピアニストが「葬列のような沈める寺」を弾くことになった、という有名な話です。ヘンレ版などの新しい楽譜には注記があります。</p>
    <h4>③ 保続低音 — 動かない水底</h4>
    <p><span class="chord">G1</span>（m.1）、<span class="chord">B0</span>（m.16）、<span class="chord">E♭1</span>（m.19）、<span class="chord">C1</span>（m.28）、<span class="chord">G♯1</span>（m.47）。場面が変わるたびに、いちばん下の音が置かれて動かなくなります。その上でだけ音楽が動く。海の底に建っている建物、という状態そのものです。</p>
    <h4>④ 同じコラールを、水の上と水の下で二度</h4>
    <p>m.28 の <em>ff</em>「Sonore sans dureté」で鳴る大聖堂のオルガンは、m.72 で <em>pp</em>「Flottant et sourd（漂って、くぐもって）」として、まったく同じ和音のまま戻ってきます。しかも今度は <span class="chord">C–D–C–G</span> の揺れの中に沈められている。楽譜には「さきほど聞こえたフレーズのこだまのように」と書かれています。</p>
    <div class="pull">朝ごとに海から現れ、<br>また沈んでいく。</div>
    <p>題材はブルターニュに伝わるイス（Ys）の伝説。罪の報いとして海に沈められた都と大聖堂が、晴れた朝には水面に姿を見せ、鐘とオルガンが聞こえる — という言い伝えです。ドビュッシーは<b>曲の終わりに</b>題名を置く前奏曲集の慣例どおり、m.89 のあとに <em>(…La cathédrale engloutie)</em> と記しました。</p>

/* ---- 楽譜に印刷された標語からテンポの形をつくる ---- */
/* ドビュッシー自身のピアノロールが示す m.7–12 / m.22–83 の「2分音符＝4分音符」は
   別スイッチ（ST.dbl）として、テンポの形とは独立にかけている。 */
const SCALE = new Float64Array(MCOUNT), HOLD = new Float64Array(MCOUNT);
(function(){
  for(let i=0;i<MCOUNT;i++){
    const n=i+1; let v=1;
    if(n>=42&&n<=46)      v=1-0.05*((n-41)/5);          // 沈みはじめ、わずかに落ち着く
    else if(n>=47&&n<=61) v=1.05;                        // Un peu moins lent
    else if(n>=62&&n<=71) v=1.05-0.12*((n-61)/10);       // dim. とともに沈む
    else if(n>=85)        v=1-0.42*((n-84)/5);           // 最後の減速（響きが痩せていく）
    SCALE[i]=v;
  }
})();
function dblOn(mi){ return ST.dbl && ((mi>=6&&mi<=11)||(mi>=21&&mi<=82)) ? 2 : 1; }
function scaleAtPos(pos){
  let lo=0,hi=MCOUNT-1;
  while(lo<hi){const m=(lo+hi+1)>>1; if(MS[m].start<=pos) lo=m; else hi=m-1;}
  let v=1;
  if(ST.tmp){
    const a=SCALE[lo], b=(lo+1<MCOUNT?SCALE[lo+1]:SCALE[lo]);
    const f=(pos-MS[lo].start)/MS[lo].L;
    v=a+(b-a)*f;
  }
  return v*dblOn(lo);                                    /* 2倍は段差のまま（補間しない） */
}
let TMAP=null; const STEP=1/6;
function buildMap(){
  const base=60/ST.bpm/4, n=Math.round(TOTAL/STEP)+1;
  TMAP=new Float64Array(n); let t=0;
  for(let i=1;i<n;i++){ t+=STEP*base/scaleAtPos((i-0.5)*STEP); TMAP[i]=t; }
  if(ST.tmp) for(let i=0;i<MCOUNT;i++) if(HOLD[i]>0){
    const idx=Math.min(n-1,Math.round((MS[i].start+MS[i].L)/STEP)), add=HOLD[i]*60/ST.bpm;
    for(let j=idx;j<n;j++) TMAP[j]+=add;
  }
}
function posToSec(p){const i=p/STEP,a=Math.floor(i);if(a>=TMAP.length-1)return TMAP[TMAP.length-1];return TMAP[a]+(TMAP[a+1]-TMAP[a])*(i-a);}
function secToPos(s){let lo=0,hi=TMAP.length-1;if(s<=0)return 0;if(s>=TMAP[hi])return TOTAL;
  while(hi-lo>1){const m=(lo+hi)>>1;if(TMAP[m]<=s)lo=m;else hi=m;}
  const d=TMAP[hi]-TMAP[lo];return (lo+(d?(s-TMAP[lo])/d:0))*STEP;}
function measureAt(pos){let lo=0,hi=MCOUNT-1;while(lo<hi){const m=(lo+hi+1)>>1;if(MS[m].start<=pos)lo=m;else hi=m-1;}return lo;}

}
function click(t,strong,gain){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square';o.frequency.value=strong?2100:1350;o.connect(g);g.connect(metBus);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);o.start(t);o.stop(t+0.06);
}
let metBus=null;
function ensureMet(){ if(!metBus){metBus=ctx.createGain();metBus.gain.value=1;metBus.connect(ctx.destination);} }

/* ---- 強弱：印刷された指示を持ち越す ---- */
const DYN=[[],[]];
(function(){let cur=[0.42,0.42];
  for(let i=0;i<MCOUNT;i++){ (MS[i].dy||[]).forEach(d=>{cur[0]=d[2];cur[1]=d[2];});
    DYN[0].push(cur[0]); DYN[1].push(cur[1]); }})();
/* dim. / più p / cresc. のような語も、なだらかな増減として反映させる */
const DYNADJ=new Float64Array(MCOUNT).fill(1);
(function(){
  for(let i=0;i<MCOUNT;i++){
    const t=(MS[i].mk||'').toLowerCase();
    if(t.includes('dim.')){ for(let k=0;k<3&&i+k<MCOUNT;k++) DYNADJ[i+k]*=(1-0.09*(k+1)); }
    if(t.includes('cresc.')||t.includes('augmentez')||t.includes('grandissante')){
      for(let k=0;k<3&&i+k<MCOUNT;k++) DYNADJ[i+k]*=(1+0.09*(k+1)); }
    if(t.includes('marqué')) DYNADJ[i]*=1.08;
  }
})();

/* ---- 旋律を浮かせる：同時に鳴る音のいちばん上を主役にする ---- */
const EMPH=new Float64Array(NOTES.length).fill(1);
(function(){
  let i=0;
  while(i<NOTES.length){
    let j=i; while(j<NOTES.length&&Math.abs(NOTES[j].abs-NOTES[i].abs)<1e-6) j++;
    let top=-1,bot=200;
    for(let k=i;k<j;k++){ if(NOTES[k].midi>top) top=NOTES[k].midi; if(NOTES[k].midi<bot) bot=NOTES[k].midi; }
    for(let k=i;k<j;k++){
      const n=NOTES[k];
      EMPH[k] = (n.midi===top) ? 1.18 : (n.midi===bot ? 0.95 : 0.78);
    }
    i=j;
  }
})();
function gainFor(n,idx){
  const base = ST.dyn ? DYN[n.h][n.m-1]*DYNADJ[n.m-1] : 0.4;
  return base * (ST.top ? EMPH[idx] : 1);
}

/* ---- scheduling（先の0.5秒ぶんだけ予約する） ---- */
let playing=false,anchorT=0,anchorP=0,baseSec=0,noteIdx=0,metro=[],metroIdx=0,schedId=null,raf=null;
let horizon=0;   /* ここまでは既に音を予約済み、という時刻 */
const rangeA=()=>MS[ST.rgA-1].start, rangeB=()=>MS[ST.rgB-1].start+MS[ST.rgB-1].L;
const LOOK=0.5;
function secOf(p){return anchorT+posToSec(p)-baseSec;}
function firstNoteAt(pos){
  let lo=0,hi=NOTES.length;
  while(lo<hi){const m=(lo+hi)>>1; if(NOTES[m].abs<pos-1e-6) lo=m+1; else hi=m;}
  return lo;
}
function buildMetro(){
  metro=[];
  if(!ST.onM||ST.volM<=0) return;
  const step=16/ST.div;
  for(let mi=ST.rgA-1;mi<ST.rgB;mi++)
    for(let k=0;k*step<MS[mi].L-1e-6;k++) metro.push([MS[mi].start+k*step,k===0]);
}
function seekTo(pos,flush){
  ensureAudio();
  if(flush) flushAudio();
  const a=rangeA(),b=rangeB();
  if(pos<a||pos>=b) pos=a;
  anchorP=pos; baseSec=posToSec(pos); anchorT=ctx.currentTime+0.12;
  noteIdx=firstNoteAt(pos);
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pos-1e-6) metroIdx++;
}
const ARP_STEP=0.030, ARP_SLOW=0.055;
function schedTick(){
  if(!playing||!ctx) return;
  const now=ctx.currentTime, until=now+LOOK, b=rangeB();
  horizon=until;
  let budget=48;
  while(noteIdx<NOTES.length&&budget>0){
    const idx=noteIdx, n=NOTES[noteIdx];
    if(n.abs>=b){ noteIdx=NOTES.length; break; }
    const t=n.g?secOf(n.abs)-0.085:secOf(n.abs);
    if(t>until) break;
    noteIdx++;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const gv=gainFor(n,idx)*((n.h===0?ST.volR:ST.volL)/100)*(n.g?0.6:1);
    if(gv<=0) continue;
    const dur=n.g?0.09:posToSec(Math.min(b,n.abs+n.q))-posToSec(n.abs);
    const roll = n.arp ? n.ao*ARP_STEP : 0;
    voice(Math.max(now,t+roll),n.midi,Math.max(0.08,dur-roll),gv,n.h===0?ST.tbR:ST.tbL);
    budget--;
  }
  if(metro.length) ensureMet();
  while(metroIdx<metro.length){
    const t=secOf(metro[metroIdx][0]);
    if(t>until) break;
    click(Math.max(now,t),metro[metroIdx][1],ST.volM/100*0.5);
    metroIdx++;
  }
  if(now>=secOf(b)-0.02){
    if(ST.loop) seekTo(rangeA());
    else { stopAll(); anchorP=rangeA(); draw(); label(); }
  }
}
function curPos(){
  if(!playing||!ctx) return anchorP;
  return Math.min(rangeB(),Math.max(rangeA(),secToPos(baseSec+(ctx.currentTime-anchorT))));
}
function stopAll(){
  if(schedId){clearInterval(schedId);schedId=null;}
  playing=false;
  if(ctx){bus.disconnect();bus=ctx.createGain();bus.gain.value=0.20;bus.connect(comp);
    if(metBus){metBus.disconnect();metBus=null;}}
  if(raf){cancelAnimationFrame(raf);raf=null;}
}
function start(){
  ensureAudio(); buildMap();
  let p=anchorP; if(p>=rangeB()-1e-6||p<rangeA()) p=rangeA();
  playing=true; seekTo(p); schedTick();
  schedId=setInterval(schedTick,60);
  tick(); label();
}
function pause(){const p=curPos();stopAll();anchorP=p;draw();label();}
function reset(){stopAll();anchorP=rangeA();draw();label();}
/* ---- 設定変更の扱い ----------------------------------------------
   以前は音量でもテンポでも reflow() → seekTo() を呼んでいたため、
   先読み（0.5秒）で既に予約済みの音を、もう一度予約し直していた。
   その結果、変更した瞬間だけ同じ箇所が二重に鳴っていた。
   予約をやり直すのは「本当に位置が飛ぶとき」だけにする。            */
function flushAudio(){          /* 予約済みの音を破棄する（位置が飛ぶときだけ） */
  if(ctx){bus.disconnect();bus=ctx.createGain();bus.gain.value=0.20;bus.connect(comp);
    if(metBus){metBus.disconnect();metBus=null;}}
}
function retime(){              /* テンポなど時間軸が変わる変更：継ぎ目なく差し替える */
  if(!playing||!ctx){ buildMap(); draw(); return; }
  const now=ctx.currentTime;
  const pNow=curPos();                                   /* 旧マップでの現在地 */
  const pEdge=Math.min(rangeB(),                         /* 旧マップでの予約済みの先端 */
    secToPos(baseSec+Math.max(0,horizon-anchorT)));
  buildMap();
  anchorT=now; baseSec=posToSec(pNow);                   /* 表示も音も現在地でつなぐ */
  noteIdx=Math.max(noteIdx,firstNoteAt(pEdge+1e-6));     /* 予約済みは飛ばす＝二重に鳴らさない */
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;
}
function remetro(){             /* メトロノームの刻みが変わる変更 */
  if(!playing||!ctx){ buildMetro(); metroIdx=0; return; }
  const pEdge=secToPos(baseSec+Math.max(0,horizon-anchorT));
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;
}
function redraw(){ save(); if(!playing) draw(); }   /* 音量・音色など、予約し直す必要のない変更 */
function reflow(){ retime(); }
let lastFrame=0;
function tick(){
  raf=requestAnimationFrame(ts=>{
    if(ts-lastFrame>30){lastFrame=ts;draw();}
    if(playing) tick();
  });
}

const cv=document.getElementById('roll'),cx2d=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(1.5,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;cx2d.setTransform(DPR,0,0,DPR,0,0);
}
const PXP=6;
function draw(){
  if(!W) resize();
  const pos=curPos(), view=W/PXP, left=pos-view*0.35;
  const g=cx2d;
  g.clearRect(0,0,W,H);
  g.fillStyle=CO.bg;g.fillRect(0,0,W,H);
  drawSectionBands(g,left);
  const yOf=m=>H-((m-LOMIDI)/(HIMIDI-LOMIDI))*H;
  g.fillStyle=CO.grid;
  for(let m=LOMIDI;m<=HIMIDI;m++) if(m%12===0){ const y=yOf(m); g.fillRect(0,y-1,W,2); }  /* Cの段 */
  g.strokeStyle=CO.bar;g.lineWidth=1;g.font='10px ui-monospace,Menlo,monospace';
  for(let i=0;i<MCOUNT;i++){
    const x=(MS[i].start-left)*PXP;
    if(x<-40||x>W+40) continue;
    g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();
    if(MS[i].n===1||MS[i].n%5===0){g.fillStyle=CO.num;g.fillText(MS[i].n,x+3,11);}
  }
  const vEnd=left+view;
  for(let i=firstNoteAt(left-48);i<NOTES.length;i++){
    const n=NOTES[i];
    if(n.abs>vEnd) break;
    if(n.abs+n.q<left) continue;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const x=(n.abs-left)*PXP, w=Math.max(3,(n.g?0.5:n.q)*PXP-1.5);
    const y=yOf(n.midi), h=Math.max(3,H/(HIMIDI-LOMIDI)-1);
    const on = pos>=n.abs && pos<n.abs+n.q;
    g.fillStyle = n.h===0 ? (on?CO.rhOn:CO.rh) : (on?CO.lhOn:CO.lh);
    g.globalAlpha = n.g?0.6:1;
    g.fillRect(x,y-h/2,w,h);
    g.globalAlpha=1;
  }
  const px=(pos-left)*PXP;
  g.strokeStyle=CO.head;g.lineWidth=1.5;
  g.beginPath();g.moveTo(px,0);g.lineTo(px,H);g.stroke();
  readout(pos);
}
