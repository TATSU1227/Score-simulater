 ["02","音量は6段階に配分して数字で決める。感覚で増やすと必ず m.22 あたりで天井に当たります。目標は mf であって f ではありません。"],
 ["03","animé（生き生きと）はテンポを上げる指示ですが、上げるのは1小節あたり数％。走ると m.25 の到達点が事故になります。"],
 ["04","ペダルは低音が変わるたびに踏み替える。ここを濁らせると、階段が坂道になってしまいます。"]]},

{from:25,to:26,fam:"moon",tag:"dim. molto",
 title:"最初の頂点 — そして2小節で引き上げる",
 ital:"mf, dim. molto",
 body:["6小節かけて上ってきた先が <b>mf</b>。曲の前半で最も強い場所ですが、それでも mf です。右手は高音域の <span class=\"chord\">A♭5–D♭6–A♭6</span> をアルペジオで置き、両手が広い和音で鳴ります。",
 "そして到達した瞬間に dim. molto。2小節で音量も速度も引き上げられ、テンポは楽譜のデータ上で ♩=70 から 18 付近まで落ちます。ほとんど時間が止まる。",
 "頂点に「留まらない」のがこの曲の一貫した態度です。強くなった状態を保存しないので、聴き手には常に「いま消えつつあるもの」として届きます。"],
 notes:[["奏法","この2小節の和音はアルペジオ記号つき。同時に打鍵せず、下から転がして上の音が最後に残るようにします。"],
 ["構造","ここで第1部が終わります。次の Un poco mosso は速度も書法も別物なので、この2小節は幕として機能します。"]],
 tech:[["01","アルペジオは「速く転がす」のではなく、最上音が拍に来るように逆算して始める。上の音が遅れると和音が崩れて聴こえます。"],
 ["02","dim. は指を弱くするのではなく、打鍵の速度を落とす。鍵盤の底までは押し切ったまま速度だけ落とすと、pp でも芯が残ります。"],
 ["03","最後のリタルダンドで完全に止まる時間を作る。ここの無音の長さが、次の場面の速さを決めます。"]]},

{from:27,to:30,fam:"flow",tag:"Un poco mosso",
 title:"分散和音が流れ出す — この曲の代名詞",
 ital:"Un poco mosso, pp",
 body:["左手が2オクターヴ以上を1拍で駆け上がる形に変わります。<span class=\"chord\">D♭2 → A♭2 → D♭3 → F3 → A♭3 → D♭4</span>。各拍の頭の低音だけが付点4分で保たれ、その上を5つの音が上がっていく。",
 "右手は F4–A♭4 の単純な2音。<mark>いちばん有名な部分の旋律が、いちばん少ない音でできている</mark>のがこの曲の設計です。動いているのは伴奏で、旋律はほとんど動きません。",
 "速度もここで倍近くになります（♩=48 → 96）。ただし pp のまま。速いのに静か、という状態が10小節続きます。"],
 notes:[["和声","D♭ → F小調的な色 → A♭ を含む響きへ、1小節の中で低音が3回変わります。分散和音は和音の分解ではなく、和声が動いていることを示す装置です。"],
 ["書法","低音の付点4分が「支え」、上の5音が「揺れ」。この2層は同じ左手が同時に担当します。ペダルは1拍ごとに踏み替えるのが基本です。"]],
 tech:[["01","左手は指で弾かず、前腕の回旋で運ぶ。最低音を置いたら手のひらを外側へ回していくと、5音が均等に並びます。例として 5-4-2-1-3-1 のような配分（手の大きさで変わります）。"],
 ["02","最初は最低音と最高音の2音だけを弾いて、手の移動距離を体に入れる。あいだの3音は後から埋めるほうが速く仕上がります。"],
 ["03","右手の2音は、上の音だけを保って下は先に離す。両方保つと和音になってしまい、旋律線が消えます。"],
 ["04","メトロノームを付点4分（♩.）に設定して、拍の頭の低音だけを合わせる練習が有効です。5音を均等に「詰める」意識だと必ず走ります。"]]},

{from:31,to:36,fam:"flow",tag:"Sequence",
 title:"同じ形のまま、和音だけがずれていく",
 ital:"p → cresc.",
 body:["左手の形は変わらないまま、和音が次々に移ります。A♭ の上の9の和音、G♭、F、E♭ 系、そして m.34 では <span class=\"chord\">A♭–C–E</span> という増三和音的な響きが挟まる。",
 "m.35 の cresc. から、和声はさらに遠くへ。m.36 の後半で <span class=\"chord\">G♯–B–E</span> が現れ、記譜が♭から♯へ切り替わります。ここが中間部への入口です。",
 "旋律は依然として少ない音数のまま。動いているのは和声だけで、それが6小節ぶんの高揚を作っています。"],
 notes:[["和声","増三和音（m.34）は上下どちらへも進める和音で、調の重心を消すのに使われます。ここから調性の足場が緩みはじめます。"],
 ["記譜","D♭（♭5つ）から C♯ / E（♯系）への切り替えは、鳴る音はほぼ同じで綴りだけが変わる書き換え。演奏者には別の景色として渡されます。"]],
 tech:[["01","和音が変わる小節の頭だけを抜き出して和声進行として弾く。分散にする前に縦で覚えると、指が迷わなくなります。"],
 ["02","cresc. は m.35 から m.40 までの6小節ぶん。ここで使い切らないこと。到達点は次の場面の f です。"],
 ["03","♯に切り替わる箇所は読み替えで事故が起きやすい場所。指使いを先に固定し、譜面を見ずに手の形で覚えてしまうのが確実です。"]]},

{from:37,to:40,fam:"climax",tag:"En animant",
 title:"C♯ の世界 — 同じ鍵盤、別の綴り",
 ital:"En animant, più cresc.",
 body:["記譜が完全に♯系になります。左手は <span class=\"chord\">B–C♯–E–G♯–B–C♯</span> を駆け上がり、右手は高音域で旋律を刻む。曲中で最も音域が広がる場所で、m.39 では <span class=\"chord\">C♯7</span>（全曲の最高音）に届きます。",
 "「En animant」は生き生きと＝速度を上げて。楽譜のデータ上のテンポもここで最速（♩=102）になります。",
 "面白いのは、これが新しい主題ではないことです。左手の分散和音は m.27 と同じ仕組み、右手は少ない音での旋律。<mark>同じ装置を、調と音域と速度だけ変えて回している</mark>だけで、ここまで別の音楽に聞こえます。"],
 notes:[["和声","C♯ 短調／E 長調の領域。D♭ 長調の主音を異名同音で読み替えた先で、原調から最も遠く感じられるように配置されています。"],
 ["音域","この4小節で両手の距離が最大に。低音 B3 付近から C♯7 まで、鍵盤の広い範囲が同時に鳴ります。"]],
 tech:[["01","右手の高音は打鍵を速く・浅く。深く押すと音が割れて、この場面の透明さが失われます。"],
 ["02","左手の分散和音は m.27 と同じ運動なので、まず m.27 の形で弾いてから移す。新しい音型として練習しないほうが速い。"],
 ["03","animant はテンポを上げる指示ですが、上げるのは左手ではなく音楽全体。左手だけ速くなると伴奏が旋律を追い越します。"],
 ["04","ここでペダルを長く残しすぎると♯の和声が濁ります。低音が変わる拍ごとに必ず踏み替える。"]]},

{from:41,to:42,fam:"climax",tag:"f",
 title:"たった一度の f、そして即座の dim.",
 ital:"f → dim.",
 body:["全曲で唯一の <b>f</b> です。左手は <span class=\"chord\">F♯3</span> を1小節保持したまま F♯ 系の分散和音を上下させ、右手は和音で下降する。密度も音域も最大。",
 "しかし次の m.42 にはもう dim. が書かれ、同じ下降が音域を下げてくり返されます。頂点は1小節で、取り消しに1小節。",
 "第1部の頂点（m.25）が mf、ここが f。それが上限です。<mark>この曲には ff が一度も書かれていません</mark>。頂点とは大きくなることではなく、そこから戻ることだという構造になっています。"],
 notes:[["構造","m.41 と m.42 は同じ音型で音域が1オクターヴ違うだけ。強さではなく距離で減衰を作る、この曲の遠近法です。"],
 ["和声","F♯ 短調系の響きから、m.42 の終わりで D♭ の領域へ戻る準備が始まります。calmato の前で調が帰ってきます。"]],
 tech:[["01","f は腕の重さで出す。指先で強く叩くと音が硬くなり、この曲の音色から外れます。打鍵後は即脱力。"],
 ["02","m.41 と m.42 は「同じフレーズの遠近」。同じ表情で、距離だけ変えて弾く。別のことをしようとしないほうが効きます。"],
 ["03","dim. の到達点は次の小節の pp。2小節で mf 以上ぶんを捨てる必要があるので、m.42 の頭ですでにかなり落としておきます。"]]},

{from:43,to:48,fam:"far",tag:"calmato",
 title:"A♭–E♭ の保続の上で、波だけが立つ",
 ital:"calmato, pp",
 body:["左手が <span class=\"chord\">A♭2–E♭3</span> の往復に固定されます。A♭ は D♭ 長調の属音。つまりここから6小節、和声はずっと「帰る直前」の状態で保留されます。",
 "その上で右手が細かい分散和音を上下させる。旋律らしい旋律はありません。動いているのに何も進んでいない、という時間です。",
 "calmato＝落ち着いて。頂点の直後にこれだけの静止を置くことで、次に来る主題の再現が「戻ってきた」ではなく「また現れた」ように聴こえます。"],
 notes:[["和声","属音保続（ドミナント・ペダル）。緊張を保ったまま解決を先延ばしにする古典的な手法を、ここでは静けさを作るために使っています。"],
 ["書法","左手の往復は伴奏というより持続音の代用。ペダルで濁らせずに、しかし途切れさせずに鳴らし続ける必要があります。"]],
 tech:[["01","左手の2音は手首の小さな回旋だけで。指で交互に叩くと6小節持ちません。ここは体力の配分の問題です。"],
 ["02","右手の波は、上端と下端の音だけをわずかに支えて中間は流す。全部の音を均等に鳴らすと機械的になります。"],
 ["03","pp を6小節保つのは想像以上に難しい。1小節ごとに音量を確認する耳を残しておくこと。"],
 ["04","ペダルは1拍ごと。属和音のまま濁らないので長く踏みたくなりますが、踏みっぱなしにすると右手の波が団子になります。"]]},

{from:49,to:50,fam:"far",tag:"Bridge",
 title:"波が上がりきる — 再現への2小節",
 ital:"（記号なし・pp のまま）",
 body:["左手の分散和音が一気に高音域まで駆け上がり、C6 付近に届きます。右手には E♭6 / D♭6 の長い音だけ。両手の役割が一時的に入れ替わったような書き方です。",
 "この2小節は完全な橋で、和声も保続のまま。音域が上がりきったところで、次の小節から主題が戻ってきます。",
 "上がりきった位置に主題を置くために、わざわざ左手を鍵盤の右端まで運んでいる。再現の準備を、音量ではなく<b>位置</b>でやっています。"],
 notes:[["構造","第3部（再現）の直前に置かれた2小節。ここを速く通り過ぎると再現が唐突になります。"],
 ["音域","左手がト音記号側へ完全に越境します。楽譜でも上段に書かれる部分で、手の交差の準備が要ります。"]],
 tech:[["01","左手が上がりきる位置を先に決めて、そこから逆算して弾き始める。上りながら考えると必ず届きません。"],
 ["02","右手の長い音は、左手が通過するあいだ鳴り続ける。押さえ替えずに保つ指を決めておくこと。"],
 ["03","ここで rit. を大きくかけたくなりますが、楽譜には書かれていません。テンポはほぼ保ったまま、次の ppp で景色を変えるほうが効果的です。"]]},

{from:51,to:58,fam:"moon",tag:"a Tempo I",
 title:"主題の回帰 — ppp、1オクターヴ上で",
 ital:"a Tempo I, ppp",
 body:["主題が戻ります。ただし<b>冒頭より1オクターヴ高く</b>、しかも <b>ppp</b>。曲を通して最も弱い指定がここです。左手は分散和音を弾き続けているので、旋律と伴奏の関係も冒頭とは違います。",
 "冒頭では旋律が休符のあとから入りましたが、ここでも右手は第2拍から入る。8小節ぶん先に進んだ位置で、同じ入り方をくり返します。",
 "同じ音楽が、高く・弱く・下に流れを持って戻ってくる。<mark>「もう一度」ではなく「遠くから」</mark>という再現の仕方です。"],
 notes:[["構造","m.51〜58 は m.1〜8 に対応。旋律の輪郭はほぼ同じで、伴奏だけが中間部の分散和音を引き継いでいます。"],
 ["強弱","ppp はここと最終小節だけ。曲の一番静かな場所に主題を置いています。"]],
 tech:[["01","ppp で旋律を「聴こえる」状態にするには、伴奏をさらに落とすしかない。左手を先に完成させてから右手を足すこと。"],
 ["02","右手の高音は指を鍵盤から離さずに押す。ここで打鍵音が出ると、遠くから聞こえる設定が壊れます。"],
 ["03","左手の分散和音は m.27 と同じ形。ただし旋律の下で鳴るので、音量は m.27 の半分以下に設計します。"],
 ["04","弱音ペダルを使うなら、冒頭と同じ場所で踏むと一貫します（冒頭の con sordina との対応）。"]]},

{from:59,to:65,fam:"moon",tag:"Theme A″",
 title:"第2句の回帰と、終止への傾き",
 ital:"pp",
 body:["m.59 で低音 <span class=\"chord\">D♭2–A♭2</span> が戻ります。これは m.9 とまったく同じ配置で、第1部の第2句がそのまま再現されているのがわかります。",
 "ただし今度は続きが違う。m.63 以降、左手は F2 → E♭2 → A♭2 と単音で降り、和声は終止へ向かいます。旋律も上がりきらずに落ち着いていく。",
 "第1部ではこのあと Tempo rubato の場面へ進みましたが、ここでは進みません。同じ道を歩いて、途中で曲がる形です。"],
 notes:[["構造","m.59＝m.9 の再現。ここまで対応が正確なぶん、m.63 からの逸脱が「終わりが近い」という合図になります。"],
 ["和声","A♭（属和音）へ向かって整理されていき、次の場面で主和音の上の分散和音に解決します。"]],
 tech:[["01","m.9 と同じ弾き方で始めて、m.63 で意識的に変える。同じに弾いてきたからこそ、変化が伝わります。"],
 ["02","終止へ向かう左手の単音は、音量を落としながらも長さは保つ。短く切ると終わりが急に見えてしまいます。"],
 ["03","この7小節は速度を上げないこと。楽譜にも指示はなく、ここで動くと最後の morendo が効かなくなります。"]]},

{from:66,to:70,fam:"far",tag:"morendo",
 title:"中間部の伴奏だけが戻り、消えていく",
 ital:"morendo jusqu'à la fin",
 body:["m.66 の左手は、m.27 の分散和音と<b>まったく同じ形</b>です。しかも右手には何もありません。中間部の伴奏だけが、旋律を失った状態で戻ってきます。",
 "指示は「最後まで消えていくように」。テンポは楽譜のデータ上で ♩=96 から 42 まで、6小節かけて連続的に落ちていきます。減速そのものが書かれている場所です。",
 "m.69〜70 では右手に <span class=\"chord\">A♭5–C♭6–D♭6–F♭6</span> という♭の多い響きが乗り、光が青くなるような色の変化が起きます。"],
 notes:[["構造","伴奏だけが残るという終わり方は、この曲が「旋律の曲」ではなく「状態の曲」だったことを最後に示します。"],
 ["和声","C♭ / F♭ を含む響きは D♭ 長調から見た借用。終止直前にわずかに影を差し込んでから、主和音へ落ちます。"]],
 tech:[["01","morendo は音量とテンポを同時に落とす。片方だけだと「弱いだけ」「遅いだけ」になります。両方を1小節ごとに一段ずつ。"],
 ["02","右手がない小節（m.66・m.68）は左手だけで音楽を保つ。ここで急ぐと曲が終わりに向かっていることが伝わりません。"],
 ["03","最後の数小節は指の動きより離鍵の速度を管理する。ゆっくり離すほど音は柔らかく消えます。"]]},

{from:71,to:72,fam:"far",tag:"Final D♭",
 title:"最後の D♭ — 下から上へ、そして静止",
 ital:"ppp",
 body:["m.71 は左手が <span class=\"chord\">D♭2</span> から <span class=\"chord\">D♭6</span> まで、鍵盤のほぼ全域を分散和音で上がっていきます。右手は F6–A♭6 を1小節保持したまま。曲の最初に鳴った3度と同じ音程です。",
 "そして m.72、D♭ の和音をアルペジオで置いて終わります。<b>ppp</b>。冒頭と同じ音程、同じ弱さで、ただし今度は下から支えられた状態で。",
 "解決はしていますが、決着という感じはしません。光の量が減っていって、あるところで見えなくなっただけ、という終わり方です。"],
 notes:[["構造","冒頭の3度（F–A♭）が最後にもう一度、最も高い位置で鳴ります。曲全体が1つの音程の変奏だったことになります。"],
 ["奏法","最終和音はアルペジオ記号つき。同時に打鍵せず、下から順に置いて上の音を最後に残します。"]],
 tech:[["01","m.71 の上行は「速く上がる」のではなく、上がるほど遅くしてよい場所。到達点の D♭6 が最も静かになるように設計します。"],
 ["02","最終和音は転がしきってから、ペダルだけで支える。手を早く離しても響きは残ります。"],
 ["03","音が完全に消えるまで手を鍵盤の上に置いておく。演奏動作は音が消えるまで続いています。"],
 ["04","終わったあとの静止も含めて曲。ここまで pp と ppp で作ってきた世界は、最後の無音で完成します。"]]}
];
/* ==========================================================
   リアルタイム解説
   ========================================================== */
var GREADY=false;
const FAMLINE={moon:'#8fb8e8',flow:'#79c2b6',climax:'#dc8f74',far:'#cfd6e8'};
const SECOF=new Int16Array(MCOUNT+2);
SEC.forEach((s,i)=>{for(let m=s.from;m<=s.to;m++) SECOF[m]=i;});

/* 楽譜に印刷された強弱（小節番号→記号） */
const DYNMARK=[[1,'pp'],[13,'p'],[15,'pp'],[25,'mf'],[27,'pp'],[31,'p'],[41,'f'],
               [43,'pp'],[51,'ppp'],[59,'pp'],[72,'ppp']];
const DYNL=[];
(function(){let c='',k=0;
  for(let i=0;i<MCOUNT;i++){ while(k<DYNMARK.length&&DYNMARK[k][0]===MS[i].n){c=DYNMARK[k][1];k++;} DYNL.push(c); }})();

/* 標語の日本語 */
const GLOSS=[
  [/andante/i,'歩く速さで'],
  [/tr[èe]s expressif/i,'とても表情ゆたかに'],
  [/con sordina/i,'弱音ペダル（una corda）で'],
  [/tempo rubato/i,'テンポを自由に'],
  [/peu à peu.*anim/i,'少しずつ強く、そして生き生きと'],
  [/dim\. molto/i,'うんと弱くしていく'],
  [/un poco mosso/i,'少し動きをつけて'],
  [/en animant/i,'生き生きと（速度を上げて）'],
  [/pi[ùu] cresc/i,'さらに強く'],
  [/calmato/i,'落ち着いて'],
  [/a tempo i/i,'最初のテンポで'],
  [/morendo/i,'消えていくように、最後まで'],
  [/m\.g\./i,'m.g.＝左手で'],
  [/dim\./i,'だんだん弱く'],
  [/cresc/i,'だんだん強く']
];
const DYNGL={ppp:'きわめて弱く',pp:'とても弱く',p:'弱く',mp:'やや弱く',mf:'やや強く',f:'強く',ff:'とても強く'};
function glossOf(t){
  if(!t) return '';
  const out=[];
  for(const [re,jp] of GLOSS) if(re.test(t)&&out.indexOf(jp)<0) out.push(jp);
  return out.join(' ／ ');
}
function cleanMk(t){ return (t||'').replace(/\s+/g,' ').trim(); }

/* 標語・強弱のイベント表 */
const MK=[];
for(let i=0;i<MCOUNT;i++){
  const t=cleanMk(MS[i].mk), dy=(i===0||DYNL[i]!==DYNL[i-1])?[DYNL[i]]:[];
  if(t||dy.length) MK.push({i:i,n:MS[i].n,t:t,dy:dy});
}

/* 構造マップ */
const gbar=$('gbar');
gbar.innerHTML=SEC.map((s,i)=>
  '<button class="gseg" data-i="'+i+'" data-fam="'+s.fam+'" style="flex-grow:'+(s.to-s.from+1)+
  '" aria-label="m.'+s.from+'–'+s.to+' '+s.tag+'"></button>').join('')+
  '<i class="gnow" id="gnow"></i>';
const gsegs=[...gbar.querySelectorAll('.gseg')], gnow=$('gnow');
gsegs.forEach(b=>b.addEventListener('click',()=>{
  const i=+b.dataset.i;
  setFollow(1); jumpToMeasure(SEC[i].from);
}));
function mapRange(){
  gsegs.forEach((b,i)=>b.classList.toggle('out', SEC[i].to<ST.rgA||SEC[i].from>ST.rgB));
}
const _rangeUI=rangeUI;
rangeUI=function(){ _rangeUI(); mapRange(); };
function setMapOn(i){ gsegs.forEach((b,k)=>b.classList.toggle('on',k===i)); }
function setMapSel(i){ gsegs.forEach((b,k)=>b.classList.toggle('sel', !GS.follow && k===i)); }

/* 位置の移動 */
function jumpToMeasure(n){
  const p=MS[n-1].start;
  if(n<ST.rgA||n>ST.rgB){
    ST.rgA=Math.min(ST.rgA,n); ST.rgB=Math.max(ST.rgB,n); rangeUI(); save(); buildMap();
  }
  if(playing) seekTo(p,1); else { anchorP=p; }
  draw();
}
function practiceSection(i){
  const s=SEC[i];
  ST.rgA=s.from; ST.rgB=s.to; rangeUI(); save(); buildMap();
  if(playing) seekTo(rangeA(),1); else anchorP=rangeA();
  draw();
}

/* 解説の描画 */
var GS={idx:-1,mi:-1,follow:1};
function renderGuide(i,anim){
  if(i==null||i<0||i>=SEC.length) i=0;
  const dir=(GS.idx<0||GS.idx===i)?0:(i>GS.idx?1:-1);   /* 進む＝1／戻る＝-1 */
  const s=SEC[i]; GS.idx=i;
  $('gfam').style.background=FAMLINE[s.fam];
  $('gtag').textContent=s.tag;
  $('gmm').textContent='m.'+s.from+'–'+s.to;
  $('gseglab').textContent=s.tag+' ／ m.'+s.from+'–'+s.to;
  const music='<div class="v-music">'+s.body.map(p=>'<p>'+p+'</p>').join('')+
    '<ul class="g-notes">'+s.notes.map(n=>'<li><b>'+n[0]+'</b>　'+n[1]+'</li>').join('')+'</ul></div>';
  const tech='<div class="v-tech"><ul class="g-notes">'+
    s.tech.map(n=>'<li><span class="g-step">'+n[0]+'</span>'+n[1]+'</li>').join('')+'</ul></div>';
  const b=$('gbody');
  b.innerHTML='<h3 class="g-ttl">'+s.title+'</h3><p class="g-ital">'+s.ital+'</p>'+music+tech;
  if(anim){
    const cls=dir>0?'g-in-next':(dir<0?'g-in-prev':'g-fade');
    b.classList.remove('g-fade','g-in-next','g-in-prev'); void b.offsetWidth; b.classList.add(cls);
  }
  setMapSel(i);
}
function updateLive(mi){
  let cur=null,nxt=null,txt=null;
  for(const e of MK){
    if(e.i<=mi){ cur=e; if(e.t) txt=e; }
    else { nxt=e; break; }
  }
  const t=cleanMk(txt?txt.t:'');
  $('gmk').innerHTML = t ? t+(txt.i<mi?'<em class="from">m.'+txt.n+'〜</em>':'') : '—';
  const d=DYNL[mi];
  $('ggl').textContent=[glossOf(txt?txt.t:''),DYNGL[d]||''].filter(Boolean).join('　/　');
  $('gdyn').innerHTML='<b>'+(d||'—')+'</b>';
  if(nxt){
    const dd=nxt.n-MS[mi].n, g=glossOf(nxt.t), lab=cleanMk(nxt.t)||nxt.dy.join(' ');
    $('gnextmk').innerHTML='次の指示 → <b>'+(lab||'—')+'</b>'+(g?'（'+g+'）':'')+
      ' m.'+nxt.n+'・あと'+dd+'小節';
  } else $('gnextmk').textContent='';
  const si=SECOF[MS[mi].n];
  if(si+1<SEC.length){
    const ns=SEC[si+1];
    $('gnextsec').innerHTML='次の場面 → <b>'+ns.tag+'</b> m.'+ns.from+'・あと'+(ns.from-MS[mi].n)+'小節';
  } else $('gnextsec').textContent='';
  const live=$('glive');
  if(cur&&cur.i===mi){ live.classList.remove('flash'); void live.offsetWidth; live.classList.add('flash'); }
}
function guideUpdate(pos){
  if(!GREADY) return;
  const mi=measureAt(pos);
  gnow.style.left=(((mi+(pos-MS[mi].start)/MS[mi].L)/MCOUNT)*100)+'%';
  if(mi!==GS.mi){
    GS.mi=mi;
    const si=SECOF[MS[mi].n];
    updateLive(mi);
    setMapOn(si);
    if(GS.follow&&si!==GS.idx) renderGuide(si,true);
  }
  const s=SEC[GS.idx];
  if(s){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    $('gprog').style.width=Math.max(0,Math.min(1,(pos-a)/(b-a)))*100+'%';
  }
}

/* 場面の色をロールの背景に敷く */
function drawSectionBands(g,left){
  if(!GREADY) return;
  const right=left+W/PXP;
  g.font='9px ui-monospace,Menlo,monospace';
  for(const s of SEC){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    if(b<left||a>right) continue;
    const x0=(a-left)*PXP, x1=(b-left)*PXP;
    g.globalAlpha=s.fam==='far'?0.07:0.11; g.fillStyle=FAMLINE[s.fam];
    g.fillRect(x0,0,x1-x0,H);
    g.globalAlpha=0.85;
    g.strokeStyle=FAMLINE[s.fam]; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x0,0); g.lineTo(x0,H); g.stroke();
    g.fillStyle=FAMLINE[s.fam]; g.fillText(s.tag,x0+5,H-6);
    g.globalAlpha=1;
  }
}

/* 操作 */
function setFollow(v){
  GS.follow=v?1:0; ST.gfollow=GS.follow; save();
  $('gfollow').classList.toggle('on',!!GS.follow);
  $('ghint').textContent=GS.follow?'':'手動で表示中';
  if(GS.follow){ const si=SECOF[MS[Math.max(0,GS.mi)].n]; renderGuide(si,true); setMapSel(si); }
  else setMapSel(GS.idx);
}
$('gfollow').addEventListener('click',()=>setFollow(!GS.follow));
$('gprev').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.max(0,GS.idx-1),true); });
$('gnextbtn').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.min(SEC.length-1,GS.idx+1),true); });
$('gprac').addEventListener('click',()=>{ practiceSection(GS.idx); setFollow(1); });
const gview=$('gview');
[...gview.children].forEach(b=>{
  b.classList.toggle('on',b.dataset.v===ST.gview);
  b.addEventListener('click',()=>{
    ST.gview=b.dataset.v; save();
    [...gview.children].forEach(x=>x.classList.toggle('on',x===b));
    $('guide').className='guide view-'+ST.gview;
  });
});
$('guide').className='guide view-'+ST.gview;

/* 起動 */
GS.follow=ST.gfollow?1:0;
$('gfollow').classList.toggle('on',!!GS.follow);
$('ghint').textContent=GS.follow?'':'手動で表示中';
mapRange();
GREADY=true;
GS.mi=-1;
renderGuide(SECOF[MS[measureAt(anchorP)].n],false);
draw();

/* ---- 音の設定シートの開閉 ---- */
function openSheet(){ $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden','false');
  document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden'; }
function closeSheet(){ $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden','true');
  document.documentElement.style.overflow=''; document.body.style.overflow=''; resize(); draw(); }
$('openSet').addEventListener('click',openSheet);
$('closeSet').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('sheet').classList.contains('open')) closeSheet(); });

<\/script>

<script>
/* ---- 押した指に反応させる（iOSの :active は当てにならないので自前で） ---- */
(function(){
  var SEL='button,.sw', cur=null;
  function off(){ if(cur){ cur.classList.remove('tapdown'); cur=null; } }
  document.addEventListener('pointerdown',function(e){
    var t=(e.target&&e.target.closest)?e.target.closest(SEL):null;
    if(!t||t.disabled) return;
    off(); cur=t; t.classList.add('tapdown');
  },{passive:true});
  document.addEventListener('pointerup',off,{passive:true});
  document.addEventListener('pointercancel',off,{passive:true});
  document.addEventListener('pointermove',function(e){ if(cur&&e.buttons===0) off(); },{passive:true});
  window.addEventListener('blur',off);
})();
<\/script>

<script>
/* 親（曲の一覧）から「止めて」と言われたら、音を完全に落としてから消える */
window.addEventListener('message',function(e){
  if(!e||!e.data||e.data.cmd!=='halt') return;
  try{ if(typeof stopAll==='function') stopAll(); }catch(_){}
  try{ if(typeof ctx!=='undefined'&&ctx&&ctx.close) ctx.close(); }catch(_){}
});
<\/script>

<script type="text/plain" id="src-ballade"><!DOCTYPE html>

<style>
:root, html[data-theme="dark"]{

  --glow:#e4ece5; --rollbg:#faf8ef; --btnbg:#eae6d6; --btnbg2:#dcd7c6; --segbg:#efece0;

  --barbg:rgba(243,241,230,.95); --sunk:rgba(0,0,0,.045); --sunk2:rgba(0,0,0,.028);
  --body:#3f4844; --body2:#4d5852; --oncream:#fffdf5; --playfg:#2c2408; --markfg:#3a2214;
  --shadow:0 -8px 24px rgba(90,80,60,.18);
}
html{background:var(--night)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(120% 55% at 50% -10%, var(--glow) 0%, transparent 62%), var(--night);
  color:var(--cream);

}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:20px 0 10px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--flax);margin:0 0 9px}

#roll{width:100%;height:210px;display:block;border-radius:10px;background:var(--rollbg);margin-top:2px;touch-action:none}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}

.row .val{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13.5px;font-family:ui-monospace,Menlo,monospace}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8.5px;border-radius:50%;background:var(--cream)}
input[type=range]::-moz-range-track{height:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:var(--cream)}
select{background:var(--btnbg);border:1px solid var(--line);color:var(--cream);border-radius:9px;padding:8px 10px;font:inherit;font-size:13.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}

.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--cream);transition:transform .15s}

.sw.on::after{transform:translateX(21px)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.rh{background:var(--flax)} .dot.lh{background:var(--sage)}
.dial{margin-left:auto;display:flex;align-items:center;gap:4px}
.dial button{background:var(--btnbg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;min-width:34px;text-align:center}
.dial span{display:inline-block;min-width:46px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--flax);margin:0 0 8px;font-weight:600}
.tblwrap{max-height:420px;overflow:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--dim);font-weight:500;font-size:10.5px;letter-spacing:.06em;padding:6px 5px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 5px;border-bottom:1px solid rgba(40,65,59,.5);vertical-align:top;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5}
.tbl tr.cur td{background:var(--curbg)}
.tbl td.m{color:var(--flax);font-weight:700;width:32px}
.tbl td.rh{color:var(--rhtxt)}

/* ===== 自作アイコン ===== */
.ico{width:20px;height:20px;display:block;flex:0 0 auto}
.ico path,.ico line,.ico circle,.ico polygon,.ico rect{vector-effect:non-scaling-stroke}

.tbar{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--barbg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:9px 0 calc(9px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow)}
.tbar-in{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:9px}
.tbtn{display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--btnbg);border:1px solid var(--line);border-radius:11px;
  padding:10px 13px;font-size:14px;font-weight:600;min-height:44px}
.tbtn.play{background:var(--flax);color:var(--playfg);border-color:var(--flax);min-width:112px}

/* ===== 構造マップ（画面上部に固定） ===== */
.gmap{position:sticky;top:0;z-index:40;background:var(--barbg);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

  transition:background .2s,transform .2s,opacity .2s}

.gnow{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--flax);
  box-shadow:0 0 7px rgba(217,164,65,.9);pointer-events:none;border-radius:1px}

/* ===== 解説カード ===== */
.guide{padding:0;overflow:hidden;margin:12px -15px -15px;border-top:1px solid var(--line);
  border-radius:0 0 13px 13px;background:var(--sunk2)}

  text-transform:uppercase;color:var(--dim)}

  border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.g-live .dyn{font-family:Georgia,serif;font-style:italic;font-size:16px;color:var(--flax);
  flex:0 0 auto;min-width:30px}
.g-live .dyn b{font-weight:400}
.g-live .mkw{font-family:Georgia,"Times New Roman",serif;font-style:italic;

  <h1><em>Ballade</em><br>スラヴ風バラード／全曲</h1>
  <p class="sub">Andantino con moto (Tempo rubato) — Poco mosso — Animez peu à peu — Molto calmato — Ⅰ Tempo — ヘ長調（♭1つ）</p>
  <p class="lead">MusicXMLから起こした<b>全105小節・2794音</b>をそのまま鳴らします。楽譜に書き込まれた<b>♩=の推移（ルバート）</b>も時間軸に反映。再生に合わせて、いま鳴っている場面の解説・標語・強弱がロールのすぐ下で切り替わります。再生／先頭に／設定は画面下に<b>固定</b>されているので、読みながらでも止められます。</p>
</header>

<details class="keys">
  <summary>この曲を貫く4つの仕掛け</summary>
  <div class="keys-in">
    <h4>① 言い直す — 展開しない構造</h4>
    <p>1〜2小節と3〜4小節、50〜51と52〜53というように、この曲はほぼ同じ内容をもう一度置く形で進みます。動機を分解して発展させるドイツ的な方法ではなく、同じ話をもう一度語り直す民謡の話法です。<span class="chord">Ballade＝物語る</span>という題がそのまま構造になっています。</p>
    <h4>② 6連符 — 拍を溶かす伴奏</h4>
    <p>冒頭から左手は4拍子を6つに割った音型を刻みます。4と6は割り切れないため、拍の輪郭が最初からぼやけている。そこへ <span class="chord">Tempo rubato</span> が重なり、この曲には「正確な拍」がほとんど存在しません。楽譜には1拍ごとに ♩=50・54・58… と数字が書き込まれていて、その揺れをそのまま再生しています。</p>
    <h4>③ 遠いホ長調 — 一度だけ行って帰る</h4>
    <p>63小節で調号が♭1つから<span class="chord">♯4つ</span>へ移り、86小節でいったん調号が消え、88小節で♭1つに戻ります。全曲でこの1回だけの遠出。しかも帰りは音を鳴らし替えるのではなく、<span class="chord">綴りを書き替える</span>ことで戻ります。</p>
    <h4>④ f が最大 — ff のない曲</h4>
    <p>強弱の最大値は f で、しかも27・55・57・73小節の4か所だけ。あとは pp と p が支配的で、87小節に一度だけ ppp。全体が狭い音量幅のなかで設計されています。</p>
    <div class="pull">大きな声で語らないこと。<br>それでも最後まで聞かせること。</div>
    <p>1890年、ドビュッシー28歳。『夢』『ロマンティックなワルツ』『舞曲』などと同じ時期の作品で、初版（1891年）では <em>Ballade slave</em>＝スラヴ風バラードと題されていました。1903年の再版で「slave」が外され、単に <em>Ballade</em> になります。若い頃にフォン・メック夫人の家庭ピアニストとしてロシア音楽に触れた経験が、旋律の反復や旋法的な色に残っていると言われます。</p>
  </div>
</details>

/* ---- テンポ：楽譜に書き込まれた ♩= の推移をそのまま時間軸にする ---- */
const TP = S.t, TREF = 54;              /* ♩=54 のとき楽譜の数字どおりになる */
function scaleAtPos(pos){
  if(!ST.tmp) return 1;
  if(!TP.length) return 1;
  if(pos<=TP[0][0]) return TP[0][1]/TREF;
  let lo=0,hi=TP.length-1;
  while(lo<hi){const m=(lo+hi+1)>>1; if(TP[m][0]<=pos) lo=m; else hi=m-1;}
  return TP[lo][1]/TREF;
}
const HOLD = new Float64Array(MCOUNT);
HOLD[4]  = 1.5;                         /* m.5 のフェルマータ */
HOLD[44] = 1.0;                         /* m.45 morendo のあとの間 */
HOLD[86] = 1.5;                         /* m.87 ppp／très retenu の底 */

let TMAP=null; const STEP=1/6;
function buildMap(){
  const base=60/ST.bpm/4, n=Math.round(TOTAL/STEP)+1;
  TMAP=new Float64Array(n); let t=0;
  for(let i=1;i<n;i++){ t+=STEP*base/scaleAtPos((i-0.5)*STEP); TMAP[i]=t; }
  if(ST.tmp) for(let i=0;i<MCOUNT;i++) if(HOLD[i]>0){
    const idx=Math.min(n-1,Math.round((MS[i].start+MS[i].L)/STEP)), add=HOLD[i]*60/ST.bpm;
    for(let j=idx;j<n;j++) TMAP[j]+=add;
  }
}
function posToSec(p){const i=p/STEP,a=Math.floor(i);if(a>=TMAP.length-1)return TMAP[TMAP.length-1];return TMAP[a]+(TMAP[a+1]-TMAP[a])*(i-a);}
function secToPos(s){let lo=0,hi=TMAP.length-1;if(s<=0)return 0;if(s>=TMAP[hi])return TOTAL;
  while(hi-lo>1){const m=(lo+hi)>>1;if(TMAP[m]<=s)lo=m;else hi=m;}
  const d=TMAP[hi]-TMAP[lo];return (lo+(d?(s-TMAP[lo])/d:0))*STEP;}
function measureAt(pos){let lo=0,hi=MCOUNT-1;while(lo<hi){const m=(lo+hi+1)>>1;if(MS[m].start<=pos)lo=m;else hi=m-1;}return lo;}

let ctx=null,bus=null,comp=null;
function ensureAudio(){
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
    comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-14;comp.knee.value=22;comp.ratio.value=6;comp.attack.value=0.004;comp.release.value=0.22;
    bus=ctx.createGain();bus.gain.value=0.26;bus.connect(comp);comp.connect(ctx.destination);}
  if(ctx.state==='suspended')ctx.resume();
}
const TIMBRES={piano:'ピアノ風',harp:'ハープ風',glass:'グラスハーモニカ風',box:'オルゴール風',
               marimba:'マリンバ風',reed:'リード（オルガン）風',sine:'正弦波'};
const mtof=m=>440*Math.pow(2,(m-69)/12);
/* 低音の聞こえやすさ：小さなスピーカーは 100Hz 以下をほとんど鳴らせないので、
   倍音（2f・3f・4f・6f）を足して「基音がなくても音高が分かる」状態にする（missing fundamental）。
   あわせて低音側だけ音量も持ち上げる。 */
function lowBoost(midi){
  const s=(ST.lowb||0)/100; if(s<=0) return 0;
  const x=Math.min(1,Math.max(0,(54-midi)/30));
  return s*x*x;
}
function voice(t,midi,dur,gain,kind){
  const f=mtof(midi);
  const damp=ctx.createGain();damp.gain.value=1;damp.connect(bus);   /* 途中で切るのはこちらだけ */
  const g=ctx.createGain();g.connect(damp);
  const rel=kind==='sine'?0.12:0.35,end=t+Math.max(0.1,dur)+rel;
  const LB=lowBoost(midi);
  const G=Math.max(0.0002,gain*4.2*(1+0.75*LB));
  if(LB>0){
    const HARM=[[2,0.62],[3,0.40],[4,0.20],[6,0.09]];
    for(const [r,a] of HARM){
      if(f*r>7000) break;
      const o=ctx.createOscillator();o.type='sine';o.frequency.value=f*r;
      const gg=ctx.createGain();gg.gain.value=a*LB;o.connect(gg);gg.connect(g);
      o.start(t);o.stop(end+0.02);
    }
  }
  if(kind==='sine'||kind==='glass'){
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;
    if(kind==='glass'){
      const o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=f*3.01;
      const g2=ctx.createGain();g2.gain.value=0.13;o2.connect(g2);g2.connect(g);o2.start(t);o2.stop(end+0.02);
    }
    o.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(G,t+(kind==='glass'?0.09:0.02));
    g.gain.setValueAtTime(G,t+Math.max(0.09,dur));g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t);o.stop(end+0.02);return;}
  if(kind==='harp'){
    const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;
    const o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=f*2;
    const g2=ctx.createGain();g2.gain.value=0.18;o2.connect(g2);
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=0.8;
    lp.frequency.setValueAtTime(Math.min(9000,f*10),t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(300,f*2.4,LB>0?900:0),t+0.5);
    o.connect(lp);g2.connect(lp);lp.connect(g);
    const dec=Math.min(3.4,1.1+dur*0.6);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(G,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
    o.start(t);o.stop(t+dec+0.05);o2.start(t);o2.stop(t+dec+0.05);return;}
  if(kind==='marimba'||kind==='box'){
    const parts=kind==='marimba'?[[1,1],[4,0.28],[9.2,0.1]]:[[1,1],[2.0,0.3],[5.4,0.14],[8.1,0.06]];
    const dec=kind==='marimba'?0.5:1.7;
    parts.forEach(([r,a])=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f*r;
      const gg=ctx.createGain();gg.gain.value=a;o.connect(gg);gg.connect(g);o.start(t);o.stop(t+dec+0.1);});
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(G,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec);return;}
  if(kind==='reed'){
    const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=0.9;lp.frequency.value=Math.max(Math.min(4200,f*5.5),LB>0?1800:0);
    o.connect(lp);lp.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(G*0.7,t+0.06);
    g.gain.setValueAtTime(G*0.7,t+Math.max(0.12,dur));g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t);o.stop(end+0.02);return;}
  /* piano */
  const o1=ctx.createOscillator();o1.type='triangle';o1.frequency.value=f;
  const o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=f*2;
  const g2=ctx.createGain();g2.gain.value=0.22;o2.connect(g2);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';
  lp.frequency.setValueAtTime(Math.max(Math.min(8000,f*8+900),LB>0?2600:0),t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(300,f*2.2,LB>0?900:0),t+0.9);
  o1.connect(lp);g2.connect(lp);lp.connect(g);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(G,t+0.008);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,G*0.35),t+Math.min(1.4,0.3+dur*0.5));
  g.gain.exponentialRampToValueAtTime(0.0001,end);
  o1.start(t);o1.stop(end+0.02);o2.start(t);o2.stop(end+0.02);
}
function click(t,strong,gain){

const DYN=[[],[]];
(function(){let cur=[0.30,0.30];

    (MS[i].dy||[]).forEach(d=>{ if(d[0]===0){cur[0]=d[2];cur[1]=d[2];} else cur[1]=d[2]; });

/* dim. / più p / cresc. のような語も、なだらかな増減として反映させる */
const DYNADJ=new Float64Array(MCOUNT).fill(1);
(function(){
  for(let i=0;i<MCOUNT;i++){
    const t=(MS[i].mk||'').toLowerCase();
    if(t.includes('dim.')){ for(let k=0;k<3&&i+k<MCOUNT;k++) DYNADJ[i+k]*=(1-0.10*(k+1)); }
    if(t.includes('più dim')) DYNADJ[i]*=0.85;
    if(t.includes('cresc')){ for(let k=0;k<3&&i+k<MCOUNT;k++) DYNADJ[i+k]*=(1+0.09*(k+1)); }
    if(t.includes('morendo')||t.includes('mo _ ren _ do')){ for(let k=0;k<3&&i+k<MCOUNT;k++) DYNADJ[i+k]*=(1-0.18*(k+1)); }
  }
})();

/* ---- 旋律を浮かせる：同時に鳴る音のいちばん上を主役にする ---- */
const EMPH=new Float64Array(NOTES.length).fill(1);
(function(){
  let i=0;
  while(i<NOTES.length){
    let j=i; while(j<NOTES.length&&Math.abs(NOTES[j].abs-NOTES[i].abs)<1e-6) j++;
    let top=-1,bot=200;
    for(let k=i;k<j;k++){ if(NOTES[k].midi>top) top=NOTES[k].midi; if(NOTES[k].midi<bot) bot=NOTES[k].midi; }
    for(let k=i;k<j;k++){
      const n=NOTES[k];
      EMPH[k] = (n.midi===top) ? 1.18 : (n.midi===bot ? 0.95 : 0.78);
    }
    i=j;
  }
})();
/* 手ごとのバランス — 伴奏に回っている側を少し引く */
function handMul(m,h){
  if(h===1){
    if(m>=30&&m<=37) return 0.70;   // 細かい波形の伴奏
    if(m>=63&&m<=74) return 0.68;   // Molto calmato の分散和音
    if(m>=88&&m<=95) return 0.80;   // 再現部
    return 0.88;
  }
  if(m>=46&&m<=49) return 0.82;     // 低音域のつぶやき
  if(m>=38&&m<=44) return 0.90;     // 16分の流れ
  return 1;
}
function gainFor(n,idx){
  const base = ST.dyn ? DYN[n.h][n.m-1]*DYNADJ[n.m-1] : 0.4;
  return base * handMul(n.m,n.h) * (ST.top ? EMPH[idx] : 1);
}

/* ---- scheduling（先の0.5秒ぶんだけ予約する） ---- */
let playing=false,anchorT=0,anchorP=0,baseSec=0,noteIdx=0,metro=[],metroIdx=0,schedId=null,raf=null;
let horizon=0;   /* ここまでは既に音を予約済み、という時刻 */
const rangeA=()=>MS[ST.rgA-1].start, rangeB=()=>MS[ST.rgB-1].start+MS[ST.rgB-1].L;
const LOOK=0.5;
function secOf(p){return anchorT+posToSec(p)-baseSec;}
function firstNoteAt(pos){
  let lo=0,hi=NOTES.length;
  while(lo<hi){const m=(lo+hi)>>1; if(NOTES[m].abs<pos-1e-6) lo=m+1; else hi=m;}
  return lo;
}
function buildMetro(){
  metro=[];
  if(!ST.onM||ST.volM<=0) return;
  const step=16/ST.div;
  for(let mi=ST.rgA-1;mi<ST.rgB;mi++)
    for(let k=0;k*step<MS[mi].L-1e-6;k++) metro.push([MS[mi].start+k*step,k===0]);
}
function seekTo(pos,flush){
  ensureAudio();
  if(flush) flushAudio();
  const a=rangeA(),b=rangeB();
  if(pos<a||pos>=b) pos=a;
  anchorP=pos; baseSec=posToSec(pos); anchorT=ctx.currentTime+0.12;
  noteIdx=firstNoteAt(pos);
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pos-1e-6) metroIdx++;
}
const ARP_STEP=0.030, ARP_WIDE=0.045, ARP_SLOW=0.055;
function schedTick(){
  if(!playing||!ctx) return;
  const now=ctx.currentTime, until=now+LOOK, b=rangeB();
  horizon=until;
  let budget=48;
  while(noteIdx<NOTES.length&&budget>0){
    const idx=noteIdx, n=NOTES[noteIdx];
    if(n.abs>=b){ noteIdx=NOTES.length; break; }
    const t=n.g?secOf(n.abs)-0.085:secOf(n.abs);
    if(t>until) break;
    noteIdx++;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const gv=gainFor(n,idx)*((n.h===0?ST.volR:ST.volL)/100)*(n.g?0.6:1);
    if(gv<=0) continue;
    const dur=n.g?0.09:posToSec(Math.min(b,n.abs+n.q))-posToSec(n.abs);
    const step = (n.m>=102) ? ARP_SLOW : (n.m>=81&&n.m<=87) ? ARP_WIDE : ARP_STEP;
    const roll = n.arp ? n.ao*step : 0;
    voice(Math.max(now,t+roll),n.midi,Math.max(0.08,dur-roll),gv,n.h===0?ST.tbR:ST.tbL);
    budget--;
  }
  if(metro.length) ensureMet();
  while(metroIdx<metro.length){
    const t=secOf(metro[metroIdx][0]);
    if(t>until) break;
    click(Math.max(now,t),metro[metroIdx][1],ST.volM/100*0.5);
    metroIdx++;
  }
  if(now>=secOf(b)-0.02){
    if(ST.loop) seekTo(rangeA());
    else { stopAll(); anchorP=rangeA(); draw(); label(); }
  }
}
function curPos(){
  if(!playing||!ctx) return anchorP;
  return Math.min(rangeB(),Math.max(rangeA(),secToPos(baseSec+(ctx.currentTime-anchorT))));
}
function stopAll(){
  if(schedId){clearInterval(schedId);schedId=null;}
  playing=false;
  if(ctx){bus.disconnect();bus=ctx.createGain();bus.gain.value=0.26;bus.connect(comp);
    if(metBus){metBus.disconnect();metBus=null;}}
  if(raf){cancelAnimationFrame(raf);raf=null;}
}
function start(){
  ensureAudio(); buildMap();
  let p=anchorP; if(p>=rangeB()-1e-6||p<rangeA()) p=rangeA();
  playing=true; seekTo(p); schedTick();
  schedId=setInterval(schedTick,60);
  tick(); label();
}
function pause(){const p=curPos();stopAll();anchorP=p;draw();label();}
function reset(){stopAll();anchorP=rangeA();draw();label();}
/* ---- 設定変更の扱い ----------------------------------------------
   以前は音量でもテンポでも reflow() → seekTo() を呼んでいたため、
   先読み（0.5秒）で既に予約済みの音を、もう一度予約し直していた。
   その結果、変更した瞬間だけ同じ箇所が二重に鳴っていた。
   予約をやり直すのは「本当に位置が飛ぶとき」だけにする。            */
function flushAudio(){          /* 予約済みの音を破棄する（位置が飛ぶときだけ） */
  if(ctx){bus.disconnect();bus=ctx.createGain();bus.gain.value=0.26;bus.connect(comp);
    if(metBus){metBus.disconnect();metBus=null;}}
}
function retime(){              /* テンポなど時間軸が変わる変更：継ぎ目なく差し替える */
  if(!playing||!ctx){ buildMap(); draw(); return; }
  const now=ctx.currentTime;
  const pNow=curPos();                                   /* 旧マップでの現在地 */
  const pEdge=Math.min(rangeB(),                         /* 旧マップでの予約済みの先端 */
    secToPos(baseSec+Math.max(0,horizon-anchorT)));
  buildMap();
  anchorT=now; baseSec=posToSec(pNow);                   /* 表示も音も現在地でつなぐ */
  noteIdx=Math.max(noteIdx,firstNoteAt(pEdge+1e-6));     /* 予約済みは飛ばす＝二重に鳴らさない */
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;
}
function remetro(){             /* メトロノームの刻みが変わる変更 */
  if(!playing||!ctx){ buildMetro(); metroIdx=0; return; }
  const pEdge=secToPos(baseSec+Math.max(0,horizon-anchorT));
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;
}
function redraw(){ save(); if(!playing) draw(); }   /* 音量・音色など、予約し直す必要のない変更 */
function reflow(){ retime(); }
let lastFrame=0;
function tick(){
  raf=requestAnimationFrame(ts=>{
    if(ts-lastFrame>30){lastFrame=ts;draw();}
    if(playing) tick();
  });
}

const cv=document.getElementById('roll'),cx2d=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(1.5,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;cx2d.setTransform(DPR,0,0,DPR,0,0);
}
const PXP=13;
function draw(){
  if(!W) resize();
  const pos=curPos(), view=W/PXP, left=pos-view*0.35;
  const g=cx2d;
  g.clearRect(0,0,W,H);
  g.fillStyle=CO.bg;g.fillRect(0,0,W,H);
  drawSectionBands(g,left);
  const yOf=m=>H-((m-LOMIDI)/(HIMIDI-LOMIDI))*H;
  g.fillStyle=CO.grid;
  for(let m=LOMIDI;m<=HIMIDI;m++) if(m%12===5){ const y=yOf(m); g.fillRect(0,y-1,W,2); }  /* F の段 */
  g.strokeStyle=CO.bar;g.lineWidth=1;g.font='10px ui-monospace,Menlo,monospace';
  for(let i=0;i<MCOUNT;i++){
    const x=(MS[i].start-left)*PXP;
    if(x<-40||x>W+40) continue;
    g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();
    if(MS[i].n%2===1){g.fillStyle=CO.num;g.fillText(MS[i].n,x+3,11);}
  }
  const vEnd=left+view;
  for(let i=firstNoteAt(left-48);i<NOTES.length;i++){
    const n=NOTES[i];
    if(n.abs>vEnd) break;
    if(n.abs+n.q<left) continue;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const x=(n.abs-left)*PXP, w=Math.max(3,(n.g?0.5:n.q)*PXP-1.5);
    const y=yOf(n.midi), h=Math.max(3,H/(HIMIDI-LOMIDI)-1);
    const on = pos>=n.abs && pos<n.abs+n.q;
    g.fillStyle = n.h===0 ? (on?CO.rhOn:CO.rh) : (on?CO.lhOn:CO.lh);
    g.globalAlpha = n.g?0.6:1;
    g.fillRect(x,y-h/2,w,h);
    g.globalAlpha=1;
  }
  const px=(pos-left)*PXP;
  g.strokeStyle=CO.head;g.lineWidth=1.5;
  g.beginPath();g.moveTo(px,0);g.lineTo(px,H);g.stroke();
  readout(pos);
}

 ["強弱","この曲の最強は f で、ff は一度も出てきません。全体が pp〜mf の幅の中の物語です。"]],
 tech:[["01","cresc. は音を強くする前に、まずテンポをわずかに前へ。速度の増加が先、音量は後から付いてきます。"],
 ["02","15小節の dim. は「弱くする」ではなく「遠ざける」。音量を落としながら同時にペダルを少し深くすると距離が出ます。"],
 ["03","19小節の左手の下降は、指ではなく腕の重さで落とす。ここだけ音色が太くなってよい場所です。"],
 ["04","rit. の量は自分で決めず、まず楽譜どおりのテンポ推移（設定の「標語どおりのテンポ変化」）で聴いて、体に入れてから崩してください。"]]},

{from:20,to:29,fam:"song",tag:"Variation",
 title:"変奏 — 同じ歌に装飾がつく",
 ital:"a Tempo ／ p — cresc. — f (m.27) — poco rit. dim.",
 body:["主題が戻りますが、そのままではありません。半音の刺繍音（A♭・C♯・F♯ など）が旋律のまわりに増え、左手も細かく動きます。",
 "26〜27小節で右手が24〜25音まで密になり、27小節で f。ここが前半の頂点です。",
 "29小節に poco rit. と dim. が同時に書かれ、速度と音量を一緒に抜いて次の場面へ渡します。"],
 notes:[["変化","主題の骨格（音の高さの並び）はほぼ同じまま。増えているのは装飾と内声だけ、という控えめな変奏です。"],
 ["半音","変ロ長調寄りの借用音（A♭・E♭）が混じり、長調のなかに一瞬だけ翳りが差します。"]],
 tech:[["01","装飾音は旋律の一部です。骨格音だけを抜き出して弾き、その線が変わっていないことを耳で確かめてから装飾を戻すと、輪郭が消えません。"],
 ["02","26〜27小節は音が多いぶん重くなりがち。各拍の最高音だけを強めに、それ以外を一段落とすと密度が濁りに変わりません。"],
 ["03","f といっても全曲の最大値がこれです。腕を落とすより、指の支えを一段しっかりさせるだけで足ります。"],
 ["04","29小節は rit. と dim. を同時に。片方だけだと「終わりかけ」に聞こえず、次の場面が唐突になります。"]]},

{from:30,to:33,fam:"flow",tag:"Ripple",
 title:"伴奏が細かく波立つ",
 ital:"a Tempo ／ p — mp",
 body:["左手が1小節に20音以上の細かい音型を刻みはじめ、右手は上でわずか数音を保つだけになります。主役と脇役が入れ替わった状態。",
 "33小節で音の綴りが A♭・G♭ へ変わり、次の Poco mosso の暗い色への準備が始まります。"],
 notes:[["役割","伴奏が音数で主張し、旋律が音数で引く。音の数と重要さが逆転する書き方です。"],
 ["転調","♭が増えていくことで、明るいヘ長調から一段暗い場所へ移動します。"]],
 tech:[["01","左手は「速く弾く」のではなく「均す」。ひとつも粒立たせないことを目標に、指を鍵盤から離さずに。"],
 ["02","右手の保続音は、押さえっぱなしにせず各小節の頭でごく軽く押し直すと、音が死にません。"],
 ["03","左手の音量は右手より確実に下。設定で左手の音量を下げた状態で一度聴き、その比率を耳で覚えてください。"],
 ["04","33小節の綴りの変化（G♭）は、ここで色が変わる合図。ペダルを一度浅く抜いて空気を入れ替えます。"]]},

{from:34,to:37,fam:"flow",tag:"Poco mosso",
 title:"Poco mosso — 変ハ（C♭）の陰り",
 ital:"Poco mosso ／ p — mp",
 body:["C♭・E♭・A♭ という重い綴りが並び、この曲でもっとも暗い数小節になります。速度指示は「少し動きをつけて」ですが、色は逆に沈みます。",
 "37小節に rit. があり、♩=20 まで落ちる指示。ほとんど止まる寸前まで引き延ばされてから、次の a Tempo に投げ返されます。"],
 notes:[["綴り","B ではなく C♭ と書かれているのは、和声上の意味（下がる音）を保つため。演奏では下向きの重力を感じさせます。"],
 ["対比","前後が明るいぶん、この4小節の暗さが際立ちます。長さより配置で効かせる書き方です。"]],
 tech:[["01","暗い和音ほど、押しつけると濁ります。低音を短く、上を長く残すバランスで。"],
 ["02","37小節の rit. は最後の1拍で一気にではなく、小節の頭から少しずつ。数字どおりの推移で一度聴いてください。"],
 ["03","この4小節だけペダルを深めに、踏み替えを減らす。輪郭が溶けることがここでは目的です。"],
 ["04","左手が1小節24音まで増える小節があります。すべて弾こうとせず、各拍の1音目だけを支点にして残りは流します。"]]},

{from:38,to:45,fam:"far",tag:"Morendo",
 title:"16分の流れ、そして消える",
 ital:"a Tempo ／ pp — p — morendo (m.43)",
 body:["右手が1小節あたり30音前後の16分音符で流れ続けます。旋律というより、水面のような持続。",
 "43小節に「morendo（消えていくように）」。44小節で右手が C7 まで駆け上がったあと、45小節は音がほとんど残りません。前半がここで一度終わります。",
 "45小節に置かれているのは A と、その下の低音だけ。空白そのものが1小節ぶん書かれています。"],
 notes:[["書法","音数が最大になった直後に、音数が最小になる。増減の落差で「消える」を作っています。"],
 ["構造","全105小節のほぼ中間手前。前半（語り）と後半（高揚と中間部）の継ぎ目です。"]],
 tech:[["01","16分の連続は指を動かす練習ではなく、腕を横へ運ぶ練習。1小節を1回の移動で通せると音が均一になります。"],
 ["02","44小節の上昇は加速しないこと。morendo の途中の上昇なので、上がりながら弱くなるのが理想です。"],
 ["03","45小節は「待つ」小節。音がないぶん、体の動きも止めてしまうと死にます。腕は次へ向かって動かし続けてください。"],
 ["04","この場面だけを取り出して練習範囲に設定し（⚙ から m.38〜45）、繰り返して減衰の設計を作るのが効率的です。"]]},

{from:46,to:49,fam:"flow",tag:"Animez",
 title:"Animez peu à peu — いちばん低いところから",
 ital:"Animez peu à peu ／ pp",
 body:["「少しずつ生き生きと」。ただし始まりは pp で、しかも右手までヘ音記号の音域（F3〜D4）に降りています。両手が寄り集まった、暗くこもった響き。",
 "ここから62小節まで、ひとつづきの長い上昇が始まります。この曲でいちばん大きな設計です。"],
 notes:[["配置","高揚を最低音域・最弱音から始める。上がり幅を最大に取るための助走です。"],
 ["指示","peu à peu＝少しずつ。1小節ごとに段を上げるのではなく、17小節かけて連続的に。"]],
 tech:[["01","両手が近い音域にあるので、手同士がぶつかります。先に運指ではなく「手の重ね方」を決めてください。"],
 ["02","pp のまま animez。速くすると音量も上がってしまうので、意識的に音量を据え置きます。"],
 ["03","低音域は倍音が多く濁ります。ペダルは浅く、踏み替えを増やす。"],
 ["04","ここから62小節までを1本の線として、まず4分の1のテンポで通してください。どこで何段上がるかを先に体に入れます。"]]},

{from:50,to:53,fam:"flow",tag:"Build",
 title:"層が増えていく",
 ital:"p — mp",
 body:["音域が上下に開き、左手は最低音域（G1あたり）まで、右手は G5 まで。両端に引っ張られてテクスチュアが広がります。",
 "50〜51と52〜53はほぼ同じ内容の繰り返し。ここでも「言い直す」構造が使われ、繰り返すことで圧力が上がります。"],
 notes:[["音域","開いた両端のあいだが空洞になり、次の54小節で中間が埋まると一気に密度が出ます。"],
 ["反復","同じ2小節の反復で高まりを作るのは、ロシア国民楽派に近い手つきです。"]],
 tech:[["01","開いた音域は腕の移動距離が長い。目を鍵盤から離しても届くよう、跳躍先を先に決めておきます。"],
 ["02","2回目（52〜53）は1回目と同じ音量では停滞します。ごくわずかでよいので確実に上げてください。"],
 ["03","低音は伸ばす、上は動かす。ペダルは低音の変わり目に合わせます。"],
 ["04","cresc. の総量を先に決める。ここで使い切ると54〜57が鳴りません。"]]},

{from:54,to:58,fam:"flow",tag:"Climax",
 title:"頂点 — f はここと27小節だけ",
 ital:"f (m.55, m.57) ／ dim. (m.57)",
 body:["右手が A4〜A6 の高音域に上がり、55小節と57小節に f。この曲の最大音量です。全曲を通じて ff は一度も現れません。",
 "しかも55小節には f のすぐ後に p も書かれていて、頂点にとどまる時間はごく短い。57小節の dim. でもう下り始めます。",
 "58小節で音域が中央へ戻り、収束が始まります。"],
 notes:[["強弱","最大が f。したがって f は「限界」ではなく「この曲での最大」。他の曲の f と同じ音量では大きすぎます。"],
 ["時間","頂点は2小節ぶんしか維持されません。長く伸ばすと構造が崩れます。"]],
 tech:[["01","高音域の f は硬くなりやすい。指を伸ばし気味にして接触面を広げると、音量を保ったまま角が取れます。"],
 ["02","55小節の f→p は同じフレーズ内での落差。手を持ち上げずに打鍵速度だけで落としてください。"],
 ["03","ここまでの助走（46小節から）を通して弾いてから頂点に入る練習を。単体で練習すると必ず出し過ぎます。"],
 ["04","ペダルは頂点でこそ浅く。深く踏むと音量ではなく濁りが増えます。"]]},

{from:59,to:62,fam:"far",tag:"Bridge",
 title:"下降して、ホ長調へ渡る",
 ital:"cresc. (m.61) — dim. rit. (m.62)",
 body:["音域が下がりながら、61小節にもう一度 cresc.。しかし62小節で dim. と rit. が重なり、力が抜けていきます。",
 "62小節の終わりで♭1つのヘ長調から離れ、63小節では調号が<mark>♯4つ（ホ長調）</mark>に変わります。ヘ長調から見ればきわめて遠い場所です。"],
 notes:[["転調","F → E。半音下がるだけに見えて、調号は♭1から♯4へ5つぶん動きます。この曲でいちばん大きな移動。"],
 ["役割","橋渡しの4小節。ここを急ぐと、中間部が別の曲のように浮いてしまいます。"]],
 tech:[["01","62小節の rit. は次の Molto calmato の速度まで落とし切る。到達点を先に決めてから逆算します。"],
 ["02","dim. と rit. が同時にあるときは、まず rit. を先行させると自然に減衰します。"],
 ["03","調が変わる瞬間にペダルを完全に上げ、無音を一瞬つくると、次の世界が別物として立ち上がります。"],
 ["04","63小節の最初の和音を先に鳴らして耳に入れてから、62小節を弾いてください。行き先が見えていると rit. の量が決まります。"]]},

{from:63,to:70,fam:"calm",tag:"Molto calmato",
 title:"Molto calmato — 中間部の歌",
 ital:"Molto calmato ／ p — pp",
 body:["ホ長調。左手が1小節20〜24音の分散和音を敷き、その上を右手の長い音符が歩きます。前半のどこよりも音の動きが穏やかです。",
 "67小節で pp。右手は C♯6・E6 といった高い位置に移り、遠くから聞こえる鐘のような響きになります。",
 "ここだけ楽器が別のもの——ハープや弦のトレモロ——に置き換わったように書かれています。"],
 notes:[["調","♯4つのホ長調。全曲でここだけの色で、前後のヘ長調から完全に隔離されています。"],
 ["書法","左手が伴奏形として自立し、右手が保続的に歌う。分業がはっきりした、ロマン派的な書き方です。"]],
 tech:[["01","左手の分散和音は、1小節を1つの和音として掴む。指ごとに考えると必ず粒が立ちます。"],
 ["02","右手の長い音は、押さえたあとに腕の重さを移動させると音が伸びて聞こえます。押しっぱなしにしないこと。"],
 ["03","設定で音色を「ハープ風」にして一度通すと、この場面が求めている響きが分かりやすくなります。"],
 ["04","ペダルは1小節1回。左手の最低音が変わるところで踏み替えます。"]]},

{from:71,to:74,fam:"calm",tag:"Inner peak",
 title:"中間部の頂点",
 ital:"cresc. (m.71) ／ f + mf (m.73)",
 body:["71小節に cresc. が二重に書かれ、73小節で右手 f・左手 mf。中間部の中の小さな頂点です。",
 "右手は C♯6・F♯6・G♯6 まで上がり、両手の距離が最大になります。ただし54〜57小節の頂点とは性格が違い、こちらは張り詰めるのではなく開きます。"],
 notes:[["強弱","右手 f・左手 mf と別々に書き分けられている数少ない箇所。旋律と伴奏の差を明示した指示です。"],
 ["比較","前半の頂点は密度で、ここは音域の広さで作られています。"]],
 tech:[["01","右手 f・左手 mf を守るために、設定の左右の音量で比率を作ってから、その比率を手で再現してください。"],
 ["02","広い音域を保つには、ペダルに頼らざるを得ません。ここは濁りを許容してよい場所です。"],
 ["03","74小節で急に音域が中央へ落ちます。落差を隠さず、はっきり別の高さへ着地させます。"],
 ["04","cresc. の起点は71小節の頭。それ以前を上げてしまうと2小節で頂点に届いてしまいます。"]]},

{from:75,to:78,fam:"calm",tag:"Settling",
 title:"沈静 — rit. でほどける",
 ital:"dim. (m.75) ／ mf — p — pp ／ rit. (m.78)",
 body:["75小節の dim. から一気に薄くなります。77小節では左手が1音しか残らず、右手だけが半音階的に漂います。",
 "78小節の rit. で速度が落ち、次の a Tempo に向けて息を整えます。"],
 notes:[["音数","77小節の左手はたった1音。伴奏がほぼ消え、旋律が裸になる瞬間です。"],
 ["半音","C♮・C♯・D♮・D♯ が混在し、調性の輪郭が一時的にぼやけます。"]],
 tech:[["01","77小節は左手が支えてくれません。右手だけでテンポを保つ必要があります。ここは特にメトロノームで確認を。"],
 ["02","半音階的な動きは、指をつなげすぎると濁ります。1音ずつ離すつもりでちょうどよくつながります。"],
 ["03","dim. の底を pp より下げないこと。この先まだ87小節まで弱い場面が続きます。"],
 ["04","78小節の rit. は79小節の a Tempo で必ず戻ります。戻り先を確認してから減速幅を決めてください。"]]},

{from:79,to:87,fam:"far",tag:"Enharmonic",
 title:"高音の光と、調号が消える瞬間",
 ital:"a Tempo ／ pp — ppp (m.87) ／ très retenu (m.86)",
 body:["79〜80小節は両手とも G♯5〜D♯6 の高音域だけ。81小節で大きなアルペジオが広がり、そこから84小節以降は分散和音の連続になります。",
 "86小節で<mark>調号が♯4つから何もない状態に変わり</mark>、音は A♭・C♭・E♭ という♭の綴りで書かれます。ホ長調（♯）と変イ（♭）を同じ音で書き替える、綴りの上での転換点です。",
 "同じ86小節に très retenu（大きくためて）。87小節は ppp。曲中もっとも弱く、もっとも遅い場所です。"],
 notes:[["綴り替え","♯4つ→調号なし→♭1つ（88小節）。音そのものより、書き方が先に変わって次の調へ渡ります。"],
 ["ppp","この曲で ppp が現れるのは87小節だけ。再現の直前に、いったん完全に沈みます。"]],
 tech:[["01","高音域だけの数小節は、耳が音量を過小評価しがちです。録音して確認するか、設定で音量を固定して聴き比べてください。"],
 ["02","81小節の大きなアルペジオは、下から上へ一続きに。途中で指を替える位置を先に決めておきます。"],
 ["03","très retenu は「遅くする」ではなく「引き留める」。音を長く保つ意識のほうが速度より優先です。"],
 ["04","ppp のあとに Ⅰ Tempo が来ます。87小節で止まりきらないよう、最後の音は次へ向かって残してください。"]]},

{from:88,to:95,fam:"song",tag:"Reprise",
 title:"Ⅰ Tempo — 主題が戻る",
 ital:"Ⅰ Tempo ／ pp — p",
 body:["調号が♭1つに戻り、冒頭の主題が再現されます。ただし今度は多くの和音にアルペジオ記号がつき、音がひとつずつ転がりながら鳴ります。",
 "右手は最初の提示より1オクターヴ高い位置（A5〜G6）。同じ歌が、遠くから、あるいは記憶のなかで鳴っているような配置です。",
 "92〜93小節で20小節台の変奏の形が戻り、94小節以降は音数が減っていきます。"],
 notes:[["再現","主題そのものは変わらず、置かれる高さと鳴らし方（アルペジオ）だけが変わっています。"],
 ["アルペジオ","88〜91小節に集中。楽譜どおりの記号にもとづいて、ここだけ和音を転がしています。"]],
 tech:[["01","アルペジオは速度を揃えること。小節ごとに速さが変わると、リズムが崩れて聞こえます。"],
 ["02","転がした和音の最後の音（最高音）が拍に来るように。最初の音を拍に置くと旋律が遅れます。"],
 ["03","高い音域での pp。鍵盤の底まで押し切らず、浅い打鍵で。"],
 ["04","冒頭（m.1〜11）と続けて弾き比べ、同じ歌だと聞こえるかを確認してください。装飾に気を取られると別物になります。"]]},

{from:96,to:101,fam:"song",tag:"Thinning",
 title:"薄れていく",
 ital:"p — pp",
 body:["左手が1〜3音まで減り、右手も10音前後。音数の減少がそのまま遠ざかりの感覚になります。",
 "99小節で一度だけアルペジオ付きの厚い和音が戻り、C♯5 という調外の音が差し込まれます。最後の翳り。",
 "100〜101小節で音域が中央に落ち着き、終結の準備に入ります。"],
 notes:[["減衰","強弱記号ではなく音数で弱くしていく方法。ペダルを踏んだままでも自然に遠ざかります。"],
 ["C♯","ヘ長調にない音。終わる直前に一度だけ外へ触れて、また戻ります。"]],
 tech:[["01","音が少ない場所ほど、1音の質が露出します。ここは速く弾く技術ではなく、音を置く技術の場所です。"],
 ["02","99小節のアルペジオだけ、ほんのわずかに時間を取ってよい。楽譜には書かれていない、演奏上の間です。"],
 ["03","左手の少ない音は、必ず前の小節とつなげて聴かせる。単独の点になると流れが切れます。"],
 ["04","ペダルは長めに。ここから最後までは、音を切るより残す判断を優先します。"]]},

{from:102,to:105,fam:"far",tag:"Coda",
 title:"retenu — 結び",
 ital:"retenu (m.102) ／ pp ／ m.g.",
 body:["102小節に retenu。ここから最後まで速度は戻りません。楽譜には m.g.（左手）の指示も書かれ、受け渡しの位置が指定されています。",
 "104〜105小節はどちらもアルペジオを含む短い和音のみ。C6 と F5 を含む響きでヘ長調に落ち着きます。",
 "最後まで pp。物語は大きな身振りではなく、言い終える形で閉じられます。"],
 notes:[["終止","ヘ長調の主和音へ。ただし強調はされず、静かに置かれるだけです。"],
 ["m.g.","main gauche＝左手。声部の受け渡しを明示した、演奏上の実務的な指示です。"]],
 tech:[["01","retenu 以降のテンポは戻しません。減速しきった状態を最後まで保つほうが、終わりが立ちます。"],
 ["02","最後の和音のアルペジオは、いちばんゆっくり。ここだけは転がす時間を惜しまないでください。"],
 ["03","ペダルを離す時刻まで設計する。音が完全に消えるまでが演奏です。"],
 ["04","弾き終えたあと手を上げるタイミングも決めておく。無音の数秒がこの曲の最後の1小節です。"]]}
];


/* 標語の訳 */
const GLOSS=[
  [/andantino con moto/i,'歩く速さで、やや動きをもって'],
  [/tempo rubato/i,'テンポを自由に伸び縮みさせて'],
  [/poco mosso/i,'少し動きをつけて'],
  [/animez peu [\u00e0a] peu/i,'少しずつ生き生きと'],
  [/molto calmato/i,'とても静かに、落ち着いて'],
  [/tr[\u00e8e]s retenu/i,'大きくためて'],
  [/a tempo|\u2160 ?tempo|^tempo\.?$/i,'もとの速さで'],
  [/poco rit/i,'わずかにゆるめて'],
  [/e rit\. in poco/i,'少しずつ遅く'],
  [/rit\./i,'だんだん遅く'],
  [/(?:^|[^s] )retenu/i,'ためて、遅く'],
  [/morendo|mo ?_ ?ren ?_ ?do/i,'消えていくように'],
  [/pi[\u00f9u] dim/i,'さらに弱く'],
  [/dim\./i,'だんだん弱く'],
  [/cresc/i,'だんだん強く'],
  [/m\.g/i,'m.g.＝左手'],
  [/m\.d/i,'m.d.＝右手']
];

const FAMPAL={
  dark :{song:'#d9a441',flow:'#5aa08a',calm:'#7e9ed6',far:'#ece5d4'},
  light:{song:'#9d7420',flow:'#3f7460',calm:'#4a68a8',far:'#7d8478'}
};
const FAMLINE=new Proxy({},{get:(t,k)=>FAMPAL[CO.name][k]});
const DYNGL={ppp:'きわめて弱く',pp:'とても弱く',p:'弱く',mp:'やや弱く',mf:'やや強く',f:'強く',ff:'とても強く'};
function glossOf(t){
  if(!t) return '';
  const out=[];
  for(const [re,jp] of GLOSS) if(re.test(t)&&out.indexOf(jp)<0) out.push(jp);
  return out.join(' ／ ');
}
function cleanMk(t){
  let x=(t||'')
    .replace(/mo\s*_\s*ren\s*_\s*do/i,'morendo')
    .replace(/\u2160\s*Tempo/,'Tempo I')
    .replace(/\s+/g,' ').trim();
  const cut=x.replace(/\s*m\.[dg]\.?\s*$/i,'').trim();
  return cut||x;
}
const SECOF={};
SEC.forEach((s,i)=>{for(let n=s.from;n<=s.to;n++) SECOF[n]=i;});

/* 標語・強弱のイベント表 */
const MK=[];
for(let i=0;i<MCOUNT;i++){
  const t=(MS[i].mk||'').trim(), dy=[...new Set((MS[i].dy||[]).map(d=>d[1]))];
  if(t||dy.length) MK.push({i:i,n:MS[i].n,t:t,dy:dy});
}
const DYNL=[];
(function(){let c='';
  for(let i=0;i<MCOUNT;i++){ const d=MS[i].dy||[]; if(d.length) c=d[d.length-1][1]; DYNL.push(c); }})();

/* 構造マップ */
var GREADY=false;
const gbar=$('gbar');
gbar.innerHTML=SEC.map((s,i)=>
  '<button class="gseg" data-i="'+i+'" data-fam="'+s.fam+'" style="flex-grow:'+(s.to-s.from+1)+
  '" aria-label="m.'+s.from+'–'+s.to+' '+s.tag+'"></button>').join('')+
  '<i class="gnow" id="gnow"></i>';
const gsegs=[...gbar.querySelectorAll('.gseg')], gnow=$('gnow');
gsegs.forEach(b=>b.addEventListener('click',()=>{
  const i=+b.dataset.i;
  setFollow(1); jumpToMeasure(SEC[i].from);
}));
function mapRange(){
  gsegs.forEach((b,i)=>b.classList.toggle('out', SEC[i].to<ST.rgA||SEC[i].from>ST.rgB));
}
const _rangeUI=rangeUI;
rangeUI=function(){ _rangeUI(); mapRange(); };
function setMapOn(i){ gsegs.forEach((b,k)=>b.classList.toggle('on',k===i)); }
function setMapSel(i){ gsegs.forEach((b,k)=>b.classList.toggle('sel', !GS.follow && k===i)); }

/* 位置の移動 */
function jumpToMeasure(n){
  const p=MS[n-1].start;
  if(n<ST.rgA||n>ST.rgB){
    ST.rgA=Math.min(ST.rgA,n); ST.rgB=Math.max(ST.rgB,n); rangeUI(); save(); buildMap();
  }
  if(playing) seekTo(p,1); else { anchorP=p; }
  draw();
}
function practiceSection(i){
  const s=SEC[i];
  ST.rgA=s.from; ST.rgB=s.to; rangeUI(); save(); buildMap();
  if(playing) seekTo(rangeA(),1); else anchorP=rangeA();
  draw();
}

/* 解説の描画 */
var GS={idx:-1,mi:-1,follow:1};
function renderGuide(i,anim){
  if(i==null||i<0||i>=SEC.length) i=0;
  const dir=(GS.idx<0||GS.idx===i)?0:(i>GS.idx?1:-1);   /* 進む＝1／戻る＝-1 */
  const s=SEC[i]; GS.idx=i;
  $('gfam').style.background=FAMLINE[s.fam];
  $('gtag').textContent=s.tag;
  $('gmm').textContent='m.'+s.from+'–'+s.to;
  $('gseglab').textContent=s.tag+' ／ m.'+s.from+'–'+s.to;
  const music='<div class="v-music">'+s.body.map(p=>'<p>'+p+'</p>').join('')+
    '<ul class="g-notes">'+s.notes.map(n=>'<li><b>'+n[0]+'</b>　'+n[1]+'</li>').join('')+'</ul></div>';
  const tech='<div class="v-tech"><ul class="g-notes">'+
    s.tech.map(n=>'<li><span class="g-step">'+n[0]+'</span>'+n[1]+'</li>').join('')+'</ul></div>';
  const b=$('gbody');
  b.innerHTML='<h3 class="g-ttl">'+s.title+'</h3><p class="g-ital">'+s.ital+'</p>'+music+tech;
  if(anim){
    const cls=dir>0?'g-in-next':(dir<0?'g-in-prev':'g-fade');
    b.classList.remove('g-fade','g-in-next','g-in-prev'); void b.offsetWidth; b.classList.add(cls);
  }
  setMapSel(i);
}
function updateLive(mi){
  let cur=null,nxt=null,txt=null;
  for(const e of MK){
    if(e.i<=mi){ cur=e; if(e.t) txt=e; }
    else { nxt=e; break; }
  }
  const t=cleanMk(txt?txt.t:'');
  $('gmk').innerHTML = t ? t+(txt.i<mi?'<em class="from">m.'+txt.n+'〜</em>':'') : '—';
  const d=DYNL[mi];
  $('ggl').textContent=[glossOf(txt?txt.t:''),DYNGL[d]||''].filter(Boolean).join('　/　');
  $('gdyn').innerHTML='<b>'+(d||'—')+'</b>';
  if(nxt){
    const dd=nxt.n-MS[mi].n, g=glossOf(nxt.t), lab=cleanMk(nxt.t)||nxt.dy.join(' ');
    $('gnextmk').innerHTML='次の指示 → <b>'+(lab||'—')+'</b>'+(g?'（'+g+'）':'')+
      ' m.'+nxt.n+'・あと'+dd+'小節';
  } else $('gnextmk').textContent='';
  const si=SECOF[MS[mi].n];
  if(si+1<SEC.length){
    const ns=SEC[si+1];
    $('gnextsec').innerHTML='次の場面 → <b>'+ns.tag+'</b> m.'+ns.from+'・あと'+(ns.from-MS[mi].n)+'小節';
  } else $('gnextsec').textContent='';
  const live=$('glive');
  if(cur&&cur.i===mi){ live.classList.remove('flash'); void live.offsetWidth; live.classList.add('flash'); }
}
function guideUpdate(pos){
  if(!GREADY) return;
  const mi=measureAt(pos);
  gnow.style.left=(((mi+(pos-MS[mi].start)/MS[mi].L)/MCOUNT)*100)+'%';
  if(mi!==GS.mi){
    GS.mi=mi;
    const si=SECOF[MS[mi].n];
    updateLive(mi);
    setMapOn(si);
    if(GS.follow&&si!==GS.idx) renderGuide(si,true);
  }
  const s=SEC[GS.idx];
  if(s){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    $('gprog').style.width=Math.max(0,Math.min(1,(pos-a)/(b-a)))*100+'%';
  }
}

/* 場面の色をロールの背景に薄く敷く */
function drawSectionBands(g,left){
  if(!GREADY) return;
  const right=left+W/PXP;
  g.font='9px ui-monospace,Menlo,monospace';
  for(const s of SEC){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    if(b<left||a>right) continue;
    const x0=(a-left)*PXP, x1=(b-left)*PXP;
    g.globalAlpha=s.fam==='far'?CO.bandFar:CO.band; g.fillStyle=FAMLINE[s.fam];
    g.fillRect(x0,0,x1-x0,H);
    g.globalAlpha=0.85;
    g.strokeStyle=FAMLINE[s.fam]; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x0,0); g.lineTo(x0,H); g.stroke();
    g.fillStyle=FAMLINE[s.fam]; g.fillText(s.tag,x0+5,H-6);
    g.globalAlpha=1;
  }
}

/* 操作 */
function setFollow(v){
  GS.follow=v?1:0; ST.gfollow=GS.follow; save();
  $('gfollow').classList.toggle('on',!!GS.follow);
  $('ghint').textContent=GS.follow?'':'手動で表示中';
  if(GS.follow){ const si=SECOF[MS[Math.max(0,GS.mi)].n]; renderGuide(si,true); setMapSel(si); }
  else setMapSel(GS.idx);
}
$('gfollow').addEventListener('click',()=>setFollow(!GS.follow));
$('gprev').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.max(0,GS.idx-1),true); });
$('gnextbtn').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.min(SEC.length-1,GS.idx+1),true); });
$('gprac').addEventListener('click',()=>{ practiceSection(GS.idx); setFollow(1); });
const gview=$('gview');
[...gview.children].forEach(b=>{
  b.classList.toggle('on',b.dataset.v===ST.gview);
  b.addEventListener('click',()=>{
    ST.gview=b.dataset.v; save();
    [...gview.children].forEach(x=>x.classList.toggle('on',x===b));
    $('guide').className='guide view-'+ST.gview;
  });
});
$('guide').className='guide view-'+ST.gview;

/* 起動 */
GS.follow=ST.gfollow?1:0;
$('gfollow').classList.toggle('on',!!GS.follow);
$('ghint').textContent=GS.follow?'':'手動で表示中';
mapRange();
GREADY=true;
GS.mi=-1;
renderGuide(SECOF[MS[measureAt(anchorP)].n],false);
draw();

/* ---- 音の設定シートの開閉 ---- */
function openSheet(){ $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden','false');
  document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden'; }
function closeSheet(){ $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden','true');
  document.documentElement.style.overflow=''; document.body.style.overflow=''; resize(); draw(); }
$('openSet').addEventListener('click',openSheet);
$('closeSet').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('sheet').classList.contains('open')) closeSheet(); });
document.addEventListener('keydown',e=>{
  if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); ensureAudio(); playing?pause():start(); }
});

<\/script>

<script>
/* ---- 押した指に反応させる（iOSの :active は当てにならないので自前で） ---- */
(function(){
  var SEL='button,.sw', cur=null;
  function off(){ if(cur){ cur.classList.remove('tapdown'); cur=null; } }
  document.addEventListener('pointerdown',function(e){
    var t=(e.target&&e.target.closest)?e.target.closest(SEL):null;
    if(!t||t.disabled) return;
    off(); cur=t; t.classList.add('tapdown');
  },{passive:true});
  document.addEventListener('pointerup',off,{passive:true});
  document.addEventListener('pointercancel',off,{passive:true});
  document.addEventListener('pointermove',function(e){ if(cur&&e.buttons===0) off(); },{passive:true});
  window.addEventListener('blur',off);
})();
<\/script>

<script>
/* 親（曲の一覧）から「止めて」と言われたら、音を完全に落としてから消える */
window.addEventListener('message',function(e){
  if(!e||!e.data||e.data.cmd!=='halt') return;
  try{ if(typeof stopAll==='function') stopAll(); }catch(_){}
  try{ if(typeof ctx!=='undefined'&&ctx&&ctx.close) ctx.close(); }catch(_){}
});
<\/script>

/* ===== リアルタイム解説 ===== */
:root{ --tile:#1e6e7e; --tilelt:#7fb6be; --granate:#c22a3a; --gsand:#e9dfc7; }

/* 構造マップ（画面上部に固定） */
.gmap{position:sticky;top:0;z-index:40;background:rgba(15,16,32,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

/* 解説カード */
.guide{padding:0;overflow:hidden}
.g-prog{height:2px;background:rgba(127,182,190,.16)}

<details class="keys">
  <summary>この曲を貫く4つの仕掛け</summary>
  <div class="keys-in">
    <h4>① C♯ の持続音 — 解決しない夜</h4>
    <p>冒頭から終盤まで C♯ がほぼ鳴りっぱなし。F♯ から見れば属音で、つまり全曲が「ドミナントの上で漂っている」状態です。着地は最後の数小節まで来ません。</p>
    <h4>② 増2度 — ムーアの記憶</h4>
    <p>主題の <span class="chord">D♮ → E♯</span>。ヒジャーズ系の特徴音で、アンダルシアに残るアラブ音楽の刻印です。この一音程だけで「スペイン」ではなく「グラナダ」になります。</p>
    <h4>③ 歌 ⇄ ギター の交替</h4>
    <p>Tempo rubato（歌＝カンテ）と Tempo giusto（ギター＝乾いた和音の刻み）が交互に現れます。伴奏と旋律ではなく、二人の別の奏者を映画的にカット割りする構造です。</p>
    <h4>④ 遠近法 — 音量と音域の距離</h4>
    <p>pp と ppp が支配的で ff は全曲で一度きり。さらに「Léger et lointain（軽く、遠くから）」。近くの音と遠くの音が層になっています。</p>
    <div class="pull">再現ではなく、喚起。<br>写生ではなく、思い出したことにする技術。</div>
    <p>ドビュッシーがスペインで過ごしたのは、サン・セバスティアンで闘牛を見た数時間だけと言われます。素材は1889年パリ万博などで耳にした音楽と、楽譜と、想像。にもかかわらずマヌエル・デ・ファリャは、この曲がアンダルシアの実感を極めて正確に捉えていると評価しました。</p>
  </div>
</details>

/* ---- tempo shape from the printed markings ---- */
const SCALE = new Float64Array(MCOUNT), RIT = new Uint8Array(MCOUNT), HOLD = new Float64Array(MCOUNT);
(function(){
  let base=1;
  for(let i=0;i<MCOUNT;i++){
    const t=(MS[i].mk||'').toLowerCase();
    if(t.includes('retenu')){ RIT[i]=1; }
    else if(t.includes('tempo giusto')||t.includes('tempo 1')||t.includes('mouvement du début')||t.includes('mouvement de habanera')) base=1;
    else if(t.includes('très rythmé')) base=1.06;
    else if(t.includes('tempo rubato')) base=0.97;
    else if(t.includes('léger et lointain')) base=0.95;
    SCALE[i]=base;
  }
  // a Retenu slows over its own bar and the next, then the following mark restores
  for(let i=0;i<MCOUNT;i++) if(RIT[i]){
    SCALE[i]=SCALE[i]*0.94;
    if(i+1<MCOUNT && !(MS[i+1].mk||'').match(/Tempo|Mouvement/i)) SCALE[i+1]=SCALE[i+1]*0.84;
  }
  // Léger et lointain（3/4）は倍のテンポ、区間の終わりはフェルマータ
  for(let i=0;i<MCOUNT;i++) if(MS[i].sig==='3/4'){
    SCALE[i]=2.0; RIT[i]=0;
    if(i+1>=MCOUNT || MS[i+1].sig!=='3/4') HOLD[i]=4;   // 元のテンポで4拍ぶん空ける
  }
})();
function scaleAtPos(pos){
  if(!ST.tmp) return 1;
  let lo=0,hi=MCOUNT-1;
  while(lo<hi){const m=(lo+hi+1)>>1; if(MS[m].start<=pos) lo=m; else hi=m-1;}
  const a=SCALE[lo], b=(lo+1<MCOUNT?SCALE[lo+1]:SCALE[lo]);
  const f=(pos-MS[lo].start)/MS[lo].L;
  return RIT[lo] ? a+(b-a)*f : a;
}
let TMAP=null; const STEP=1/6;
function buildMap(){
  const base=60/ST.bpm/4, n=Math.round(TOTAL/STEP)+1;

  if(ST.tmp) for(let i=0;i<MCOUNT;i++) if(HOLD[i]>0){
    const idx=Math.round((MS[i].start+MS[i].L)/STEP), add=HOLD[i]*60/ST.bpm;
    for(let j=idx;j<n;j++) TMAP[j]+=add;
  }
  for(const p of [...arpTops().keys()].sort((a,b)=>a-b)){
    const idx=Math.round(p/STEP)+1, add=arpWait(p);
    for(let j=idx;j<n;j++) TMAP[j]+=add;
  }
  buildOffsets();
}
function posToSec(p){const i=p/STEP,a=Math.floor(i);if(a>=TMAP.length-1)return TMAP[TMAP.length-1];return TMAP[a]+(TMAP[a+1]-TMAP[a])*(i-a);}
function secToPos(s){let lo=0,hi=TMAP.length-1;if(s<=0)return 0;if(s>=TMAP[hi])return TOTAL;
  while(hi-lo>1){const m=(lo+hi)>>1;if(TMAP[m]<=s)lo=m;else hi=m;}
  const d=TMAP[hi]-TMAP[lo];return (lo+(d?(s-TMAP[lo])/d:0))*STEP;}
function measureAt(pos){let lo=0,hi=MCOUNT-1;while(lo<hi){const m=(lo+hi+1)>>1;if(MS[m].start<=pos)lo=m;else hi=m-1;}return lo;}

/* ---- audio ---- */
let ctx=null,bus=null;
function ensureAudio(){
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
    bus=ctx.createGain();bus.gain.value=0.85;bus.connect(ctx.destination);}
  if(ctx.state==='suspended')ctx.resume();
}
const TIMBRES={piano:'ピアノ風',guitar:'ギター風（ナイロン弦）',marimba:'マリンバ風',bell:'鐘のような音',sine:'正弦波'};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function voice(t,midi,dur,gain,kind){
  const f=mtof(midi),g=ctx.createGain();g.connect(bus);
  const rel=kind==='sine'?0.12:0.3,end=t+Math.max(0.1,dur)+rel;
  if(kind==='sine'){const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.02);
    g.gain.setValueAtTime(gain,t+Math.max(0.07,dur));g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t);o.stop(end+0.02);return;}
  if(kind==='guitar'){const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=1.1;
    lp.frequency.setValueAtTime(Math.min(6000,f*9),t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(220,f*2),t+0.35);
    o.connect(lp);lp.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.006);
    g.gain.exponentialRampToValueAtTime(gain*0.28,t+0.28);g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t);o.stop(end+0.02);return;}
  if(kind==='marimba'||kind==='bell'){
    const parts=kind==='marimba'?[[1,1],[4,0.28],[9.2,0.1]]:[[1,1],[2.76,0.35],[5.4,0.16]];
    const dec=kind==='marimba'?0.45:2.0;
    parts.forEach(([r,a])=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f*r;
      const gg=ctx.createGain();gg.gain.value=a;o.connect(gg);gg.connect(g);o.start(t);o.stop(t+dec+0.1);});
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec);return;}
  const o1=ctx.createOscillator();o1.type='triangle';o1.frequency.value=f;
  const o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=f*2;
  const g2=ctx.createGain();g2.gain.value=0.22;o2.connect(g2);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';
  lp.frequency.setValueAtTime(Math.min(8000,f*8+900),t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(300,f*2.2),t+0.8);
  o1.connect(lp);g2.connect(lp);lp.connect(g);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.008);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain*0.35),t+Math.min(1.2,0.25+dur*0.5));
  g.gain.exponentialRampToValueAtTime(0.0001,end);
  o1.start(t);o1.stop(end+0.02);o2.start(t);o2.stop(end+0.02);
}
function click(t,strong,gain){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square';o.frequency.value=strong?2100:1350;o.connect(g);g.connect(bus);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);o.start(t);o.stop(t+0.06);
}
/* dynamics carried forward from the printed marks */
const DYN=[[],[]];
(function(){let cur=[0.30,0.30];
  for(let i=0;i<MCOUNT;i++){ (MS[i].dy||[]).forEach(d=>{cur[d[0]]=d[2];});
    DYN[0].push(cur[0]); DYN[1].push(cur[1]); }})();
function handMul(m,h){
  if(h!==0) return 1;
  if(m>=5&&m<=14) return 0.65;      // 高いC♯の保続音はもっと弱く
  if(m>=98&&m<=108) return 0.5;     // 主旋律が左手
  if(m>=122&&m<=128) return 0.55;   // ppp の C♯
  if(m>=133) return 0.28;           // 終結部の高い C♯（ppp）
  return 1;
}
function gainFor(n){ return (ST.dyn ? DYN[n.h][n.m-1] : 0.4) * handMul(n.m,n.h); }

/* 122〜128：左手の和音をアルペジオで弾き切り、左手を右手の位置へ運んでから右手の段が入る。
   その待ち時間ぶんの「間」を曲の時間軸そのものに挿入するので、
   以降（123・125・128 …）もすべて同じだけ後ろにずれ、どこも詰まらない。 */
const ARP_STEP=0.055, ARP_GAP=0.13;
let OFF=null, ARP_TOPS=null;
function arpTops(){
  if(ARP_TOPS) return ARP_TOPS;
  ARP_TOPS=new Map();
  for(const n of NOTES)
    if(n.m>=122&&n.m<=128&&n.arp) ARP_TOPS.set(n.abs,Math.max(ARP_TOPS.get(n.abs)||0,n.ao));
  return ARP_TOPS;
}
function arpWait(p){ return arpTops().get(p)*ARP_STEP+ARP_GAP; }
function buildOffsets(){
  OFF=new Float64Array(NOTES.length);
  for(const p of arpTops().keys()){
    const w=arpWait(p);
    for(let i=firstNoteAt(p);i<NOTES.length;i++){
      const n=NOTES[i];
      if(n.abs>p+1e-6) break;
      if(n.h===0) OFF[i]=w;          // 同じ位置に書かれた右手は、転がし終わってから
    }
  }
}

/* ---- scheduling (look-ahead: 先の0.5秒ぶんだけ予約する) ---- */
let playing=false,anchorT=0,anchorP=0,baseSec=0,noteIdx=0,metro=[],metroIdx=0,schedId=null,raf=null;
let horizon=0;   /* ここまでは既に音を予約済み、という時刻 */
const rangeA=()=>MS[ST.rgA-1].start, rangeB=()=>MS[ST.rgB-1].start+MS[ST.rgB-1].L;
const LOOK=0.5;
function secOf(p){return anchorT+posToSec(p)-baseSec;}
function firstNoteAt(pos){
  let lo=0,hi=NOTES.length;
  while(lo<hi){const m=(lo+hi)>>1; if(NOTES[m].abs<pos-1e-6) lo=m+1; else hi=m;}
  return lo;
}
function buildMetro(){
  metro=[];
  if(!ST.onM||ST.volM<=0) return;
  const step=16/ST.div;
  for(let mi=ST.rgA-1;mi<ST.rgB;mi++)
    for(let k=0;k*step<MS[mi].L-1e-6;k++) metro.push([MS[mi].start+k*step,k===0]);
}
function seekTo(pos,flush){
  ensureAudio();
  if(flush) flushAudio();
  const a=rangeA(),b=rangeB();
  if(pos<a||pos>=b) pos=a;
  anchorP=pos; baseSec=posToSec(pos); anchorT=ctx.currentTime+0.12;
  noteIdx=firstNoteAt(pos);
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pos-1e-6) metroIdx++;
}
function schedTick(){
  if(!playing||!ctx) return;
  const now=ctx.currentTime, until=now+LOOK, b=rangeB();
  horizon=until;
  let budget=48;                                  // 1回のtickで予約する上限
  while(noteIdx<NOTES.length&&budget>0){
    const idx=noteIdx, n=NOTES[noteIdx];
    if(n.abs>=b){ noteIdx=NOTES.length; break; }
    const t=n.g?secOf(n.abs)-0.095:secOf(n.abs);
    if(t>until) break;
    noteIdx++;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const gv=gainFor(n)*((n.h===0?ST.volR:ST.volL)/100)*(n.g?0.55:1);
    if(gv<=0) continue;
    const dur=n.g?0.09:posToSec(Math.min(b,n.abs+n.q))-posToSec(n.abs);
    // 122〜128 は旋律の頭までを一続きに転がすので、16分音符に収まる速さにする
    const step = ((n.m>=38&&n.m<=59)||(n.m>=96&&n.m<=98)) ? 0.013
               : (n.m>=122&&n.m<=128) ? ARP_STEP : 0.042;
    const roll = (OFF&&OFF[idx]) ? OFF[idx] : (n.arp ? n.ao*step : 0);
    voice(Math.max(now,t+roll),n.midi,Math.max(0.08,dur-roll),gv,n.h===0?ST.tbR:ST.tbL);
    budget--;
  }
  while(metroIdx<metro.length){
    const t=secOf(metro[metroIdx][0]);
    if(t>until) break;
    click(Math.max(now,t),metro[metroIdx][1],ST.volM/100*0.5);
    metroIdx++;
  }
  if(now>=secOf(b)-0.02){
    if(ST.loop) seekTo(rangeA());
    else { stopAll(); anchorP=rangeA(); draw(); label(); }
  }
}
function curPos(){
  if(!playing||!ctx) return anchorP;
  return Math.min(rangeB(),Math.max(rangeA(),secToPos(baseSec+(ctx.currentTime-anchorT))));
}
function stopAll(){
  if(schedId){clearInterval(schedId);schedId=null;}
  playing=false;
  if(ctx){bus.disconnect();bus=ctx.createGain();bus.gain.value=0.85;bus.connect(ctx.destination);}
  if(raf){cancelAnimationFrame(raf);raf=null;}
}
function start(){
  ensureAudio(); buildMap();
  let p=anchorP; if(p>=rangeB()-1e-6||p<rangeA()) p=rangeA();
  playing=true; seekTo(p); schedTick();
  schedId=setInterval(schedTick,60);
  tick(); label();
}
function pause(){const p=curPos();stopAll();anchorP=p;draw();label();}
function reset(){stopAll();anchorP=rangeA();draw();label();}
/* ---- 設定変更の扱い ----------------------------------------------
   以前は音量でもテンポでも reflow() → seekTo() を呼んでいたため、
   先読み（0.5秒）で既に予約済みの音を、もう一度予約し直していた。
   その結果、変更した瞬間だけ同じ箇所が二重に鳴っていた。
   予約をやり直すのは「本当に位置が飛ぶとき」だけにする。            */
function flushAudio(){          /* 予約済みの音を破棄する（位置が飛ぶときだけ） */
  if(ctx){bus.disconnect();bus=ctx.createGain();bus.gain.value=0.85;bus.connect(ctx.destination);}
}
function retime(){              /* テンポなど時間軸が変わる変更：継ぎ目なく差し替える */
  if(!playing||!ctx){ buildMap(); draw(); return; }
  const now=ctx.currentTime;
  const pNow=curPos();                                   /* 旧マップでの現在地 */
  const pEdge=Math.min(rangeB(),                         /* 旧マップでの予約済みの先端 */
    secToPos(baseSec+Math.max(0,horizon-anchorT)));
  buildMap();
  anchorT=now; baseSec=posToSec(pNow);                   /* 表示も音も現在地でつなぐ */
  noteIdx=Math.max(noteIdx,firstNoteAt(pEdge+1e-6));     /* 予約済みは飛ばす＝二重に鳴らさない */
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;
}
function remetro(){             /* メトロノームの刻みが変わる変更 */
  if(!playing||!ctx){ buildMetro(); metroIdx=0; return; }
  const pEdge=secToPos(baseSec+Math.max(0,horizon-anchorT));
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;
}
function redraw(){ save(); if(!playing) draw(); }   /* 音量・音色など、予約し直す必要のない変更 */
function reflow(){ retime(); }
let lastFrame=0;
function tick(){
  raf=requestAnimationFrame(ts=>{
    if(ts-lastFrame>30){lastFrame=ts;draw();}
    if(playing) tick();
  });
}

/* ---- piano roll ---- */
const cv=document.getElementById('roll'),cx2d=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(1.5,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;cx2d.setTransform(DPR,0,0,DPR,0,0);
}
const PXP=13;                       // px per sixteenth
function draw(){
  if(!W) resize();
  const pos=curPos(), view=W/PXP, left=pos-view*0.35;
  const g=cx2d;
  g.clearRect(0,0,W,H);
  g.fillStyle='#12142a';g.fillRect(0,0,W,H);
  drawSectionBands(g,left);
  const yOf=m=>H-((m-LOMIDI)/(HIMIDI-LOMIDI))*H;
  // C rows
  g.fillStyle='rgba(255,255,255,.045)';
  for(let m=LOMIDI;m<=HIMIDI;m++) if(m%12===1){ const y=yOf(m); g.fillRect(0,y-1,W,2); }
  // measure lines
  g.strokeStyle='rgba(120,130,190,.35)';g.lineWidth=1;g.font='10px ui-monospace,Menlo,monospace';
  for(let i=0;i<MCOUNT;i++){
    const x=(MS[i].start-left)*PXP;
    if(x<-40||x>W+40) continue;
    g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();
    if(MS[i].n%2===1){g.fillStyle='rgba(163,160,180,.75)';g.fillText(MS[i].n,x+3,11);}
  }
  // notes（画面に入りうる範囲だけを走査）
  const vEnd=left+view;
  for(let i=firstNoteAt(left-48);i<NOTES.length;i++){
    const n=NOTES[i];
    if(n.abs>vEnd) break;
    if(n.abs+n.q<left) continue;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const x=(n.abs-left)*PXP, w=Math.max(3,(n.g?0.5:n.q)*PXP-1.5);
    const y=yOf(n.midi), h=Math.max(3,H/(HIMIDI-LOMIDI)-1);
    const on = pos>=n.abs && pos<n.abs+n.q;
    g.fillStyle = n.h===0 ? (on?'#ffd591':'#e3a648') : (on?'#b8ecf9':'#6fb7c9');
    g.globalAlpha = n.g?0.6:1;
    g.fillRect(x,y-h/2,w,h);
    g.globalAlpha=1;
  }
  // playhead
  const px=(pos-left)*PXP;
  g.strokeStyle='#ece2cf';g.lineWidth=1.5;
  g.beginPath();g.moveTo(px,0);g.lineTo(px,H);g.stroke();
  readout(pos);
}
