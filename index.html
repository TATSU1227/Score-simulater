<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12131a">
<title>Debussy ｜ 採譜プレーヤー全曲集</title>
<style>
:root{
  --bg:#12131a; --bg2:#1a1c26; --line:#2b2e3c; --ink:#e9e7de; --dim:#9a9cae;
  --hi:#d9b26a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg)}
body{color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---- 全体の枠 ---- */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(6px + env(safe-area-inset-top)) 10px 6px;
  background:var(--bg);border-bottom:1px solid var(--line);min-height:44px}
.bar.hidden{display:none}
.iconbtn{display:flex;align-items:center;justify-content:center;gap:6px;
  min-width:40px;min-height:34px;padding:5px 9px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg2);font-size:13px}
.iconbtn:disabled{opacity:.34}
.now{flex:1 1 auto;min-width:0;line-height:1.22;padding:0 2px}
.now b{display:block;font-family:Georgia,"Times New Roman",serif;font-weight:400;
  font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now s{display:block;text-decoration:none;font-size:10.5px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1 1 auto;width:100%;height:100%;border:0;display:block;background:var(--bg)}
.pad{flex:0 0 auto;height:env(safe-area-inset-bottom);background:var(--bg)}

/* ---- 曲を選ぶ画面 ---- */
.menu{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.menu[hidden]{display:none}
.mwrap{max-width:640px;margin:0 auto}
.eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--hi);margin:0 0 8px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:27px;line-height:1.25;margin:0 0 7px}
h1 em{font-style:italic}
.lead{color:var(--dim);font-size:13px;margin:0 0 20px}
.card{display:flex;gap:12px;width:100%;text-align:left;align-items:flex-start;
  background:var(--bg2);border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;margin:0 0 9px;transition:border-color .12s,transform .08s}
.card:active{transform:scale(.994)}
.card.on{border-color:var(--ac)}
.chip{flex:0 0 auto;width:4px;align-self:stretch;border-radius:3px;background:var(--ac);min-height:44px}
.ct{display:block;min-width:0;flex:1 1 auto}
.ct b{display:block;font-family:Georgia,"Times New Roman",serif;font-style:italic;
  font-weight:400;font-size:19px;line-height:1.2;color:var(--ink)}
.ct i{display:block;font-style:normal;font-size:13px;margin-top:2px;color:#c6c8d6}
.ct em{display:block;font-style:normal;font-size:11px;color:var(--dim);
  letter-spacing:.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.ct u{display:block;text-decoration:none;font-size:11px;color:#7f8296;margin-top:3px;
  font-family:Georgia,serif;font-style:italic;line-height:1.45}
.note{color:#787b8d;font-size:11.5px;line-height:1.75;margin:16px 0 0}
.close{display:block;width:100%;margin:14px 0 0;padding:12px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg2);font-size:14px}
.close[hidden]{display:none}
.spin{color:var(--dim);font-size:12px;padding:22px 16px}

/* ===== タップの手ごたえ ===== */
button{-webkit-user-select:none;user-select:none;
  transition:transform .2s cubic-bezier(.34,1.4,.5,1), border-color .18s ease, filter .16s ease}
button.tapdown{transition-duration:.08s;transition-timing-function:ease-out}
.iconbtn.tapdown{transform:scale(.9);filter:brightness(1.25)}
.card.tapdown{transform:scale(.977);border-color:var(--ac);filter:brightness(1.06)}
.close.tapdown{transform:scale(.97);filter:brightness(1.2)}
.chip{transition:transform .2s cubic-bezier(.34,1.35,.5,1)}
.card.tapdown .chip{transform:scaleY(.88)}

/* ===== 曲の入れ替え（進む＝右から、戻る＝左から） ===== */
#stage{will-change:transform,opacity;backface-visibility:hidden}
.bar{transform:translateY(-100%);opacity:0;
  transition:transform .3s cubic-bezier(.16,.84,.44,1), opacity .2s ease}
.bar.show{transform:none;opacity:1}

/* ===== 一覧の開閉 ===== */
.menu.anim{animation:mIn .26s cubic-bezier(.16,.84,.44,1)}
.menu.closing{animation:mOut .19s ease forwards}
@keyframes mIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mOut{to{opacity:0;transform:translateY(9px)}}
.menu.anim .card{animation:cIn .34s cubic-bezier(.16,.84,.44,1) both}
.menu.anim .card:nth-of-type(1){animation-delay:.03s}
.menu.anim .card:nth-of-type(2){animation-delay:.06s}
.menu.anim .card:nth-of-type(3){animation-delay:.09s}
.menu.anim .card:nth-of-type(4){animation-delay:.12s}
.menu.anim .card:nth-of-type(5){animation-delay:.15s}
.menu.anim .card:nth-of-type(6){animation-delay:.18s}
.menu.anim .card:nth-of-type(7){animation-delay:.21s}
@keyframes cIn{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
  button,.chip,.bar{transition:filter .12s ease}
  button.tapdown{transform:none;filter:brightness(1.2)}
  .menu.anim,.menu.closing,.menu.anim .card{animation:none}
  .bar{transform:none;opacity:1}
}
</style>
</head>
<body>

<div class="shell">
  <div class="bar hidden" id="bar">
    <button class="iconbtn" id="pick" aria-label="曲を選ぶ">
      <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="2" y="3.4" width="16" height="1.9" rx=".9" fill="currentColor"/>
        <rect x="2" y="9.05" width="16" height="1.9" rx=".9" fill="currentColor"/>
        <rect x="2" y="14.7" width="16" height="1.9" rx=".9" fill="currentColor"/>
      </svg>曲
    </button>
    <div class="now"><b id="nowT">—</b><s id="nowS"></s></div>
    <button class="iconbtn" id="prev" aria-label="前の曲">‹</button>
    <button class="iconbtn" id="next" aria-label="次の曲">›</button>
  </div>
  <iframe id="stage" title="採譜プレーヤー" allow="autoplay"
          referrerpolicy="no-referrer"></iframe>
  <div class="pad"></div>
</div>

<div class="menu" id="menu">
  <div class="mwrap">
    <p class="eyebrow">Claude Debussy · Piano</p>
    <h1><em>採譜プレーヤー</em> 全曲集</h1>
    <p class="lead">MusicXMLから起こした採譜データを鳴らしながら、小節ごとの解説を読むためのページです。曲を選ぶと、その曲だけが読み込まれます。</p>
    <button class="card" data-id="prelude" style="--ac:#d8a05e"><span class="chip"></span><span class="ct"><b>Prélude</b><i>ベルガマスク組曲 第1曲</i><em>Suite bergamasque I · 1890頃　·　89小節 · 1746音</em><u>Moderato — poco a poco cresc. — ff</u></span></button>
    <button class="card" data-id="clair" style="--ac:#d9c47f"><span class="chip"></span><span class="ct"><b>Clair de lune</b><i>月の光</i><em>Suite bergamasque III　·　72小節 · 1497音</em><u>Andante très expressif — Un poco mosso — morendo</u></span></button>
    <button class="card" data-id="ballade" style="--ac:#d9a441"><span class="chip"></span><span class="ct"><b>Ballade</b><i>スラヴ風バラード</i><em>L.70 · 1890　·　105小節 · 2794音</em><u>Andantino con moto — Poco mosso — Molto calmato</u></span></button>
    <button class="card" data-id="grenade" style="--ac:#e3a648"><span class="chip"></span><span class="ct"><b>La soirée dans Grenade</b><i>グラナダの夕べ</i><em>Estampes II · 1903　·　136小節 · 2402音</em><u>Mouvement de Habanera — Très rythmé — Léger et lointain</u></span></button>
    <button class="card" data-id="lente" style="--ac:#d8a441"><span class="chip"></span><span class="ct"><b>La plus que lente</b><i>レントより遅く</i><em>Valse · 1910　·　148小節 · 1442音</em><u>Lent — Rubato — Appassionato — De plus en plus lent</u></span></button>
    <button class="card" data-id="cathedrale" style="--ac:#d7b26d"><span class="chip"></span><span class="ct"><b>La cathédrale engloutie</b><i>沈める寺</i><em>Préludes I-10 · 1910　·　89小節 · 1719音</em><u>Profondément calme (dans une brume doucement sonore)</u></span></button>
    <button class="card" data-id="bruyeres" style="--ac:#8f5a86"><span class="chip"></span><span class="ct"><b>Bruyères</b><i>ヒースの茂る荒地</i><em>Préludes II-5 · 1913　·　51小節 · 777音</em><u>Calme, doucement expressif — Un peu animé (joyeux)</u></span></button>
    <button class="close" id="close" hidden>閉じる</button>
    <p class="note">7曲ぶんのデータをこの1ファイルに収めていますが、実際に組み立てて動かすのは選んだ1曲だけです。別の曲に移ると前の曲は完全に破棄されるので、通しで聴いても重くなりません。速さ・音量・音色などの設定は曲ごとに保存されます。</p>
  </div>
</div>

<script type="text/plain" id="src-prelude"><!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141019">
<title>ベルガマスク組曲 第1曲 プレリュード 全曲 ｜ 採譜プレーヤー＋実況解説</title>
<style>
:root{
  --night:#141019; --panel:#231d2e; --line:#3a2f47;
  --sand:#efe4d3; --dim:#a99fb2; --amber:#d8a05e; --cyan:#8fa9cf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(120% 55% at 50% -10%, #35284a 0%, transparent 60%), var(--night);
  color:var(--sand);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.7;padding:0 0 60px;-webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:20px 0 10px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin:0 0 9px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:29px;line-height:1.25;margin:0 0 6px}
h1 em{font-style:italic}
.sub{color:var(--dim);font-size:13px;margin:0}
.lead{color:#cfc9dd;font-size:14px;margin:14px 0 0}
.lead b{color:var(--sand);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:14px 0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.transport{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn{background:#2b2338;border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:15px;font-weight:600}
.btn.play{background:var(--amber);color:#221806;border-color:var(--amber);min-width:116px;text-align:center}
.btn.play.on{background:#372c46;color:var(--sand);border-color:var(--line)}
.readout{margin-left:auto;text-align:right;line-height:1.3}
.readout .big{font-size:21px;font-weight:700;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.readout .small{font-size:10.5px;color:var(--dim);letter-spacing:.08em}
#roll{width:100%;height:210px;display:block;border-radius:10px;background:#171226;margin-top:12px;touch-action:none}
.rollnote{font-size:11px;color:var(--dim);margin:7px 0 0}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row label{flex:0 0 auto;font-size:13.5px;color:#cfc9dd}
.row .val{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13.5px;font-family:ui-monospace,Menlo,monospace}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8.5px;border-radius:50%;background:var(--sand)}
input[type=range]::-moz-range-track{height:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:var(--sand)}
select{background:#2b2338;border:1px solid var(--line);color:var(--sand);border-radius:9px;padding:8px 10px;font:inherit;font-size:13.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
.seg button{padding:7px 12px;font-size:13px;background:#241d31;color:var(--dim)}
.seg button.on{background:var(--sand);color:#181a2e;font-weight:600}
.sw{margin-left:auto;width:50px;height:29px;border-radius:15px;background:#332a42;position:relative;flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--sand);transition:transform .15s}
.sw.on{background:var(--amber)}
.sw.on::after{transform:translateX(21px)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.rh{background:var(--amber)} .dot.lh{background:var(--cyan)}
.dial{margin-left:auto;display:flex;align-items:center;gap:4px}
.dial button{background:#2b2338;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;min-width:34px;text-align:center}
.dial span{display:inline-block;min-width:46px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin:0 0 8px;font-weight:600}
.tblwrap{max-height:420px;overflow:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--dim);font-weight:500;font-size:10.5px;letter-spacing:.06em;padding:6px 5px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 5px;border-bottom:1px solid rgba(43,48,83,.5);vertical-align:top;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5}
.tbl tr.cur td{background:#2f2540}
.tbl td.m{color:var(--amber);font-weight:700;width:32px}
.tbl td.rh{color:#f0c98a}
.tbl td.lh{color:#a8d6e2}
.tbl td.mk{font-family:Georgia,serif;font-style:italic;color:var(--dim);font-size:10.5px}
.tbl td i{font-style:normal;font-size:9px;vertical-align:super;color:var(--granate);margin-left:1px}
.tbl td.lh i{color:var(--tilelt)}
.note{color:var(--dim);font-size:12px;line-height:1.75;margin:16px 0 0}
/* ===== リアルタイム解説 ===== */
:root{ --tile:#5c6f9c; --tilelt:#a3b9d8; --granate:#b0566a; --gsand:#ecdfc7; }

/* 構造マップ（画面上部に固定） */
.gmap{position:sticky;top:0;z-index:40;background:rgba(15,16,32,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.gmap-in{max-width:760px;margin:0 auto;padding:8px 16px 10px}
.gmap-lab{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;letter-spacing:.14em;
  color:var(--dim);margin-bottom:5px;font-family:ui-monospace,Menlo,monospace}
.gmap-lab b{color:var(--gsand);font-weight:500;letter-spacing:.1em;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gbar{position:relative;display:flex;gap:2px;height:22px}
.gseg{flex:1 1 0;border:0;padding:0;border-radius:2px;background:rgba(163,185,216,.2);
  transition:background .2s,transform .2s,opacity .2s}
.gseg[data-fam="theme"]{background:rgba(92,111,156,.66)}
.gseg[data-fam="call"]{background:rgba(176,86,106,.62)}
.gseg[data-fam="lyric"]{background:rgba(236,223,199,.42)}
.gseg.on{background:var(--gsand);transform:scaleY(1.3)}
.gseg.out{opacity:.25}
.gseg.sel{box-shadow:inset 0 0 0 2px var(--amber)}
.gnow{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--amber);
  box-shadow:0 0 7px rgba(227,166,72,.9);pointer-events:none;border-radius:1px}

/* 解説カード */
.guide{padding:0;overflow:hidden}
.g-prog{height:2px;background:rgba(127,182,190,.16)}
.g-prog i{display:block;height:100%;width:0;background:var(--amber)}
.g-top{display:flex;align-items:center;gap:9px;padding:12px 14px 10px}
.g-fam{width:22px;height:3px;border-radius:2px;background:var(--tilelt);flex:0 0 auto}
.g-tag{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.g-mm{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--gsand)}
.g-live{display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(9,10,24,.45)}
.g-live .dyn{font-family:Georgia,serif;font-style:italic;font-size:16px;color:var(--amber);
  flex:0 0 auto;min-width:30px}
.g-live{flex-wrap:wrap}
.g-live .dyn b{font-weight:400}
.g-live .dyn i{font-style:normal;font-size:9px;color:var(--dim);margin:0 1px}
.g-live .mkw{font-family:Georgia,"Times New Roman",serif;font-style:italic;
  color:var(--gsand);font-size:14px}
.g-live .mkw .from{font-family:ui-monospace,Menlo,monospace;font-style:normal;
  font-size:9.5px;color:var(--dim);margin-left:7px;letter-spacing:.08em}
.g-live .gl{font-size:11.5px;color:var(--dim);display:block;margin-top:1px}
.g-live.flash{animation:gflash .9s ease}
@keyframes gflash{0%{background:rgba(227,166,72,.3)}100%{background:rgba(9,10,24,.45)}}
.g-next{font-size:10.5px;color:var(--dim);padding:8px 14px 0;font-family:ui-monospace,Menlo,monospace}
.g-next span{display:inline-block;margin-right:14px}
.g-next b{color:#cfc9dd;font-weight:400}
.g-body{padding:13px 14px 4px}
.g-ttl{font-size:16px;font-weight:600;margin:0 0 4px;line-height:1.55;letter-spacing:.02em}
.g-ital{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:var(--tilelt);
  font-size:13px;margin:0 0 13px;line-height:1.6}
.g-body p{font-size:14px;color:#cbd0ea;margin:0 0 11px;line-height:1.85}
.g-notes{list-style:none;padding:0;margin:13px 0 0}
.g-notes li{padding:8px 0 8px 13px;border-left:2px solid rgba(30,110,126,.75);font-size:13px;
  color:#aeb6da;margin-bottom:7px;line-height:1.8}
.g-notes li b{color:var(--gsand);font-weight:600}
.v-tech .g-notes li{border-left-color:var(--granate)}
.g-step{font-family:ui-monospace,Menlo,monospace;color:var(--granate);font-size:10.5px;
  letter-spacing:.1em;margin-right:8px}
.guide.view-music .v-tech{display:none}
.guide.view-tech .v-music{display:none}
.g-fade{animation:gfade .5s ease}
@keyframes gfade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
mark{background:rgba(194,42,58,.3);color:#fff;padding:0 3px;border-radius:2px}
.chord{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--gsand)}
.g-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 14px 12px}
.g-ctl .seg{margin-left:0}
.btn.sm{padding:7px 11px;font-size:12.5px;font-weight:500;border-radius:9px}
.btn.sm.arrow{min-width:38px;text-align:center}
.g-follow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.g-follow label{font-size:13px;color:#cfc9dd}
.g-follow .hint{font-size:10.5px;color:var(--dim)}

/* 4つの鍵 */
details.keys{background:var(--panel);border:1px solid var(--line);border-radius:14px;

<details class="keys">
  <summary>この曲を貫く4つの仕掛け</summary>
  <div class="keys-in">
    <h4>① 冒頭2小節は「主題」ではなく「身振り」</h4>
    <p>低音が <span class="chord">F1 → F2 → C3</span> と駆け上がり、3拍目で <span class="chord">G–B♭–D</span>（ト短調＝ii）の和音を両手同時に <span class="chord">sf</span> で叩く。ヘ長調の曲なのに、最初に鳴る和音は主和音ではありません。そこから右手が一気に転げ落ちる。旋律とは呼びにくい、ただの一振りです。この身振りは <b>m.1 / m.7 / m.66 / m.72</b> の4回だけ現れ、しかも <b>sf が書かれているのはその4か所だけ</b>。曲を4つに区切る柱として置かれています。</p>
    <h4>② 主題は「ソ・ファ・ソ・ラ・ソ」— ほとんど動かない</h4>
    <p>m.3から始まる主題は、G を中心に隣の音へ寄り道して戻るだけの回音形です。音域は狭く、跳躍もない。動かない旋律の下で<b>ベースと和声だけが変わっていく</b>ので、聴こえてくる変化はほぼ全部が和声の変化です。ドビュッシー28歳、まだ和声で語ることを覚えたばかりの時期の書き方でもあります。</p>
    <h4>③ 高い E の鐘（m.20〜）</h4>
    <p>m.20 で ♭が消え、B♮ の世界（ハ長調／イ短調）に移ると同時に、右手のいちばん上に <span class="chord">E6</span> が置かれます。以後この音が繰り返し打たれ、和音が下で変わっても E だけが動かない。狭い主題部との対比で、ここだけ空間が上に開きます。</p>
    <h4>④ ff は最後の2小節だけ</h4>
    <p>f は9か所ありますが、<b>ff は m.87–88 の2小節のみ</b>。最高音 <span class="chord">B♭6</span> も m.85 の一度きり。長い poco a poco cresc.（m.60〜）から二度の上昇を経て、頂点は最後まで取っておかれます。</p>
    <div class="pull">前奏曲という題ですが、何かの前ではない。<br>クラヴサン奏者たちの「弾き始めの即興」を、1890年のパリで書き直したものです。</div>
    <p>1890年作曲、1905年出版。組曲の題はヴェルレーヌ『月の光』の一節「masques et bergamasques」に由来します。作曲から出版まで15年あり、その間にドビュッシーの語法は大きく変わりました。この曲にサロン風の素直さと、後年の響きの両方が同居しているのはそのためです。</p>
  </div>
</details>

const NOTES = S.n.map(a=>({abs:a[0],q:a[1],midi:a[2],h:a[3],g:a[4],m:a[5],sp:a[6],arp:a[7],ao:a[8],fg:a[9],ar:a[10]}));
const ENV = S.e, ENVN = ENV[0].length;
const MS = S.m.map(a=>({n:a[0],start:a[1],L:a[2],sig:a[3],mk:a[4],dy:a[5]}));
const MCOUNT = MS.length, TOTAL = MS[MCOUNT-1].start + MS[MCOUNT-1].L;
const LOMIDI = 22, HIMIDI = 96;

const DEF = {bpm:92,volR:50,volL:50,volM:55,tbR:'piano',tbL:'piano',rgA:1,rgB:MCOUNT,
             onR:1,onL:1,onM:0,div:4,tmp:1,dyn:1,loop:0,gview:'music',gfollow:1};
let ST = Object.assign({},DEF);
try{const j=localStorage.getItem('bergamasque_prelude_all');if(j)ST=Object.assign(ST,JSON.parse(j));}catch(e){}
function save(){try{localStorage.setItem('bergamasque_prelude_all',JSON.stringify(ST));}catch(e){}}

/* ---- tempo shape from the printed markings ---- */
/* SCALE = 小節アタマの速さ、SCALE2 = 小節終わりの速さ。間は直線でつなぐ。 */
const SCALE=new Float64Array(MCOUNT), SCALE2=new Float64Array(MCOUNT), HOLD=new Float64Array(MCOUNT);
(function(){
  for(let i=0;i<MCOUNT;i++){SCALE[i]=1;SCALE2[i]=1;}
  const at=(n,a,b)=>{SCALE[n-1]=a;SCALE2[n-1]=(b===undefined?a:b);};
  at(18,0.97,0.86);            // rit.（m.18〜19）
  at(19,0.86,0.80);
  at(20,1,1);                  // a tempo
  at(29,1,0.90);               // poco rit.
  at(43,1,0.93);               // dim. molto のところで一息
  at(44,0.95,1);
  at(86,0.98,0.94);            // 終結部の自然な広がり（編集上の付加）
  at(87,0.94,0.88);
  at(88,0.88,0.78);
  at(89,0.74,0.56);
  HOLD[MCOUNT-1]=3;            // 最後の和音を鳴らし切る
})();
function scaleAtPos(pos){
  if(!ST.tmp) return 1;
  const lo=measureAt(pos), f=(pos-MS[lo].start)/MS[lo].L;
  return SCALE[lo]+(SCALE2[lo]-SCALE[lo])*f;
}
let TMAP=null; const STEP=1/6;
function buildMap(){
  const base=60/ST.bpm/4, n=Math.round(TOTAL/STEP)+1;
  TMAP=new Float64Array(n); let t=0;
  for(let i=1;i<n;i++){ t+=STEP*base/scaleAtPos((i-0.5)*STEP); TMAP[i]=t; }
  if(ST.tmp) for(let i=0;i<MCOUNT;i++) if(HOLD[i]>0){
    const idx=Math.round((MS[i].start+MS[i].L)/STEP), add=HOLD[i]*60/ST.bpm;
    for(let j=idx;j<n;j++) TMAP[j]+=add;
  }
}
function posToSec(p){const i=p/STEP,a=Math.floor(i);if(a>=TMAP.length-1)return TMAP[TMAP.length-1];return TMAP[a]+(TMAP[a+1]-TMAP[a])*(i-a);}
function secToPos(s){let lo=0,hi=TMAP.length-1;if(s<=0)return 0;if(s>=TMAP[hi])return TOTAL;
  while(hi-lo>1){const m=(lo+hi)>>1;if(TMAP[m]<=s)lo=m;else hi=m;}
  const d=TMAP[hi]-TMAP[lo];return (lo+(d?(s-TMAP[lo])/d:0))*STEP;}
function measureAt(pos){let lo=0,hi=MCOUNT-1;while(lo<hi){const m=(lo+hi+1)>>1;if(MS[m].start<=pos)lo=m;else hi=m-1;}return lo;}

/* ---- audio ---- */
let ctx=null,bus=null;
function ensureAudio(){
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
    bus=ctx.createGain();bus.gain.value=0.85;bus.connect(ctx.destination);}
  if(ctx.state==='suspended')ctx.resume();
}
const TIMBRES={piano:'ピアノ風',guitar:'ハープ風（撥弦）',marimba:'マリンバ風',bell:'鐘のような音',sine:'正弦波'};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function voice(t,midi,dur,gain,kind){
  const f=mtof(midi),g=ctx.createGain();g.connect(bus);
  const rel=kind==='sine'?0.12:0.3,end=t+Math.max(0.1,dur)+rel;
  if(kind==='sine'){const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.02);
    g.gain.setValueAtTime(gain,t+Math.max(0.07,dur));g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t);o.stop(end+0.02);return;}
  if(kind==='guitar'){const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=1.1;
    lp.frequency.setValueAtTime(Math.min(6000,f*9),t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(220,f*2),t+0.35);
    o.connect(lp);lp.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.006);
    g.gain.exponentialRampToValueAtTime(gain*0.28,t+0.28);g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t);o.stop(end+0.02);return;}
  if(kind==='marimba'||kind==='bell'){
    const parts=kind==='marimba'?[[1,1],[4,0.28],[9.2,0.1]]:[[1,1],[2.76,0.35],[5.4,0.16]];
    const dec=kind==='marimba'?0.45:2.0;
    parts.forEach(([r,a])=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f*r;
      const gg=ctx.createGain();gg.gain.value=a;o.connect(gg);gg.connect(g);o.start(t);o.stop(t+dec+0.1);});
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec);return;}
  const o1=ctx.createOscillator();o1.type='triangle';o1.frequency.value=f;
  const o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=f*2;
  const g2=ctx.createGain();g2.gain.value=0.22;o2.connect(g2);
  const lp=ctx.createBiquadFilter();lp.type='lowpass';
  lp.frequency.setValueAtTime(Math.min(8000,f*8+900),t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(300,f*2.2),t+0.8);
  o1.connect(lp);g2.connect(lp);lp.connect(g);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.008);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain*0.35),t+Math.min(1.2,0.25+dur*0.5));
  g.gain.exponentialRampToValueAtTime(0.0001,end);
  o1.start(t);o1.stop(end+0.02);o2.start(t);o2.stop(end+0.02);
}
function click(t,strong,gain){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square';o.frequency.value=strong?2100:1350;o.connect(g);g.connect(bus);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);o.start(t);o.stop(t+0.06);
}
/* 強弱：印刷された強弱記号とヘアピン／cresc.・dim. の線を、16分ごとの包絡線にしてある。
   左手は、左手だけに書かれた指示（m.52・m.54）があるときだけ右手と分かれる。 */
function envAt(n){
  const i=Math.max(0,Math.min(ENVN-1,Math.round(n.abs)));
  return ENV[n.h][i];
}
function gainFor(n){
  let g = ST.dyn ? envAt(n) : 0.42;
  if(ST.dyn){
    if(n.ar & 8) g *= 1.45;        // sf
    else if(n.ar & 2) g *= 1.22;   // >
  }
  return Math.min(1.0, g);
}

/* ---- scheduling (look-ahead: 先の0.5秒ぶんだけ予約する) ---- */
let playing=false,anchorT=0,anchorP=0,baseSec=0,noteIdx=0,metro=[],metroIdx=0,schedId=null,raf=null;
let horizon=0;   /* ここまでは既に音を予約済み、という時刻 */
const rangeA=()=>MS[ST.rgA-1].start, rangeB=()=>MS[ST.rgB-1].start+MS[ST.rgB-1].L;
const LOOK=0.5;
function secOf(p){return anchorT+posToSec(p)-baseSec;}
function firstNoteAt(pos){
  let lo=0,hi=NOTES.length;
  while(lo<hi){const m=(lo+hi)>>1; if(NOTES[m].abs<pos-1e-6) lo=m+1; else hi=m;}
  return lo;
}
function buildMetro(){
  metro=[];
  if(!ST.onM||ST.volM<=0) return;
  const step=16/ST.div;
  for(let mi=ST.rgA-1;mi<ST.rgB;mi++)
    for(let k=0;k*step<MS[mi].L-1e-6;k++) metro.push([MS[mi].start+k*step,k===0]);
}
function seekTo(pos,flush){
  ensureAudio();
  if(flush) flushAudio();
  const a=rangeA(),b=rangeB();
  if(pos<a||pos>=b) pos=a;
  anchorP=pos; baseSec=posToSec(pos); anchorT=ctx.currentTime+0.12;
  noteIdx=firstNoteAt(pos);
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pos-1e-6) metroIdx++;
}
function schedTick(){
  if(!playing||!ctx) return;
  const now=ctx.currentTime, until=now+LOOK, b=rangeB();
  horizon=until;
  let budget=48;                                  // 1回のtickで予約する上限
  while(noteIdx<NOTES.length&&budget>0){
    const idx=noteIdx, n=NOTES[noteIdx];
    if(n.abs>=b){ noteIdx=NOTES.length; break; }
    const t=n.g?secOf(n.abs)-0.095:secOf(n.abs);
    if(t>until) break;
    noteIdx++;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const gv=gainFor(n)*((n.h===0?ST.volR:ST.volL)/100)*(n.g?0.55:1);
    if(gv<=0) continue;
    let dur=n.g?0.09:posToSec(Math.min(b,n.abs+n.q))-posToSec(n.abs);
    if(n.ar & 1) dur=Math.max(0.06,dur*0.45);          // スタッカート
    else if(n.ar & 4) dur=dur*1.02;                     // テヌート
    const roll = n.arp ? n.ao*0.045 : 0;
    voice(Math.max(now,t+roll),n.midi,Math.max(0.08,dur-roll),gv,n.h===0?ST.tbR:ST.tbL);
    budget--;
  }
  while(metroIdx<metro.length){
    const t=secOf(metro[metroIdx][0]);
    if(t>until) break;
    click(Math.max(now,t),metro[metroIdx][1],ST.volM/100*0.5);
    metroIdx++;
  }
  if(now>=secOf(b)-0.02){
    if(ST.loop) seekTo(rangeA());
    else { stopAll(); anchorP=rangeA(); draw(); label(); }
  }
}
function curPos(){
  if(!playing||!ctx) return anchorP;
  return Math.min(rangeB(),Math.max(rangeA(),secToPos(baseSec+(ctx.currentTime-anchorT))));
}
function stopAll(){
  if(schedId){clearInterval(schedId);schedId=null;}
  playing=false;
  if(ctx){bus.disconnect();bus=ctx.createGain();bus.gain.value=0.85;bus.connect(ctx.destination);}
  if(raf){cancelAnimationFrame(raf);raf=null;}
}
function start(){
  ensureAudio(); buildMap();
  let p=anchorP; if(p>=rangeB()-1e-6||p<rangeA()) p=rangeA();
  playing=true; seekTo(p); schedTick();
  schedId=setInterval(schedTick,60);
  tick(); label();
}
function pause(){const p=curPos();stopAll();anchorP=p;draw();label();}
function reset(){stopAll();anchorP=rangeA();draw();label();}
/* ---- 設定変更の扱い ----------------------------------------------
   以前は音量でもテンポでも reflow() → seekTo() を呼んでいたため、
   先読み（0.5秒）で既に予約済みの音を、もう一度予約し直していた。
   その結果、変更した瞬間だけ同じ箇所が二重に鳴っていた。
   予約をやり直すのは「本当に位置が飛ぶとき」だけにする。            */
function flushAudio(){          /* 予約済みの音を破棄する（位置が飛ぶときだけ） */
  if(ctx){bus.disconnect();bus=ctx.createGain();bus.gain.value=0.85;bus.connect(ctx.destination);}
}
function retime(){              /* テンポなど時間軸が変わる変更：継ぎ目なく差し替える */
  if(!playing||!ctx){ buildMap(); draw(); return; }
  const now=ctx.currentTime;
  const pNow=curPos();                                   /* 旧マップでの現在地 */
  const pEdge=Math.min(rangeB(),                         /* 旧マップでの予約済みの先端 */
    secToPos(baseSec+Math.max(0,horizon-anchorT)));
  buildMap();
  anchorT=now; baseSec=posToSec(pNow);                   /* 表示も音も現在地でつなぐ */
  noteIdx=Math.max(noteIdx,firstNoteAt(pEdge+1e-6));     /* 予約済みは飛ばす＝二重に鳴らさない */
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;
}
function remetro(){             /* メトロノームの刻みが変わる変更 */
  if(!playing||!ctx){ buildMetro(); metroIdx=0; return; }
  const pEdge=secToPos(baseSec+Math.max(0,horizon-anchorT));
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;
}
function redraw(){ save(); if(!playing) draw(); }   /* 音量・音色など、予約し直す必要のない変更 */
function reflow(){ retime(); }
let lastFrame=0;
function tick(){
  raf=requestAnimationFrame(ts=>{
    if(ts-lastFrame>30){lastFrame=ts;draw();}
    if(playing) tick();
  });
}

/* ---- piano roll ---- */
const cv=document.getElementById('roll'),cx2d=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(1.5,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;cx2d.setTransform(DPR,0,0,DPR,0,0);
}
const PXP=9;                        // px per sixteenth（4/4なので1小節=144px）
function draw(){
  if(!W) resize();
  const pos=curPos(), view=W/PXP, left=pos-view*0.35;
  const g=cx2d;
  g.clearRect(0,0,W,H);
  g.fillStyle='#171226';g.fillRect(0,0,W,H);
  drawSectionBands(g,left);
  const yOf=m=>H-((m-LOMIDI)/(HIMIDI-LOMIDI))*H;
  // C rows
  g.fillStyle='rgba(255,255,255,.045)';
  for(let m=LOMIDI;m<=HIMIDI;m++) if(m%12===1){ const y=yOf(m); g.fillRect(0,y-1,W,2); }
  // measure lines
  g.strokeStyle='rgba(140,124,180,.35)';g.lineWidth=1;g.font='10px ui-monospace,Menlo,monospace';
  for(let i=0;i<MCOUNT;i++){
    const x=(MS[i].start-left)*PXP;
    if(x<-40||x>W+40) continue;
    g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();
    if(MS[i].n%2===1){g.fillStyle='rgba(163,160,180,.75)';g.fillText(MS[i].n,x+3,11);}
  }
  // notes（画面に入りうる範囲だけを走査）
  const vEnd=left+view;
  for(let i=firstNoteAt(left-48);i<NOTES.length;i++){
    const n=NOTES[i];
    if(n.abs>vEnd) break;
    if(n.abs+n.q<left) continue;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const x=(n.abs-left)*PXP, w=Math.max(3,(n.g?0.5:n.q)*PXP-1.5);
    const y=yOf(n.midi), h=Math.max(3,H/(HIMIDI-LOMIDI)-1);
    const on = pos>=n.abs && pos<n.abs+n.q;
    g.fillStyle = n.h===0 ? (on?'#ffd7a0':'#d8a05e') : (on?'#cfe0f7':'#8fa9cf');
    g.globalAlpha = n.g?0.6:1;
    g.fillRect(x,y-h/2,w,h);
    g.globalAlpha=1;
  }
  // playhead
  const px=(pos-left)*PXP;
  g.strokeStyle='#ece2cf';g.lineWidth=1.5;
  g.beginPath();g.moveTo(px,0);g.lineTo(px,H);g.stroke();
  readout(pos);
}
let ROWMAP=null;
function rowOf(n){                       /* 毎フレームの querySelector をやめる */
  if(!ROWMAP){ ROWMAP={};
    const tb=document.getElementById('tb');
    if(tb) tb.querySelectorAll('tr[data-m]').forEach(r=>{ROWMAP[r.dataset.m]=r;});
  }
  return ROWMAP[n]||null;
}
function readout(pos){
  const i=measureAt(pos);
  document.getElementById('rdM').textContent=MS[i].n;
  document.getElementById('rdB').textContent=Math.floor((pos-MS[i].start)/4)+1;
  const row=rowOf(MS[i].n);
  if(row!==lastRow){if(lastRow)lastRow.classList.remove('cur');if(row)row.classList.add('cur');lastRow=row;}
  guideUpdate(pos);
}
let lastRow=null;
window.addEventListener('resize',()=>{resize();draw();});

/* 指を左→右にスライドで先へ、右→左で戻る（相対移動） */
let dragging=false,dragX=0,dragP=0,moved=0,scrubPlay=false;
function applyDrag(){
  const p=Math.min(rangeB()-0.01,Math.max(rangeA(),dragP));
  anchorP=p; draw();          /* なぞっている間は音を予約し直さない */
}
cv.addEventListener('pointerdown',e=>{
  dragging=true;moved=0;scrubPlay=false;dragX=e.clientX;dragP=curPos();
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const dx=e.clientX-dragX; dragX=e.clientX; moved+=Math.abs(dx);
  dragP-=dx/PXP;                       /* 右へスライド＝戻る */
  if(moved>4&&playing){ scrubPlay=true; pause(); }   /* いったん止めてから探す */
  applyDrag();
});
function endDrag(){ dragging=false; if(scrubPlay){ scrubPlay=false; start(); } }
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);

/* ---- table ---- */
function sh(x){return x.replace('#','♯').replace('b','♭');}
function fmt(n){return sh(n.sp)+(n.fg?'<i>'+n.fg+'</i>':'')+(n.g?'*':'');}
/* トリルは1音ずつ展開してあるので、表では先頭だけを tr. として畳む */
function collapseTrill(ns){const o=[];for(let i=0;i<ns.length;i++){const n=ns[i];
  if(!(n.ar&16)){o.push(fmt(n));continue;}
  if(i>0&&(ns[i-1].ar&16))continue;
  let hi=n.midi;for(let j=i;j<ns.length&&(ns[j].ar&16);j++)hi=Math.max(hi,ns[j].midi);
  const up=ns.find(x=>(x.ar&16)&&x.midi===hi);
  o.push(sh(n.sp)+'〜'+sh(up?up.sp:'')+'<i>tr</i>');}
  return o;}
(function(){
  const tb=document.getElementById('tb');
  const byM=new Map();
  for(const n of NOTES){ if(!byM.has(n.m)) byM.set(n.m,[]); byM.get(n.m).push(n); }
  let html='';
  for(const m of MS){
    const ns=(byM.get(m.n)||[]).slice().sort((a,b)=>a.abs-b.abs||b.midi-a.midi);
    const rh=collapseTrill(ns.filter(n=>n.h===0)).join(' ')||'—';
    const lh=collapseTrill(ns.filter(n=>n.h===1)).join(' ')||'—';
    const dy=(m.dy||[]).map(d=>d[1]).join(' ');
    html+='<tr data-m="'+m.n+'"><td class="m">'+m.n+'</td><td>'+m.sig+'</td>'+
      '<td class="rh">'+rh+'</td><td class="lh">'+lh+'</td><td class="mk">'+((m.mk||'')+' '+dy).trim()+'</td></tr>';
  }
  tb.innerHTML=html;
})();
document.getElementById('foot').textContent=
 '音高とリズムはMusicXMLの音符データ（音部記号の変化・調号・臨時記号・付点・連符・タイ・アルペジオ・アーティキュレーション・運指）から機械的に復元しました。全89小節・1746音、各声部の音価合計が4/4と一致することを全小節で検算済みです。運指は楽譜に印刷されたものをそのまま採っています（922音ぶん。和音にまとめて書かれた数字は上の音から順に割り当てました）。強弱は、印刷された強弱記号とヘアピン／cresc.・dim. の線から16分音符ごとの包絡線を作って反映しています。テンポ変化は印刷された rit.・a tempo・poco rit. にもとづき、最後の4小節の広がりだけは編集上の付加です。m.65 のトリル（C6–D6、運指2-3）は32分音符に展開して鳴らしています。m.52・54 の B♭1+F2 と m.56・58 の A1+E2 は、次の小節までタイで伸ばしています（元データはこのタイを落としており、そのため m.53・55 では直後のト音記号が適用されて同じ位置の符頭が G3/D4 になっていました。この2音は削除しています）。スラー・ペダルとタッチの表情は再現していません。設定は自動保存されます。';

/* ---- wiring ---- */
const $=id=>document.getElementById(id);
function label(){const b=$('play');b.textContent=playing?'❚❚ 一時停止':'▶ 再生';b.classList.toggle('on',playing);}
function sel(id,cur){const s=$(id);s.innerHTML='';
  Object.entries(TIMBRES).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;if(k===cur)o.selected=true;s.appendChild(o);});}
sel('tbR',ST.tbR);sel('tbL',ST.tbL);
$('tbR').onchange=e=>{ST.tbR=e.target.value;save();redraw();};
$('tbL').onchange=e=>{ST.tbL=e.target.value;save();redraw();};
function slider(id,key,out,after){const el=$(id);el.value=ST[key];if(out)$(out).textContent=ST[key];
  el.addEventListener('input',()=>{ST[key]=+el.value;if(out)$(out).textContent=ST[key];save();if(after)after();});}
slider('bpm','bpm','bpmV',retime);
slider('volR','volR','volRV',redraw);
slider('volL','volL','volLV',redraw);
slider('volM','volM','volMV',redraw);
function rangeUI(){$('rgAV').textContent=ST.rgA;$('rgBV').textContent=ST.rgB;}
document.querySelectorAll('.dial button').forEach(b=>{
  b.addEventListener('click',()=>{
    const d=+b.dataset.d;
    if(b.dataset.t==='A') ST.rgA=Math.min(ST.rgB,Math.max(1,ST.rgA+d));
    else ST.rgB=Math.max(ST.rgA,Math.min(MCOUNT,ST.rgB+d));
    rangeUI();save();reset();
  });
});
rangeUI();
function toggle(id,key,after){const el=$(id);el.classList.toggle('on',!!ST[key]);
  el.addEventListener('click',()=>{ST[key]=ST[key]?0:1;el.classList.toggle('on',!!ST[key]);save();if(after)after();});}
toggle('onR','onR',redraw);toggle('onL','onL',redraw);toggle('onM','onM',remetro);
toggle('onTmp','tmp',retime);toggle('onDyn','dyn',redraw);toggle('onLoop','loop');
const seg=$('segM');
[...seg.children].forEach(b=>{b.classList.toggle('on',+b.dataset.v===ST.div);
  b.addEventListener('click',()=>{ST.div=+b.dataset.v;save();
    [...seg.children].forEach(x=>x.classList.toggle('on',x===b));remetro();});});
$('play').addEventListener('click',()=>{ensureAudio();playing?pause():start();});
$('stop').addEventListener('click',reset);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx&&ctx.state==='suspended')ctx.resume();});
document.body.addEventListener('touchstart',()=>{if(ctx&&ctx.state==='suspended')ctx.resume();},{passive:true});
buildMap();resize();anchorP=rangeA();draw();label();
const SEC = [
{from:1,to:2,fam:"call",tag:"Ouverture",
 title:"呼びかけ — 主和音を鳴らさずに始める",
 ital:"Moderato, f — sf",
 body:["低音が <span class=\"chord\">F1 → F2 → C3</span> と駆け上がり、3拍目で <span class=\"chord\">G–B♭–D</span> の和音を <span class=\"chord\">sf</span> で叩く。ヘ長調の曲なのに、最初に立つ和音は主和音ではなく <b>ii（ト短調）</b> です。",
 "そこから右手が2小節目いっぱいをかけて転げ落ちてくる。旋律ではなく、弾き始めの一振り。クラヴサン奏者が鍵盤の具合をたしかめるために弾いた即興的な前奏（prélude non mesuré）の身振りを、そのまま19世紀末に持ち込んだ形です。"],
 notes:[["構造","この身振りは <b>m.1 / m.7 / m.66 / m.72</b> の4回だけ現れます。<mark>sf が書かれているのもこの4か所だけ</mark>で、曲を大きく4つに区切る柱として機能します。"],
 ["和声","主和音（F）は m.3 まで出てきません。冒頭は「まだ着地していない」状態で、次の小節へ落ちるためだけに置かれています。"]],
 tech:[["01","1拍目の F1 は打つのではなく、腕の重さを落として置く。ここで叩くと、あとの sf が効きません。楽譜の運指は左手 5→1→2→5。手を広げるのではなく、跳んで置き直す運指です。"],
 ["02","sf は「強く」ではなく「そこだけ違う」。前の2拍を控えめに保ち、3拍目で初めて両手が同時に鳴る、という設計を守るだけで自然に浮き上がります。"],
 ["03","m.2 の下降は16分音符ですが、実際には減衰の演出です。上から下へ均等に弾かず、下に行くほどわずかに軽くする。指は3-4-3-2-1系の型で、手首を左へ運びながら流す。"],
 ["04","ペダルは3拍目の和音で踏み、下降の途中で一度浅く戻す。最後まで踏みっぱなしにすると、m.3の p が濁った状態から始まってしまいます。"]]},

{from:3,to:6,fam:"theme",tag:"Theme",
 title:"主題 — ほとんど動かない旋律",
 ital:"p",
 body:["<span class=\"chord\">ソ・ファ・ソ・ラ・ソ</span>。Gを中心に隣の音へ寄り道して戻るだけの回音形が主題です。音域は5度に収まり、跳躍もない。",
 "その代わりに動くのが低音と和声です。m.3 は <span class=\"chord\">F–A–C＋G</span>（F add9）、m.5 で B♭、m.6 で A minor 7。<b>同じ旋律が、下の和音が変わることで色を変える</b>という一点だけでこの4小節はできています。",
 "m.6 では左手にも <span class=\"chord\">F–G–A</span> の上行線が現れ、はじめて内声が歌い出します。"],
 notes:[["和声","主題に必ず付いてくる9度（m.3のG）が、この曲の甘さの正体です。三和音に一音足すだけで機能和声のかたさが取れる、という後年のドビュッシーの常套手段が、すでにここに出ています。"],
 ["様式","1890年、28歳の作。まだフォーレやシャブリエに近いサロン風の書法で、『版画』（1903）の非機能的な世界とは別物です。ただし出版は1905年。15年ぶんの推敲が入っています。"]],
 tech:[["01","主題は右手の親指側（1-2-3指）で弾きます。上に和音を持ちながら内声を歌う形なので、まず<b>主題の音だけを取り出して弾き、次に和音を足す</b>。逆順だと必ず和音が勝ちます。"],
 ["02","印刷された運指は 3-2-3-4-3 が基本形。同じ音（G）に同じ指（3）が戻ってくるので、手の位置を動かさずに済みます。これを崩さないほうが安全です。"],
 ["03","p は音量ではなく密度。鍵盤を底まで使いつつ、打鍵の速度だけ落とす。指を上げて弱く叩くと、音がやせて旋律が聴こえなくなります。"],
 ["04","低音の変化（F→B♭→A）を毎回聴いてから右手を出す。主題が動かないぶん、聴かせるべき情報は全部左手にあります。"]]},

{from:7,to:8,fam:"call",tag:"Ouverture 2",
 title:"二度目の呼びかけ — 完全な反復",
 ital:"f — sf",
 body:["m.1–2 がそのまま戻ります。音符レベルで完全な繰り返しで、変奏はありません。",
 "つまりここまでの6小節は「呼びかけ→主題→呼びかけ」という単純な枠取り。前奏曲というより、リフレインを持つロンドの入口に近い作りです。"],
 notes:[["構造","同一の反復は「時間が進んでいない」ことの表現でもあります。この曲が本当に動き出すのは m.9 から。"]],
 tech:[["01","一度目と同じ音色・同じ間合いで弾く。ここで表情を変えると、m.9 以降の変化が変化として聴こえなくなります。録音して1回目と聴き比べるのが確実。"],
 ["02","ただしペダルの残し方だけは変えてよい。次に来るのが p の主題ではなく<b>E♭を含む翳った和音</b>なので、余韻をやや長めに残すと接続が滑らかになります。"]]},

{from:9,to:14,fam:"theme",tag:"Variant",
 title:"E♭ が入る — 主題が翳り、B♭の保続へ",
 ital:"p",
 body:["m.9 で <span class=\"chord\">E♭</span> が現れます（C–E♭–G–B♭）。旋律はほぼ同じなのに、一音の変化で長調の明るさが抜ける。m.10 では <span class=\"chord\">E♭–G–B♭–D</span>（E♭ major 7）まで行き、ヘ長調から見て ♭VII の世界に踏み込みます。",
 "m.11 から低音が <span class=\"chord\">B♭</span> のオクターヴで固定され、その上を16分音符が絶え間なく動きます。m.11–12 の2小節がそのまま m.13–14 で繰り返される、二重の反復構造。",
 "この6小節は、主題部というより<b>次の頂点へ向かう助走</b>です。"],
 notes:[["和声","E♭ の導入はヘ長調をミクソリディア方向へ傾ける操作。転調ではなく旋法の借用で、行き先を決めないまま色だけ変える書き方です。"],
 ["構造","B♭ の保続音（m.11〜14）はこの曲で最初の長いペダルポイント。以後、G（m.60〜）、C（m.76〜）と、保続音が場面の土台になっていきます。"]],
 tech:[["01","m.11–14 は音数が最も多い区間（1小節あたり27〜40音）。まず<b>右手の最上声だけ</b>を抜き出して線として弾き、次に内声を足す。全部を均等に弾くと何も聴こえません。"],
 ["02","左手のB♭オクターヴは、1小節に1回だけ支えればよい。全部の打点に重さを乗せると重くなります。"],
 ["03","m.11–12 と m.13–14 は同じ音型ですが、二度目はすでに cresc. の途中。同じに弾かず、二度目を「もう少し前へ」出す。"],
 ["04","16分音符は指で刻まず、手首の小さな回旋で4つずつまとめる。1拍を1つの動作にすると、テンポが揺れても崩れません。"]]},

{from:15,to:19,fam:"theme",tag:"First climb",
 title:"最初の頂点 — cresc. から più f、そして rit.",
 ital:"cresc. → f → più f, rit.",
 body:["m.15 で低音が <span class=\"chord\">G</span> に移り、m.16 に cresc. が書かれます。m.17 は曲中でもっとも低い音域に密度が集まる小節で、そこから m.18 の <span class=\"chord\">più f</span> と <span class=\"chord\">rit.</span> へ。",
 "m.18–19 は <span class=\"chord\">B♭</span>（IV）の和音でためて、m.19 で F のオクターヴが下に置かれる。<b>属和音を経ずに次の場面へ渡す</b>ので、終止したという感じがしません。",
 "そして次の小節、世界が変わります。"],
 notes:[["和声","この rit. は終止のためではなく、調号が実質的に切り替わる境目のためのもの。B♭ を最後に鳴らして、♭のある世界に別れを告げています。"]],
 tech:[["01","cresc. の到達点は m.18 の più f。<b>4小節で4段</b>と決めて配分する。連続的に増やそうとすると m.16 のうちに天井へ着きます。"],
 ["02","m.17 は低音域に音が集まるので、そのまま弾くと団子になります。左手の最低音と右手の最高音だけを残す気持ちでバランスを取る。"],
 ["03","rit. は m.18 から。楽譜の rit. は m.18 に書かれているので、m.17 までは絶対に緩めない。ここを早めに緩めると、頂点が消えます。"],
 ["04","m.19 の最後で完全に止まりきらないこと。次の a tempo は「戻る」というより「別の場所が開く」ので、わずかに前へ残しておくと転換が自然になります。"]]},

{from:20,to:27,fam:"lyric",tag:"E pedal",
 title:"高い E の鐘 — ♭が消え、空間が上に開く",
 ital:"a tempo, p — più p",
 body:["調号の実質が変わり、<span class=\"chord\">B♮</span> の世界（イ短調／ハ長調）になります。同時に右手のいちばん上に <mark>E6</mark> が置かれ、以後この音が繰り返し打たれる。",
 "和声は <span class=\"chord\">A minor 7</span> と <span class=\"chord\">G9</span> の往復だけ。8小節あって<b>一度もハ長調に着地しません</b>。属和音と、その代理のあいだで揺れつづける。",
 "狭い音域に閉じていた主題部のあとで、ここだけ天井が抜けたように上へ開きます。m.20 の左手にはアルペジオ記号（A3–E4–C5）も付いています。"],
 notes:[["和声","AmとG9の交替は、機能的には「解決しない」ための仕掛け。着地しないことで、この8小節は場面ではなく<b>状態</b>になります。"],
 ["音域","E6 は m.20・21・24・26・27 に、A6 は m.25 に。高音がほぼ同じ位置に固定されるので、下の和音の変化だけが動いて聴こえます。"]],
 tech:[["01","E6 は旋律ではなく<b>鐘</b>。毎回同じ音量・同じ音色で置く。表情をつけると鐘でなくなります。5指の先端だけで、腕は使わない。"],
 ["02","左手のアルペジオ（m.20）は速く転がさない。下から順に、上の音が右手と同時に届くように配分する。上の音に合わせて弾くのがコツです。"],
 ["03","p と più p（m.23）の差を作るには、音量ではなくペダルの深さを変えるのが早い。m.23 から浅くすると、それだけで遠ざかって聴こえます。"],
 ["04","AmとG9の往復は和音の共通音が多いので、指をできるだけ鍵盤に残す。手を持ち上げて置き直すと、往復が「行き来」ではなく「並列」に聴こえてしまいます。"]]},

{from:28,to:35,fam:"still",tag:"Far keys",
 title:"遠い調をたどる — 属七の鎖と、ひとつの全音音階",
 ital:"poco rit. — più p, dim.",
 body:["m.28 で <span class=\"chord\">B9</span>（B–D♯–F♯–A–C♯）が現れます。ホ調の属和音。ヘ長調からもっとも縁の遠い和音のひとつで、ここから8小節、属七の性格を持つ和音が次々に乗り換わっていきます。",
 "B9 → Dm → Am7 → B7 → D9 → そして <mark>m.34 はほぼ全音音階</mark>（C–D–E–F♯–A♯）。この一小節だけ、調の重力が完全に抜けます。m.35 の <span class=\"chord\">E7</span> でようやく行き先が決まり、次の小節でイ短調へ帰着。",
 "1890年の作品にしては先を行っている箇所で、後年のドビュッシーがはっきり顔を出します。"],
 notes:[["和声","属七を「解決するもの」ではなく「色のついた素材」として並べる手つき。行き先ではなく、通り過ぎる景色として和音が使われています。"],
 ["構造","poco rit.（m.29）は減速の指示ですが、実質は<b>場面の継ぎ目</b>の印。ここで一度呼吸が変わります。"]],
 tech:[["01","この8小節は読譜負荷が跳ね上がります。D♯・A♯・G♯ を実音（E♭・B♭・A♭）に読み替えて指のポジションを固定し、目ではなく手に覚えさせる。"],
 ["02","m.34 の全音音階的な和音は、周りに馴染ませない。ほんの少し違う音色で置くと、この一小節が「異物」として立ちます。"],
 ["03","dim.（m.34）は次の m.36 の回帰を静かに迎えるためのもの。減らしすぎると m.36 が始まったことに気づかれません。p の一歩手前で止める。"],
 ["04","poco rit. は「少しだけ」。1小節で元に戻ります。ここを大きくためると、8小節の連鎖が途中で切れてしまいます。"]]},

{from:36,to:43,fam:"lyric",tag:"E pedal 2",
 title:"鐘の回帰、そして消灯",
 ital:"più p, dim. — molto pp",
 body:["m.20 の場面がほぼそのまま戻ります。ただし m.37 に F♯、m.41 に C♯ が混ざり、イ短調が一瞬イ長調に傾く。二度目のほうがわずかに明るく、そのぶん儚い。",
 "m.42 で ♭ が戻り、<span class=\"chord\">F–A–C</span> ＝ ヘ長調の和音が久しぶりに鳴ります。dim. から m.43 の <span class=\"chord\">molto pp</span> へ。",
 "m.43 は1拍目に音がない小節です。<b>曲の折り返し点は、和音ではなく空白</b>に置かれています。"],
 notes:[["構造","m.20–27 と m.36–43 が同じ素材で挟むことで、m.28–35 の遠出が「往復」として意味を持ちます。行って、帰ってくる。"],
 ["和声","m.41 の C♯（A majorへの傾き）から m.42 の F majorへ。半音の入れ替えだけで、8小節ぶりに♭の世界へ戻ります。"]],
 tech:[["01","一度目（m.20〜）より音を減らす方向で。同じ音量で弾くと、往復した意味がなくなります。E6 だけは同じ強さを保つ。"],
 ["02","m.42–43 の dim. molto は、<b>ペダルを浅くしていく</b>ことで作る。音量を落とすだけだと、ただ小さいだけになります。"],
 ["03","m.43 の1拍目の空白は数えて置く。ここを詰めると、後半全体の落ち着きが出ません。"]]},

{from:44,to:47,fam:"still",tag:"Low pedal",
 title:"低いペダル — B♭ と C7 の往復",
 ital:"pp",
 body:["<span class=\"chord\">B♭</span> のオクターヴと <span class=\"chord\">C7/E</span>（E–G–B♭–C）が2小節ずつ交替します。IV と V7 を、いちばん低い音域だけで鳴らす。",
 "右手の最高音は E4〜G4 あたりまで下がり、<b>曲中でもっとも音域が狭く、暗い</b>4小節です。E6 の鐘のあとに置かれているので、落差が大きい。",
 "属七が鳴っているのに解決しない。次に来るのは主和音ではなく、まったく別の場面です。"],
 notes:[["和声","C7 は本来ヘ長調へ強く解決したがる和音。それを解決させずに次の episodes へ渡すのが、この曲の後半のやり方です。"],
 ["音響","低音域に和音を密集させると濁ります。ドビュッシーはそれを承知で使っていて、ここでは濁りそのものが暗さの表現になっています。"]],
 tech:[["01","低音の和音は<b>ペダルを浅く</b>。半踏み以下で、倍音だけを拾う。深く踏むと音の塊になって輪郭が消えます。"],
 ["02","pp を保つには、指を鍵盤から離さないこと。この4小節は指を一度も持ち上げないつもりで弾く。"],
 ["03","B♭ と C7 の交替を「和音が変わった」と分かる程度には差をつける。低音の音色をわずかに変えるだけで十分です。"]]},

{from:48,to:55,fam:"still",tag:"Meno p",
 title:"meno p — 中間の歌",
 ital:"meno p — mf（右手）/ p（左手）",
 body:["<span class=\"chord\">meno p</span>＝「そこまで弱くしないで」。前の4小節が pp だったので、ここで少しだけ息を戻します。",
 "m.48–51 は <span class=\"chord\">F7</span>（F–A–C–E♭）の上で E♭ が繰り返し鳴る、静かなオスティナート。m.52 で <span class=\"chord\">B♭</span> に落ち着き、ここではじめて<b>右手 mf・左手 p という左右別々の強弱</b>が指定されます。旋律が右手にあることの明示です。",
 "m.52 の低音 <span class=\"chord\">B♭1+F2</span> は2小節ぶん保たれ、その上で内声が <span class=\"chord\">D5/F5 → D♭5/E5</span> と半音ずつ内側へ滑る。<b>低音は動かさず、上の2音だけを陰らせる</b>という操作です。m.56–59 の A1+E2 でも同じことをします。",
 "m.53・55 の内声には D♭ と E が同時に現れ、半音のぶつかりが色を濁らせます。"],
 notes:[["強弱","左手だけに強弱が書かれるのは全曲でこの2か所（m.52・m.54）だけ。それ以外は左右共通の指示です。"],
 ["構造","この8小節はヘ長調から見て B♭ 側（下属調方向）に沈んだ場所。次の m.56 で一気に反対側へ跳ぶための、低い踏み台になっています。"]],
 tech:[["01","右手 mf・左手 p は、音量差ではなく<b>打鍵の深さの差</b>で作る。右手は底まで、左手は表面で。同じ深さで音量だけ変えると、旋律が痩せます。"],
 ["02","m.48–51 の E♭ 反復は指を替えて（3-2-3-2）。同じ指の連打だと打楽器になり、meno p の温度が出ません。"],
 ["03","m.53・55 の半音のぶつかりを整理して綺麗にしないこと。濁りを残すのが正解で、そこがこの8小節の色です。"],
 ["04","meno p は「少し戻す」なので、mp くらいまで。ここで出しすぎると、m.56 の pp が落差として効かなくなります。"]]},

{from:56,to:59,fam:"still",tag:"Farthest",
 title:"いちばん遠い場所 — A と B の長三和音",
 ital:"pp",
 body:["<span class=\"chord\">A–C♯–E</span>（＋B）と、その全音上の <span class=\"chord\">B–D♯–F♯</span>。ヘ長調の曲のなかで、<b>これがもっとも遠い和音</b>です。長三和音を全音差で並べるだけという、機能和声の外側にある動き。",
 "m.57 では C♮ と G♯ が加わって響きが全音音階寄りに崩れ、和音の重心が消えます。pp、最高音は F♯6。",
 "ここまで来て、次の小節から一直線に帰路が始まります。"],
 notes:[["和声","全音で隣り合う長三和音の並置は、共通音がひとつもない移動。<mark>解決ではなく横滑り</mark>で、平行和音（プレーニング）の発想の芽です。"],
 ["構造","曲の最遠点。ここから m.60 の G、m.64 の B♭、m.65 の C9 を経て、m.66 でヘ長調へ戻る。<b>4小節ずつ確実に近づいていく設計</b>です。"]],
 tech:[["01","2つの和音を同じ音色で。近い／遠いの差をつけると、並置ではなく進行に聴こえてしまいます。"],
 ["02","pp ですが輪郭は保つ。遠い＝ぼやける、ではありません。小さくても和音の底（A1・E2）は明確に。"],
 ["03","ここは暗譜しておくと安心な4小節。臨時記号が多く、視覚的に迷うと pp が保てません。"]]},

{from:60,to:65,fam:"theme",tag:"Poco a poco",
 title:"poco a poco cresc. — 6小節かけて戻る",
 ital:"poco a poco cresc. — sempre cresc. → f",
 body:["低音が <span class=\"chord\">G</span> のオクターヴで固定され、その上に <span class=\"chord\">G–B♭–D–E</span>（G minor 6）。m.60–61 の2小節が m.62–63 で繰り返され、そこに <span class=\"chord\">poco a poco cresc.</span>、次いで <span class=\"chord\">sempre cresc.</span> が重ねられます。",
 "m.64 で <span class=\"chord\">B♭</span>、m.65 で <span class=\"chord\">C–D–F–G–B♭</span>（C9）＝ヘ長調の属和音に達して <span class=\"chord\">f</span>。<b>pp から f まで、6小節かけて一直線</b>です。",
 "m.65 の右手は <mark>C6 のトリル</mark>（上隣りは D6、運指 2-3）。属和音の上で音を震わせたまま、最後の4つの32分音符 C–D–E–F が m.66 の G6 へ橋を架けます。全曲でトリルはここ一度きりです。",
 "この曲でいちばん長い crescendo であり、いちばん分かりやすい設計の区間でもあります。"],
 notes:[["構造","G（m.60）→ B♭（m.64）→ C9（m.65）→ F（m.66）。属和音がきちんと用意されるのは、実は全曲でここだけです。"],
 ["装飾","トリルは主要音（C）から始めます。楽譜の運指が <b>2 3 2 3 2 … 3</b> と印刷されていて、2＝C から入ることが指定されています。"],
 ["和声","Gm6 は G–B♭–D に E を足した形。この E が次の B♭ 和音へのつなぎになっていて、和音を変えずに方向だけ示しています。"]],
 tech:[["01","6小節を<b>6段</b>に切って音量を割り当てる。pp / p / mp / mp+ / mf / f。段の中では平坦に保つと、最後まで余力が残ります。"],
 ["02","cresc. を左手の保続音で作らないこと。低音を増やすと重くなるだけです。増やすのは右手の上声と、和音の密度。"],
 ["03","m.60–61 と m.62–63 は同じ音型。二度目を明確に一段上げる。ここを同じにすると、6小節が停滞します。"],
 ["04","トリルは速さより均等さ。f のなかで鳴らすので、指を高く上げず2-3の交替だけで回す。最後の32分音符4つに入る瞬間だけ、わずかに広げて着地させると m.66 が決まります。"],
 ["05","m.65 の C9 で一度息を置く。次の m.66 が sf なので、その直前に間があるほど効きます。"]]},

{from:66,to:73,fam:"call",tag:"Reprise",
 title:"再現 — 三度目と四度目の呼びかけ",
 ital:"f — sf — p — f — sf",
 body:["冒頭の身振りが戻ります（m.66 と m.72、いずれも <span class=\"chord\">sf</span>）。4つの sf のうち後半2つがここに集中し、曲がはっきり後半に入ったことを告げる。",
 "あいだの m.68–71 は主題の再現ですが、そのままではありません。m.68 に <span class=\"chord\">C♯</span> が入って <span class=\"chord\">F–A–C♯</span> の増三和音になり、m.69 では E♭ が戻る。<b>同じ主題が、一度目より翳って聴こえる</b>ように書き換えられています。",
 "再現とは確認ではなく、記憶が濃くなって戻ってくることだ、という作り方です。"],
 notes:[["和声","増三和音（F–A–C♯）は上下どちらへも行ける宙吊りの響き。主和音の位置にこれを置くことで、再現なのに安定しない状態が作られます。"],
 ["構造","m.66–67 と m.72–73 が枠、m.68–71 が中身。冒頭の m.1–8 とまったく同じ配置で、ただし内容だけが変わっています。"]],
 tech:[["01","m.66 の sf は、直前の m.65 の f から地続きにしない。一度音量を落としてから打つと、身振りとして立ちます。"],
 ["02","m.68 の C♯ を聴かせる。ここが再現の唯一の変化なので、内声でも少しだけ長めに持つ。"],
 ["03","冒頭（m.1・m.7）と同じ運指・同じ手の形で。ここで別の弾き方をすると、聴き手は同じものが戻ってきたと認識できません。"],
 ["04","m.72–73 のあとは長い上昇が始まります。ここでペダルを一度完全に上げて、床をリセットしておく。"]]},

{from:74,to:80,fam:"theme",tag:"Second climb",
 title:"cresc. から molto cresc. — 二度目の上昇",
 ital:"p — cresc. — molto cresc. → f",
 body:["m.74–75 は <span class=\"chord\">D minor</span> 系の和音（左手にアルペジオ記号）で始まり、p。m.76 から低音が <span class=\"chord\">C</span> のオクターヴで固定され、<span class=\"chord\">cresc.</span>。",
 "m.78 で <span class=\"chord\">molto cresc.</span> が書かれ、同時に右手の最上声に <mark>G6</mark> が置かれて m.80 まで保たれます。高い一音を固定したまま下で和音を厚くしていく、m.20 の E6 と同じ手つきを、今度は f の側でやっている。",
 "m.80 で f に到達。ここから頂点までは一気です。"],
 notes:[["構造","m.60–65 の cresc. が pp → f、ここが p → f。二度目のほうが出発点が高く、到達までが短い。<b>同じ上昇を二度、二度目を速く</b>という配置です。"],
 ["音域","G6 の保続（m.78–80）は E6 の鐘の変形。静かな場面の道具を、そのまま頂点の道具に転用しています。"]],
 tech:[["01","molto cresc.（m.78）までは我慢。m.76–77 で出しすぎると m.81 の più f が作れません。m.77 の終わりで mf 程度に抑える。"],
 ["02","G6 の保続は5指で、腕を使わずに。ここで腕を落とすと、下の和音とバランスが逆転します。"],
 ["03","左手のCオクターヴ保続は、1小節に1回だけ深く、あとは軽く。全部を強打すると、cresc. の余地が最初になくなります。"],
 ["04","m.74–75 のアルペジオは、上の音が拍に合うように下から配分する。急いで転がすと、p の落ち着きが壊れます。"]]},

{from:81,to:86,fam:"theme",tag:"Climax",
 title:"più f — 頂点、そして最高音 B♭6",
 ital:"più f",
 body:["<span class=\"chord\">F1–F2</span> の低いオクターヴの上に <span class=\"chord\">A5–F6–A6</span>。両端が最大に開き、和音は <span class=\"chord\">F–A–C–E♭</span>（F7）です。m.81–82 と m.83–84 で同じことを二度。",
 "m.85 で <span class=\"chord\">B♭</span> に移り、右手の最上声が <mark>B♭6 — 全曲の最高音</mark>に達します。m.86 で <span class=\"chord\">G minor</span> に落ちる。",
 "頂点の和音が主和音（F）ではなく F7 → B♭ であること、つまり<b>下属調の側に開く頂点</b>であることが、この曲を華やかにしすぎない理由です。"],
 notes:[["和声","F7（E♭を含む）は B♭ へ行きたがる和音。頂点で属和音ではなく副次的な方向へ開くので、勝利的にならず、明るいまま少し切ない。"],
 ["音域","m.85 の B♭6 は一度だけ。二度と使われません。最高音を一度しか鳴らさないのは、冒頭の sf と同じ節約の仕方です。"]],
 tech:[["01","più f は f より上ですが、ff ではありません（ff は m.87 から）。ここで打ち切ると、最後の2小節に行き場がなくなる。<b>8割で置く</b>。"],
 ["02","両手が離れるので、目線は左手に。右手の高音は手の形を先に作っておけば見なくても届きます。"],
 ["03","m.85 の B♭6 は跳ね上げない。上から落とすのではなく、鍵盤に触れてから押し切ると、硬くならずに鳴ります。"],
 ["04","m.86 の G minor で一度重さを抜く。ここが谷になっていないと、m.87 の ff が段差になりません。"]]},

{from:87,to:89,fam:"call",tag:"Coda",
 title:"ff — 全曲でここだけ",
 ital:"ff",
 body:["<mark>ff が書かれているのは m.87 と m.88 の2小節だけ</mark>です。88小節ぶんの f と p の積み重ねが、この2小節のためにあります。",
 "m.87 は <span class=\"chord\">B♭–D–F＋C</span>、m.88 でようやく <span class=\"chord\">F–A–C</span> の主和音が全音域に開き、m.89 は <span class=\"chord\">F1–C2–F2</span> と <span class=\"chord\">F5–A5–C6–F6</span>。低音から高音まで F だけが残ります。",
 "冒頭で鳴らされなかった主和音が、最後の2小節でようやく、しかも最大の音量で置かれる。<b>ヘ長調であることの宣言を、89小節ぶん先送りにした曲</b>だと言えます。"],
 notes:[["構造","m.1 が ii（G minor）で始まり、m.88 で I（F major）に着く。88小節かけた I–ii の入れ替えが、この曲のいちばん大きな骨格です。"],
 ["組曲","このあと Menuet、Clair de lune、Passepied と続きます。第1曲がヘ長調で全開に終わることで、次の Menuet（イ短調）の落差が生きる配置になっています。"]],
 tech:[["01","ff は打鍵の速さで作る。腕を落として作ると音が割れます。指はすでに鍵盤に触れている状態から、一気に底へ。"],
 ["02","m.89 の最後の和音は下から順に鍵盤を捉えてから同時に沈める。両端が離れているので、上下がずれると和音に聴こえません。"],
 ["03","ペダルを離す時刻を決めておく。無音になる瞬間までが曲です。"],
 ["04","終わったあと手を上げるタイミングも設計する。演奏動作は音が消えるまで続いています。"]]}
];


/* ==========================================================
   リアルタイム解説
   ========================================================== */
var GREADY=false;
const FAMLINE={theme:'#8fa9cf',call:'#b0566a',lyric:'#ecdfc7',still:'#8b7fa4'};
const SECOF=new Int16Array(MCOUNT+2);
SEC.forEach((s,i)=>{for(let m=s.from;m<=s.to;m++) SECOF[m]=i;});

/* 標語の日本語 */
const GLOSS=[
  [/moderato/i,'中庸の速さで'],
  [/a tempo/i,'もとの速さに戻して'],
  [/poco a poco cresc/i,'少しずつ、だんだん強く'],
  [/sempre cresc/i,'絶えず強くしつづけて'],
  [/molto cresc/i,'大きくクレッシェンド'],
  [/pi[ùu] f/i,'さっきより強く'],
  [/pi[ùu] p/i,'さっきより弱く'],
  [/meno p/i,'そこまで弱くしないで'],
  [/molto pp/i,'ごく弱く（dim. molto の着地点）'],
  [/poco rit/i,'少しだけ遅く'],
  [/rit\./i,'だんだん遅くして'],
  [/cresc/i,'だんだん強く'],
  [/dim\./i,'だんだん弱く'],
  [/molto/i,'非常に']
];

const DYNGL={ppp:'きわめて弱く',pp:'とても弱く',p:'弱く',mp:'やや弱く',mf:'やや強く',f:'強く',ff:'とても強く',sf:'その音だけ強く'};
function glossOf(t){
  if(!t) return '';
  let s=t; const out=[];
  for(const [re,jp] of GLOSS){
    if(re.test(s) && out.indexOf(jp)<0){ out.push(jp); s=s.replace(re,' '); }
  }
  return out.join(' ／ ');
}
function cleanMk(t){
  return (t||'').replace(/\s+/g,' ').trim();
}

/* 標語・強弱のイベント表 */
const MK=[];
for(let i=0;i<MCOUNT;i++){
  const t=(MS[i].mk||'').trim(), dy=[...new Set((MS[i].dy||[]).map(d=>d[1]))];
  if(t||dy.length) MK.push({i:i,n:MS[i].n,t:t,dy:dy});
}
const DYNL=[];                                    /* いま有効な、楽譜に印刷された強弱 */
(function(){let c='';
  for(let i=0;i<MCOUNT;i++){ const d=MS[i].dy||[]; if(d.length) c=d[d.length-1][1]; DYNL.push(c); }})();

/* 構造マップ */
const gbar=$('gbar');
gbar.innerHTML=SEC.map((s,i)=>
  '<button class="gseg" data-i="'+i+'" data-fam="'+s.fam+'" style="flex-grow:'+(s.to-s.from+1)+
  '" aria-label="m.'+s.from+'–'+s.to+' '+s.tag+'"></button>').join('')+
  '<i class="gnow" id="gnow"></i>';
const gsegs=[...gbar.querySelectorAll('.gseg')], gnow=$('gnow');
gsegs.forEach(b=>b.addEventListener('click',()=>{
  const i=+b.dataset.i;
  setFollow(1); jumpToMeasure(SEC[i].from);
}));
function mapRange(){
  gsegs.forEach((b,i)=>b.classList.toggle('out', SEC[i].to<ST.rgA||SEC[i].from>ST.rgB));
}
const _rangeUI=rangeUI;                       // 練習範囲を変えたらマップも塗り分け直す
rangeUI=function(){ _rangeUI(); mapRange(); };
function setMapOn(i){
  gsegs.forEach((b,k)=>b.classList.toggle('on',k===i));
}
function setMapSel(i){
  gsegs.forEach((b,k)=>b.classList.toggle('sel', !GS.follow && k===i));
}

/* 位置の移動 */
function jumpToMeasure(n){
  const p=MS[n-1].start;
  if(n<ST.rgA||n>ST.rgB){
    ST.rgA=Math.min(ST.rgA,n); ST.rgB=Math.max(ST.rgB,n); rangeUI(); save(); buildMap();
  }
  if(playing) seekTo(p,1); else { anchorP=p; }
  draw();
}
function practiceSection(i){
  const s=SEC[i];
  ST.rgA=s.from; ST.rgB=s.to; rangeUI(); save(); buildMap();
  if(playing) seekTo(rangeA(),1); else anchorP=rangeA();
  draw();
}

/* 解説の描画 */
var GS={idx:-1,mi:-1,follow:1,manual:0};
function renderGuide(i,anim){
  if(i==null||i<0||i>=SEC.length) i=0;
  const dir=(GS.idx<0||GS.idx===i)?0:(i>GS.idx?1:-1);   /* 進む＝1／戻る＝-1 */
  const s=SEC[i]; GS.idx=i;
  $('gfam').style.background=FAMLINE[s.fam];
  $('gtag').textContent=s.tag;
  $('gmm').textContent='m.'+s.from+'–'+s.to;
  $('gseglab').textContent=s.tag+' ／ m.'+s.from+'–'+s.to;
  const music='<div class="v-music">'+s.body.map(p=>'<p>'+p+'</p>').join('')+
    '<ul class="g-notes">'+s.notes.map(n=>'<li><b>'+n[0]+'</b>　'+n[1]+'</li>').join('')+'</ul></div>';
  const tech='<div class="v-tech"><ul class="g-notes">'+
    s.tech.map(n=>'<li><span class="g-step">'+n[0]+'</span>'+n[1]+'</li>').join('')+'</ul></div>';
  const b=$('gbody');
  b.innerHTML='<h3 class="g-ttl">'+s.title+'</h3><p class="g-ital">'+s.ital+'</p>'+music+tech;
  if(anim){
    const cls=dir>0?'g-in-next':(dir<0?'g-in-prev':'g-fade');
    b.classList.remove('g-fade','g-in-next','g-in-prev'); void b.offsetWidth; b.classList.add(cls);
  }
  setMapSel(i);
}
function updateLive(mi){
  let cur=null,nxt=null,txt=null;
  for(const e of MK){
    if(e.i<=mi){ cur=e; if(e.t) txt=e; }
    else { nxt=e; break; }
  }
  const t=cleanMk(txt?txt.t:'');
  $('gmk').innerHTML = t ? t+(txt.i<mi?'<em class="from">m.'+txt.n+'〜</em>':'') : '—';
  const d=DYNL[mi];
  $('ggl').textContent=[glossOf(txt?txt.t:''),DYNGL[d]||''].filter(Boolean).join('　/　');
  $('gdyn').innerHTML='<b>'+(d||'—')+'</b>';
  if(nxt){
    const d=nxt.n-MS[mi].n, g=glossOf(nxt.t), lab=cleanMk(nxt.t)||nxt.dy.join(' ');
    $('gnextmk').innerHTML='次の指示 → <b>'+(lab||'—')+'</b>'+(g?'（'+g+'）':'')+
      ' m.'+nxt.n+'・あと'+d+'小節';
  } else $('gnextmk').textContent='';
  const si=SECOF[MS[mi].n];
  if(si+1<SEC.length){
    const ns=SEC[si+1];
    $('gnextsec').innerHTML='次の場面 → <b>'+ns.tag+'</b> m.'+ns.from+'・あと'+(ns.from-MS[mi].n)+'小節';
  } else $('gnextsec').textContent='';
  const live=$('glive');
  if(cur&&cur.i===mi){ live.classList.remove('flash'); void live.offsetWidth; live.classList.add('flash'); }
}
function guideUpdate(pos){
  if(!GREADY) return;
  const mi=measureAt(pos);
  gnow.style.left=(((mi+(pos-MS[mi].start)/MS[mi].L)/MCOUNT)*100)+'%';
  if(mi!==GS.mi){
    GS.mi=mi;
    const si=SECOF[MS[mi].n];
    updateLive(mi);
    setMapOn(si);
    if(GS.follow&&si!==GS.idx) renderGuide(si,true);
  }
  const s=SEC[GS.idx];
  if(s){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    $('gprog').style.width=Math.max(0,Math.min(1,(pos-a)/(b-a)))*100+'%';
  }
}

/* 場面の色を、ピアノロールの背景に薄く敷く */
function drawSectionBands(g,left){
  if(!GREADY) return;
  const right=left+W/PXP;
  g.font='9px ui-monospace,Menlo,monospace';
  for(const s of SEC){
    const a=MS[s.from-1].start, b=MS[s.to-1].start+MS[s.to-1].L;
    if(b<left||a>right) continue;
    const x0=(a-left)*PXP, x1=(b-left)*PXP;
    g.globalAlpha=s.fam==='lyric'?0.07:0.11; g.fillStyle=FAMLINE[s.fam];
    g.fillRect(x0,0,x1-x0,H);
    g.globalAlpha=0.85;
    g.strokeStyle=FAMLINE[s.fam]; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(x0,0); g.lineTo(x0,H); g.stroke();
    g.fillStyle=FAMLINE[s.fam]; g.fillText(s.tag,x0+5,H-6);
    g.globalAlpha=1;
  }
}

/* 操作 */
function setFollow(v){
  GS.follow=v?1:0; ST.gfollow=GS.follow; save();
  $('gfollow').classList.toggle('on',!!GS.follow);
  $('ghint').textContent=GS.follow?'':'手動で表示中';
  if(GS.follow){ const si=SECOF[MS[Math.max(0,GS.mi)].n]; renderGuide(si,true); setMapSel(si); }
  else setMapSel(GS.idx);
}
$('gfollow').addEventListener('click',()=>setFollow(!GS.follow));
$('gprev').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.max(0,GS.idx-1),true); });
$('gnextbtn').addEventListener('click',()=>{ setFollow(0); renderGuide(Math.min(SEC.length-1,GS.idx+1),true); });
$('gprac').addEventListener('click',()=>{ practiceSection(GS.idx); setFollow(1); });
const gview=$('gview');
[...gview.children].forEach(b=>{
  b.classList.toggle('on',b.dataset.v===ST.gview);
  b.addEventListener('click',()=>{
    ST.gview=b.dataset.v; save();
    [...gview.children].forEach(x=>x.classList.toggle('on',x===b));
    $('guide').className='guide view-'+ST.gview;
  });
});
$('guide').className='guide view-'+ST.gview;

/* 起動 */
GS.follow=ST.gfollow?1:0;
$('gfollow').classList.toggle('on',!!GS.follow);
$('ghint').textContent=GS.follow?'':'手動で表示中';
mapRange();
GREADY=true;
GS.mi=-1;
renderGuide(SECOF[MS[measureAt(anchorP)].n],false);
draw();

function openSheet(){ $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden','false');
  document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden'; }
function closeSheet(){ $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden','true');
  document.documentElement.style.overflow=''; document.body.style.overflow=''; resize(); draw(); }
$('openSet').addEventListener('click',openSheet);

<script>
/* ---- 押した指に反応させる（iOSの :active は当てにならないので自前で） ---- */
(function(){
  var SEL='button,.sw', cur=null;
  function off(){ if(cur){ cur.classList.remove('tapdown'); cur=null; } }
  document.addEventListener('pointerdown',function(e){
    var t=(e.target&&e.target.closest)?e.target.closest(SEL):null;
    if(!t||t.disabled) return;
    off(); cur=t; t.classList.add('tapdown');
  },{passive:true});
  document.addEventListener('pointerup',off,{passive:true});
  document.addEventListener('pointercancel',off,{passive:true});
  document.addEventListener('pointermove',function(e){ if(cur&&e.buttons===0) off(); },{passive:true});
  window.addEventListener('blur',off);
})();
<\/script>

<details class="keys">
  <summary>この曲を貫く4つの仕掛け</summary>
  <div class="keys-in">
    <h4>① 9/8 — 3拍子なのに数えられない</h4>
    <p>1小節は付点4分×3。ところが主題はその枠にほとんど乗りません。冒頭は8分休符で始まり、最初に鳴るのは左手、右手の3度が入るのは3つ目の8分。以後も旋律は拍の頭を避け続けます。拍子は書かれているのに、拍が聞こえない。この曲の浮遊感はまずここから来ています。</p>
    <h4>② 低音の不在 — 最初の8小節に足場がない</h4>
    <p>m.1〜8で最も低い音は左手の F3〜A♭2 あたり。本当の低音 <span class="chord">D♭2</span> が鳴るのは m.9 です。8小節ぶん地面を隠しておいて、そこで初めて足場を置く。同じ旋律が二度目に戻ってきたときに景色が変わるのは、和声が変わったからではなく、下から支えが入ったからです。</p>
    <h4>③ 異名同音 — 同じ鍵盤、別の世界</h4>
    <p>曲は D♭ 長調（♭5つ）。ところが m.36 あたりから記譜は <span class="chord">C♯ / E</span> 系（♯）に切り替わり、m.37「En animant」から m.42 までは完全に♯の世界で書かれます。押す鍵盤はほぼ同じなのに、綴りが変わる。中間部だけ音楽が「別の光の下」に置かれます。</p>
    <h4>④ f はたった一度</h4>
    <p>印刷された強弱は ppp・pp・p・mf・f だけ。そのうち <mark>f は m.41 の一箇所のみ</mark>で、しかも次の小節にはもう dim. が書かれています。頂点は準備に14小節かけて、消えるのに1小節。曲全体は pp と ppp の中で進みます。</p>
    <div class="pull">描写ではなく、光の状態。<br>何が起きたかではなく、どれくらい明るいかを書いた曲。</div>
    <p>『ベルガマスク組曲』は1890年ごろの作曲、出版は1905年。曲集の名はヴェルレーヌの詩「月の光」（『艶なる宴』）の一節 masques et bergamasques に由来し、この第3曲も草稿では別の題（Promenade sentimentale）で呼ばれていました。ドビュッシー自身、後年この組曲を若書きとして持て余していますが、いま最も聴かれているのはこの1曲です。</p>
  </div>

const NOTES = S.n.map(a=>({abs:a[0],q:a[1],midi:a[2],h:a[3],g:a[4],m:a[5],sp:a[6],arp:a[7],ao:a[8]}));
const MS = S.m.map(a=>({n:a[0],start:a[1],L:a[2],sig:a[3],mk:a[4]}));
const TE = S.t, DE = S.d, PE = S.p;
const MCOUNT = MS.length, TOTAL = MS[MCOUNT-1].start + MS[MCOUNT-1].L;
const LOMIDI = 24, HIMIDI = 98;
const BASEQ = 48;            // 楽譜側の基準テンポ（♩=48 ＝ ♪=96）

const DEF = {bpm:96,volR:55,volL:55,volM:50,tbR:'piano',tbL:'piano',rgA:1,rgB:MCOUNT,

/* ---- 楽譜に書かれたテンポの推移 ---- */
function bisect(arr,p){let lo=0,hi=arr.length-1;
  if(p<=arr[0][0])return 0;
  while(lo<hi){const m=(lo+hi+1)>>1; if(arr[m][0]<=p) lo=m; else hi=m-1;}
  return lo;}
function tempoMul(pos){ return ST.tmp ? TE[bisect(TE,pos)][1]/BASEQ : 1; }
function dynAt(pos){
  const i=bisect(DE,pos);
  if(i>=DE.length-1) return DE[DE.length-1][1];
  const a=DE[i],b=DE[i+1];
  if(b[0]<=a[0]) return b[1];
  const f=Math.max(0,Math.min(1,(pos-a[0])/(b[0]-a[0])));
  return a[1]+(b[1]-a[1])*f;
}
function pedalEnd(pos){
  const i=bisect(PE,pos), s=PE[i];
  return (s && s[0]<=pos+1e-6 && pos<s[1]-1e-6) ? s[1] : pos;
}

/* ---- 位置（16分）↔ 秒 ---- */
let TMAP=null; const STEP=0.5;
function buildMap(){
  const base=60/ST.bpm/2, n=Math.round(TOTAL/STEP)+1;   // ST.bpm は8分音符
  TMAP=new Float64Array(n); let t=0;
  for(let i=1;i<n;i++){ t+=STEP*base/tempoMul((i-0.5)*STEP); TMAP[i]=t; }
}
function posToSec(p){const i=p/STEP,a=Math.floor(i);
  if(a>=TMAP.length-1)return TMAP[TMAP.length-1];
  return TMAP[a]+(TMAP[a+1]-TMAP[a])*(i-a);}
function secToPos(s){let lo=0,hi=TMAP.length-1;if(s<=0)return 0;if(s>=TMAP[hi])return TOTAL;
  while(hi-lo>1){const m=(lo+hi)>>1;if(TMAP[m]<=s)lo=m;else hi=m;}
  const d=TMAP[hi]-TMAP[lo];return (lo+(d?(s-TMAP[lo])/d:0))*STEP;}
function measureAt(pos){let lo=0,hi=MCOUNT-1;while(lo<hi){const m=(lo+hi+1)>>1;if(MS[m].start<=pos)lo=m;else hi=m-1;}return lo;}

/* ---- 音 ---- */
let ctx=null,bus=null,comp=null,PW=null,ring=new Map();
function ensureAudio(){
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
    comp=ctx.createDynamicsCompressor();
    try{comp.threshold.value=-16;comp.knee.value=26;comp.ratio.value=5;
        comp.attack.value=0.006;comp.release.value=0.28;}catch(e){}
    comp.connect(ctx.destination);
    bus=ctx.createGain();bus.gain.value=0.8;bus.connect(comp);
    /* ピアノ風の倍音を1つの波形にまとめ、音1つあたりの発振器を減らす */
    try{ PW=ctx.createPeriodicWave(
      new Float32Array([0,0,0,0,0,0,0]),
      new Float32Array([0,1,0.34,0.16,0.07,0.035,0.02]), {disableNormalization:false}); }catch(e){ PW=null; }
  }
  if(ctx.state==='suspended')ctx.resume();
}
const TIMBRES={piano:'ピアノ風',bell:'鐘のような音',glass:'グラスハープ風',marimba:'マリンバ風',sine:'正弦波'};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function voice(t,midi,dur,gain,kind){
  const f=mtof(midi);
  dur=Math.max(0.09,Math.min(dur,4.2));
  /* damp: 同じ高さが打ち直されたときだけ働く、独立した減衰用ゲイン。
     鳴っている音の包絡そのものには一切触らない（触ると、まだ先の時刻の予約を
     取り消した瞬間に音量が飛び、打鍵よりも前に音が聞こえてしまう）。 */
  const damp=ctx.createGain(); damp.gain.value=1; damp.connect(bus);
  const g=ctx.createGain(); g.connect(damp);
  const oscs=[];
  const prev=ring.get(midi);
  if(prev&&prev.end>t+0.02&&prev.start<t-0.004){
    try{
      prev.damp.gain.setTargetAtTime(0.0001,t,0.035);
      for(const o of prev.oscs){ try{o.stop(t+0.30);}catch(e){} }
    }catch(e){}
  }
  const end=t+Math.min(dur,3.0)+(kind==='sine'?0.12:0.34);
  ring.set(midi,{damp:damp,oscs:oscs,start:t,end:end});
  if(kind==='sine'){const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);oscs.push(o);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.02);
    g.gain.setValueAtTime(gain,t+Math.max(0.07,dur*0.7));g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t);o.stop(end+0.02);return;}
  if(kind==='glass'){const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;
    const o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=f*3.01;oscs.push(o,o2);
    const g2=ctx.createGain();g2.gain.value=0.12;o2.connect(g2);
    o.connect(g);g2.connect(g);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.09);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain*0.5),t+Math.min(2,dur));
    g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.start(t);o.stop(end+0.02);o2.start(t);o2.stop(end+0.02);return;}
  if(kind==='marimba'||kind==='bell'){
    const parts=kind==='marimba'?[[1,1],[4,0.28],[9.2,0.1]]:[[1,1],[2.76,0.3],[5.4,0.12]];
    const dec=kind==='marimba'?0.5:Math.min(3.2,dur+1.4);
    parts.forEach(([r,a])=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f*r;
      const gg=ctx.createGain();gg.gain.value=a;o.connect(gg);gg.connect(g);oscs.push(o);o.start(t);o.stop(t+dec+0.1);});
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec);return;}
  /* ピアノ風：倍音入りの単一波形＋ローパス。低音ほど長く残す */
  const o1=ctx.createOscillator();
  if(PW) o1.setPeriodicWave(PW); else o1.type='triangle';
  o1.frequency.value=f;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';
  lp.frequency.setValueAtTime(Math.min(8200,f*7+900),t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(320,f*2.1),t+1.1);
  o1.connect(lp);lp.connect(g);oscs.push(o1);
  const hold=Math.max(0.5,Math.min(2.6,1.9-(midi-24)/74*1.2));
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+0.008);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain*0.42),t+Math.min(dur,0.35));
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain*0.12),t+Math.min(dur,hold));
  g.gain.exponentialRampToValueAtTime(0.0001,end);
  o1.start(t);o1.stop(end+0.02);
}
function click(t,lv,gain){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square';o.frequency.value=lv===2?2100:(lv===1?1600:1250);o.connect(g);g.connect(bus);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain*(lv?1:0.7),t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);o.start(t);o.stop(t+0.06);
}

/* ---- バランス：旋律と伴奏 ---- */
const BAL=[[9,14,1,.85],[15,18,.92,1],[27,42,1,.72],[43,50,.95,.8],
           [51,58,1,.68],[59,65,1,.85],[66,72,.92,.8]];
function balOf(m,h){
  for(const b of BAL) if(m>=b[0]&&m<=b[1]) return h===0?b[2]:b[3];
  return 1;
}
/* 同時に鳴る音のうち、右手の最高音＝旋律を少し前に出す */
(function(){
  const g=new Map();
  for(const n of NOTES){ const k=n.abs+'/'+n.h; if(!g.has(k)) g.set(k,[]); g.get(k).push(n); }
  for(const arr of g.values()){
    arr.sort((a,b)=>a.midi-b.midi);
    const top=arr[arr.length-1], bot=arr[0];
    if(top.h===0) top.top=1;
    if(bot.h===1) bot.bot=1;
    if(arr.length>=3) for(let i=1;i<arr.length-1;i++) arr[i].inner=1;
  }
})();
function gainFor(n){
  let v=(ST.dyn?dynAt(n.abs):0.4)*balOf(n.m,n.h);
  if(n.top) v*=1.18; else if(n.inner) v*=0.88;
  if(n.bot) v*=1.05;
  return v;
}

let playing=false,anchorT=0,anchorP=0,baseSec=0,noteIdx=0,metro=[],metroIdx=0,schedId=null,raf=null;
let horizon=0;   /* ここまでは既に音を予約済み、という時刻 */
const rangeA=()=>MS[ST.rgA-1].start, rangeB=()=>MS[ST.rgB-1].start+MS[ST.rgB-1].L;
const LOOK=0.6, ARP_STEP=0.05;
function secOf(p){return anchorT+posToSec(p)-baseSec;}
function firstNoteAt(pos){
  let lo=0,hi=NOTES.length;
  while(lo<hi){const m=(lo+hi)>>1; if(NOTES[m].abs<pos-1e-6) lo=m+1; else hi=m;}
  return lo;
}
function buildMetro(){
  metro=[];
  if(!ST.onM||ST.volM<=0) return;
  const step=ST.div;
  for(let mi=ST.rgA-1;mi<ST.rgB;mi++)
    for(let k=0;k*step<MS[mi].L-1e-6;k++){
      const off=k*step;
      metro.push([MS[mi].start+off, off===0?2:(off%6===0?1:0)]);
    }

function seekTo(pos,flush){
  ensureAudio();
  if(flush) flushAudio();
  const a=rangeA(),b=rangeB();
  if(pos<a||pos>=b) pos=a;
  anchorP=pos; baseSec=posToSec(pos); anchorT=ctx.currentTime+0.12;
  noteIdx=firstNoteAt(pos);
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pos-1e-6) metroIdx++;
}
function schedTick(){
  if(!playing||!ctx) return;
  const now=ctx.currentTime, until=now+LOOK, b=rangeB();
  horizon=until;
  let budget=64;
  while(noteIdx<NOTES.length&&budget>0){
    const n=NOTES[noteIdx];
    if(n.abs>=b){ noteIdx=NOTES.length; break; }
    const t=n.g?secOf(n.abs)-0.1:secOf(n.abs);
    if(t>until) break;
    noteIdx++;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const gv=gainFor(n)*((n.h===0?ST.volR:ST.volL)/100)*(n.g?0.55:1);
    if(gv<=0) continue;
    let qq=n.q;
    if(ST.ped){ const pe=Math.min(pedalEnd(n.abs),n.abs+24); if(pe>n.abs+qq) qq=pe-n.abs; }
    const dur=n.g?0.1:posToSec(Math.min(TOTAL,n.abs+qq))-posToSec(n.abs);
    const roll=n.arp?n.ao*ARP_STEP:0;

    budget--;

function stopAll(){

/* ---- 設定変更の扱い ----------------------------------------------
   以前は音量でもテンポでも reflow() → seekTo() を呼んでいたため、
   先読み（0.5秒）で既に予約済みの音を、もう一度予約し直していた。
   その結果、変更した瞬間だけ同じ箇所が二重に鳴っていた。
   予約をやり直すのは「本当に位置が飛ぶとき」だけにする。            */
function flushAudio(){          /* 予約済みの音を破棄する（位置が飛ぶときだけ） */
  if(ctx){bus.disconnect();bus=ctx.createGain();bus.gain.value=0.8;bus.connect(comp||ctx.destination);}
  if(typeof ring!=="undefined") ring.clear();

function retime(){              /* テンポなど時間軸が変わる変更：継ぎ目なく差し替える */
  if(!playing||!ctx){ buildMap(); draw(); return; }
  const now=ctx.currentTime;
  const pNow=curPos();                                   /* 旧マップでの現在地 */
  const pEdge=Math.min(rangeB(),                         /* 旧マップでの予約済みの先端 */
    secToPos(baseSec+Math.max(0,horizon-anchorT)));
  buildMap();
  anchorT=now; baseSec=posToSec(pNow);                   /* 表示も音も現在地でつなぐ */
  noteIdx=Math.max(noteIdx,firstNoteAt(pEdge+1e-6));     /* 予約済みは飛ばす＝二重に鳴らさない */
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;

function remetro(){             /* メトロノームの刻みが変わる変更 */
  if(!playing||!ctx){ buildMetro(); metroIdx=0; return; }
  const pEdge=secToPos(baseSec+Math.max(0,horizon-anchorT));
  buildMetro(); metroIdx=0;
  while(metroIdx<metro.length&&metro[metroIdx][0]<pEdge-1e-6) metroIdx++;
}
function redraw(){ save(); if(!playing) draw(); }   /* 音量・音色など、予約し直す必要のない変更 */

let lastFrame=0;
function tick(){

const cv=document.getElementById('roll'),cx2d=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(1.5,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;cx2d.setTransform(DPR,0,0,DPR,0,0);
}
const PXP=7;
function draw(){
  if(!W) resize();
  const pos=curPos(), view=W/PXP, left=pos-view*0.35;
  const g=cx2d;
  g.clearRect(0,0,W,H);
  g.fillStyle='#0d1124';g.fillRect(0,0,W,H);
  drawSectionBands(g,left);
  const yOf=m=>H-((m-LOMIDI)/(HIMIDI-LOMIDI))*H;
  g.fillStyle='rgba(255,255,255,.045)';
  for(let m=LOMIDI;m<=HIMIDI;m++) if(m%12===1){ const y=yOf(m); g.fillRect(0,y-1,W,2); }
  g.strokeStyle='rgba(120,135,200,.32)';g.lineWidth=1;g.font='10px ui-monospace,Menlo,monospace';
  for(let i=0;i<MCOUNT;i++){
    const x=(MS[i].start-left)*PXP;
    if(x<-40||x>W+40) continue;
    g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();
    if(MS[i].n%2===1){g.fillStyle='rgba(152,160,189,.75)';g.fillText(MS[i].n,x+3,11);}
    g.strokeStyle='rgba(120,135,200,.12)';
    for(let k=1;k<3;k++){const bx=x+k*6*PXP;g.beginPath();g.moveTo(bx,0);g.lineTo(bx,H);g.stroke();}
    g.strokeStyle='rgba(120,135,200,.32)';
  }
  const vEnd=left+view;
  for(let i=firstNoteAt(left-40);i<NOTES.length;i++){
    const n=NOTES[i];
    if(n.abs>vEnd) break;
    if(n.abs+n.q<left) continue;
    if((n.h===0&&!ST.onR)||(n.h===1&&!ST.onL)) continue;
    const x=(n.abs-left)*PXP, w=Math.max(2.5,(n.g?0.5:n.q)*PXP-1.2);
    const y=yOf(n.midi), h=Math.max(3,H/(HIMIDI-LOMIDI)-1);
    const on = pos>=n.abs && pos<n.abs+n.q;
    g.fillStyle = n.h===0 ? (on?'#ffe9ae':'#d9c47f') : (on?'#c6e0ff':'#8fb8e8');
    g.globalAlpha = n.g?0.6:1;
    g.fillRect(x,y-h/2,w,h);
    g.globalAlpha=1;
  }
  const px=(pos-left)*PXP;
  g.strokeStyle='#e7ebf6';g.lineWidth=1.5;
  g.beginPath();g.moveTo(px,0);g.lineTo(px,H);g.stroke();
  readout(pos);
}
